<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SARVATRA Digital Bio-Link Maker</title>

<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:25px 15px 40px;
    font-family:
        Arial,
        "Noto Sans Telugu",
        sans-serif;
    background:
        linear-gradient(
            135deg,
            #eef7ff,
            #f4fff9
        );
    color:#172033;
}

.wrapper{
    width:100%;
    max-width:1100px;
    margin:auto;

    display:grid;
    grid-template-columns:
        minmax(300px,1fr)
        minmax(320px,420px);

    gap:35px;
    align-items:start;
}

/* =========================
   EDITOR
========================= */

.editor-panel{
    background:#ffffff;
    border-radius:22px;
    padding:24px;

    border:1px solid #dce7f2;

    box-shadow:
        0 15px 45px
        rgba(15,64,110,.12);
}

.logo-title{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:6px;
}

.logo-box{
    width:42px;
    height:42px;

    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;
    font-size:22px;
    font-weight:900;

    background:
        linear-gradient(
            135deg,
            #087cff,
            #00b86b
        );

    box-shadow:
        0 7px 18px
        rgba(0,125,255,.25);
}

h2{
    margin:0;
    font-size:23px;
    font-weight:900;

    background:
        linear-gradient(
            90deg,
            #087cff,
            #00a86b
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{
    color:#718096;
    font-size:13px;
    margin:
        0 0 20px;
}

/* =========================
   HOME BUTTON
========================= */

.home-btn{
    width:100%;
    border:0;
    padding:12px;

    border-radius:12px;

    background:
        linear-gradient(
            90deg,
            #087cff,
            #00a86b
        );

    color:white;
    font-size:14px;
    font-weight:800;

    cursor:pointer;
    margin-bottom:20px;

    box-shadow:
        0 7px 18px
        rgba(0,130,220,.18);
}

.home-btn:active{
    transform:scale(.98);
}

/* =========================
   FORM
========================= */

.form-group{
    margin-bottom:14px;
}

label{
    display:block;
    margin-bottom:6px;

    color:#526174;

    font-size:13px;
    font-weight:800;
}

input,
textarea,
select{
    width:100%;

    border:1px solid #d9e2ec;
    border-radius:11px;

    background:#f8fbfe;
    color:#172033;

    padding:11px 12px;

    outline:none;
    font-size:14px;

    transition:.2s;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#1685ff;

    box-shadow:
        0 0 0 3px
        rgba(22,133,255,.10);

    background:#fff;
}

textarea{
    resize:vertical;
}

.link-row{
    display:grid;

    grid-template-columns:
        105px 1fr;

    gap:7px;

    margin-bottom:8px;
}

/* =========================
   BUTTONS
========================= */

.btn-group{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:9px;

    margin-top:18px;
}

.action-btn{
    border:0;
    border-radius:11px;

    padding:12px 8px;

    color:#fff;

    font-size:13px;
    font-weight:800;

    cursor:pointer;

    transition:.2s;
}

.action-btn:hover{
    transform:translateY(-2px);
    filter:brightness(1.04);
}

.btn-jpg{
    background:#00a86b;
}

.btn-pdf{
    background:#e53935;
}

.btn-qr{
    background:#6d28d9;
}

.btn-share{
    grid-column:span 2;

    background:
        linear-gradient(
            90deg,
            #087cff,
            #00a86b
        );
}

/* =========================
   PREVIEW
========================= */

.preview-wrapper{
    display:flex;
    flex-direction:column;
    align-items:center;

    position:sticky;
    top:15px;
}

.preview-label{
    font-size:13px;
    font-weight:900;

    color:#5d6b7c;

    margin-bottom:10px;
}

.preview-container-box{
    padding:8px;
}

/* =========================
   PHONE
========================= */

.preview-panel{
    width:340px;
    height:620px;

    border:8px solid #18202b;
    border-radius:42px;

    padding:35px 20px 18px;

    position:relative;
    overflow:hidden;

    display:flex;
    flex-direction:column;
    align-items:center;

    background:
        linear-gradient(
            180deg,
            #1769e0 0%,
            #07111f 100%
        );

    box-shadow:
        0 25px 60px
        rgba(0,0,0,.28);

    transition:
        background .3s ease;
}

/* Phone notch */

.preview-panel:before{
    content:"";

    position:absolute;

    top:7px;
    left:50%;

    transform:translateX(-50%);

    width:105px;
    height:20px;

    background:#18202b;

    border-radius:0 0 14px 14px;

    z-index:5;
}

/* =========================
   AVATAR
========================= */

.avatar{
    width:88px;
    height:88px;

    border-radius:50%;

    object-fit:cover;

    border:3px solid #fff;

    margin-top:10px;

    background:#303946;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.30);
}

/* =========================
   PROFILE TEXT
========================= */

.profile-name{
    color:#fff;

    font-size:20px;
    font-weight:900;

    margin-top:12px;

    text-align:center;

    max-width:280px;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.profile-bio{
    color:#e7edf5;

    font-size:12px;

    text-align:center;

    margin:
        5px 0 14px;

    line-height:1.45;

    max-width:270px;

    max-height:36px;

    overflow:hidden;
}

/* =========================
   QUICK BUTTONS
========================= */

.quick-buttons{
    width:100%;

    display:flex;

    justify-content:center;

    gap:7px;

    margin-bottom:10px;

    flex-wrap:wrap;
}

.quick-btn{
    text-decoration:none;

    color:#fff;

    background:
        rgba(255,255,255,.12);

    border:
        1px solid
        rgba(255,255,255,.20);

    padding:
        7px 11px;

    border-radius:20px;

    font-size:11px;
    font-weight:800;

    backdrop-filter:blur(8px);
}

/* =========================
   LINKS
========================= */

.links-container{
    width:100%;

    display:flex;
    flex-direction:column;

    gap:9px;

    flex:1;

    overflow-y:auto;

    padding-right:2px;
}

.links-container::-webkit-scrollbar{
    width:3px;
}

.links-container::-webkit-scrollbar-thumb{
    background:
        rgba(255,255,255,.25);

    border-radius:10px;
}

.bio-link{
    width:100%;

    padding:12px 10px;

    border-radius:12px;

    border:
        1px solid
        rgba(255,255,255,.18);

    background:
        rgba(255,255,255,.10);

    color:#fff;

    text-decoration:none;

    text-align:center;

    font-size:13px;
    font-weight:800;

    backdrop-filter:blur(8px);

    transition:.2s;
}

.bio-link:hover{
    background:
        rgba(255,255,255,.20);

    transform:
        translateY(-1px);
}

/* =========================
   BRANDING
========================= */

.branding{
    margin-top:10px;

    color:
        rgba(255,255,255,.50);

    font-size:9px;

    font-weight:900;

    letter-spacing:2px;

    text-align:center;
}

/* =========================
   QR MODAL
========================= */

.qr-modal{
    display:none;

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.65);

    z-index:999;

    align-items:center;
    justify-content:center;

    padding:20px;
}

.qr-card{
    width:100%;
    max-width:330px;

    background:#fff;

    border-radius:20px;

    padding:25px;

    text-align:center;

    box-shadow:
        0 25px 60px
        rgba(0,0,0,.35);
}

.qr-card h3{
    margin:
        0 0 15px;

    color:#18202b;
}

#qrcode{
    display:flex;

    justify-content:center;

    margin-bottom:18px;
}

.close-qr{
    width:100%;

    border:0;

    border-radius:11px;

    padding:11px;

    background:#18202b;

    color:#fff;

    font-weight:800;

    cursor:pointer;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;

    left:50%;
    bottom:25px;

    transform:
        translate(-50%,120px);

    background:#172033;

    color:#fff;

    padding:
        11px 18px;

    border-radius:25px;

    font-size:13px;
    font-weight:800;

    z-index:2000;

    opacity:0;

    transition:.3s;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.25);
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}

/* =========================
   SHARED PROFILE
========================= */

.shared-mode{
    min-height:100vh;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        linear-gradient(
            135deg,
            #eef7ff,
            #f4fff9
        );
}

.shared-wrapper{
    width:100%;

    display:flex;

    justify-content:center;
}

.shared-actions{
    display:flex;

    gap:8px;

    margin-top:12px;
}

.shared-actions button{
    border:0;

    border-radius:10px;

    padding:11px 15px;

    color:#fff;

    background:
        linear-gradient(
            90deg,
            #087cff,
            #00a86b
        );

    font-weight:800;

    cursor:pointer;
}

.capture-area{
    display:inline-block;
}

/* =========================
   MOBILE
========================= */

@media(max-width:760px){

    body{
        padding:15px 10px 30px;
    }

    .wrapper{
        grid-template-columns:1fr;

        gap:25px;
    }

    .preview-wrapper{
        position:static;

        order:2;
    }

    .editor-panel{
        order:1;

        padding:18px;
    }

    .preview-panel{
        width:320px;
        height:590px;
    }
}

@media(max-width:360px){

    .preview-panel{
        width:300px;
        height:570px;

        padding-left:16px;
        padding-right:16px;
    }

    .link-row{
        grid-template-columns:
            90px 1fr;
    }
}

</style>
</head>

<body>

<div class="wrapper">

    <!-- =========================
         EDITOR
    ========================= -->

    <div class="editor-panel">

        <div class="logo-title">

            <div class="logo-box">
                S
            </div>

            <h2>
                SARVATRA
            </h2>

        </div>

        <p class="subtitle">
            Digital Bio-Link Maker
        </p>


        <!-- HOME -->

        <button
            class="home-btn"
            onclick="goHome()"
        >
            🏠 SARVATRA Home
        </button>


        <!-- PHOTO -->

        <div class="form-group">

            <label>
                Profile Photo
            </label>

            <input
                type="file"
                id="inPhoto"
                accept="image/*"
                onchange="previewFile(event)"
            >

        <!-- THEME -->

        <div class="form-group">

            <label>
                Color Theme
            </label>

            <select
                id="inTheme"
                onchange="changeTheme()"
            >

                <option value="blue">
                    Royal Blue
                </option>

                <option value="dark">
                    Midnight Dark
                </option>

                <option value="purple">
                    Sunset Purple
                </option>

                <option value="emerald">
                    Emerald Green
                </option>

            </select>

        </div>


        <!-- NAME -->

        <div class="form-group">

            <label>
                పేరు / Business Name
            </label>

            <input
                type="text"
                id="inName"
                placeholder="Your Name"
                oninput="updateBio()"
            >

        </div>


        <!-- BIO -->

        <div class="form-group">

            <label>
                చిన్న Bio
            </label>

            <textarea
                id="inBio"
                rows="2"
                placeholder="Digital Creator & Developer"
                oninput="updateBio()"
            ></textarea>

        </div>


        <!-- PHONE -->

        <div class="form-group">

            <label>
                Phone Number
            </label>

            <input
                type="tel"
                id="inPhone"
                placeholder="9876543210"

            >

        <!-- WHATSAPP -->

        <div class="form-group">

            <label>
                WhatsApp Number
            </label>

            <input
                type="tel"
                id="inWhatsapp"
                placeholder="919876543210"
                oninput="updateBio()"
            >

        </div>


        <!-- EMAIL -->

        <div class="form-group">

            <label>
                Email
            </label>

            <input
                type="email"
                id="inEmail"
                placeholder="you@example.com"
                oninput="updateBio()"
            >

        </div>


        <!-- LOCATION -->

        <div class="form-group">

            <label>

            </label>

        <div class="form-group">

                    id="t1"

                <input
                    id="l1"

                >
            </div>

            <div class="link-row">
                <input
                    id="t2"
                    placeholder="YouTube"
                    oninput="updateBio()"
                >

                <input
                    id="l2"
                    placeholder="https://..."
                    oninput="updateBio()"
                >
            </div>

            <div class="link-row">
                <input
                    id="t3"
                    placeholder="Instagram"
                    oninput="updateBio()"
                >

                <input
                    id="l3"
                    placeholder="https://..."
                    oninput="updateBio()"
                >
            </div>

            <div class="link-row">
                <input
                    id="t4"
                    placeholder="Website"
                    oninput="updateBio()"
                >

                <input
                    id="l4"
                    placeholder="https://..."
                    oninput="updateBio()"
                >
            </div>

            <div class="link-row">
                <input
                    id="t5"
                    placeholder="Facebook"
                    oninput="updateBio()"
                >

                <input
                    id="l5"
                    placeholder="https://..."
                    oninput="updateBio()"
                >
            </div>

            <div class="link-row">
                <input
                    id="t6"
                    placeholder="Other Link"
                    oninput="updateBio()"
                >

                <input
                    id="l6"
                    placeholder="https://..."
                    oninput="updateBio()"
                >
            </div>

        </div>


        <!-- ACTION BUTTONS -->

        <div class="btn-group">

            <button
                class="action-btn btn-jpg"
                onclick="downloadImage()"
            >
                📥 JPG
            </button>

            <button
                class="action-btn btn-pdf"
                onclick="downloadPDF()"
            >
                📄 PDF
            </button>

            <button
                class="action-btn btn-qr"
                onclick="showQR()"
            >
                🔳 QR Code
            </button>

            <button
                class="action-btn btn-share"
                onclick="sharePage()"
            >
                🔗 Create & Share Profile
            </button>

        </div>

    </div>


    <!-- =========================
         LIVE PREVIEW
    ========================= -->

    <div class="preview-wrapper">

        <div class="preview-label">
            LIVE PREVIEW
        </div>

        <div
            class="preview-container-box"
            id="captureArea"
        >

            <div
                class="preview-panel"
                id="phonePanel"
            >

                <img
                    id="viewImg"
                    class="avatar"
                    alt="Profile"
                >

                <div
                    id="viewName"
                    class="profile-name"
                >
                    Your Name
                </div>

                <div
                    id="viewBio"
                    class="profile-bio"
                >
                    Your Bio
                </div>

                <div
                    id="quickButtons"
                    class="quick-buttons"
                >
                </div>

                <div
                    id="linksArea"
                    class="links-container"
                >
                </div>

                    MADE BY SARVATRA
                </div>

</div>


<!-- =========================
     QR MODAL
========================= -->

<div
    class="qr-modal"
    id="qrSection"
>

    <div class="qr-card">

        <h3>
            SARVATRA QR Code
        </h3>

        <div id="qrcode"></div>

        <button
            class="close-qr"
            onclick="closeQR()"
        >
            Close
        </button>

    </div>

<div
    class="toast"
    id="toast"
></div>
<script>

/* =========================
   DEFAULT SETTINGS
========================= */

const DEFAULT_NAME =
    "Your Name";

const DEFAULT_BIO =
    "Digital Creator & Developer";

let currentPhoto = "";


/* =========================
   TOAST MESSAGE
========================= */

function showToast(message){

    const toast =
        document.getElementById("toast");

    if(!toast) return;

    toast.innerText =
        message;

    toast.classList.add("show");

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );
}


/* =========================
   HOME BUTTON
========================= */

function goHome(){

    /*
      SARVATRA home path.
      Same folder structure lo
      tools folder nundi index ki velthundi.
    */

    window.location.href =
        "../index.html";
}


/* =========================
   PHOTO PREVIEW
========================= */

function previewFile(event){

    const file =
        event.target.files &&
        event.target.files[0];

    if(!file){
        return;
    }

    if(!file.type.startsWith("image/")){

        showToast(
            "Image file select చేయండి"
        );

        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            currentPhoto =
                e.target.result;

            const img =
                document.getElementById(
                    "viewImg"
                );

            img.src =
                currentPhoto;

            img.style.display =
                "block";

            saveData();

            showToast(
                "Profile Photo Updated ✅"
            );
        };


    reader.onerror =
        function(){

            showToast(
                "Photo load కాలేదు"
            );
        };


    reader.readAsDataURL(file);
}


/* =========================
   CHANGE THEME
========================= */

function changeTheme(){

    const theme =
        document.getElementById(
            "inTheme"
        ).value;

    const panel =
        document.getElementById(
            "phonePanel"
        );


    const themes = {

        blue:
        "linear-gradient(180deg,#2563eb 0%,#07111f 100%)",

        dark:
        "linear-gradient(180deg,#27272a 0%,#050505 100%)",

        purple:
        "linear-gradient(180deg,#7c3aed 0%,#10051d 100%)",

        emerald:
        "linear-gradient(180deg,#059669 0%,#021a12 100%)"
    };


    panel.style.background =
        themes[theme] ||
        themes.blue;


    saveData();
}


/* =========================
   UPDATE PROFILE
========================= */

function updateBio(){

    const name =
        document.getElementById(
            "inName"
        ).value.trim();

    const bio =
        document.getElementById(
            "inBio"
        ).value.trim();


    /* NAME */

    document.getElementById(
        "viewName"
    ).innerText =
        name ||
        DEFAULT_NAME;


    /* BIO */

    document.getElementById(
        "viewBio"
    ).innerText =
        bio ||
        DEFAULT_BIO;


    /* =========================
       QUICK BUTTONS
    ========================= */

    const phone =
        document.getElementById(
            "inPhone"
        ).value.trim();

    const whatsapp =
        document.getElementById(
            "inWhatsapp"
        ).value.trim();

    const email =
        document.getElementById(
            "inEmail"
        ).value.trim();


    const quickButtons =
        document.getElementById(
            "quickButtons"
        );


    quickButtons.innerHTML =
        "";


    /* CALL */

    if(phone){

        const callBtn =
            document.createElement(
                "a"
            );

        callBtn.className =
            "quick-btn";

        callBtn.href =
            "tel:" + phone;

        callBtn.innerText =
            "📞 Call";

        quickButtons.appendChild(
            callBtn
        );
    }


    /* WHATSAPP */

    if(whatsapp){

        const number =
            whatsapp.replace(
                /\D/g,
                ""
            );


        const whatsappBtn =
            document.createElement(
                "a"
            );

        whatsappBtn.className =
            "quick-btn";

        whatsappBtn.href =
            "https://wa.me/" +
            number;

        whatsappBtn.target =
            "_blank";

        whatsappBtn.rel =
            "noopener noreferrer";

        whatsappBtn.innerText =
            "💬 WhatsApp";

        quickButtons.appendChild(
            whatsappBtn
        );
    }


    /* EMAIL */

    if(email){

        const emailBtn =
            document.createElement(
                "a"
            );

        emailBtn.className =
            "quick-btn";

        emailBtn.href =
            "mailto:" +
            email;

        emailBtn.innerText =
            "📧 Email";

        quickButtons.appendChild(
            emailBtn
        );
    }


    /* =========================
       CUSTOM LINKS
    ========================= */

    const linksArea =
        document.getElementById(
            "linksArea"
        );


    linksArea.innerHTML =
        "";


    for(
        let i = 1;
        i <= 6;
        i++
    ){

        const titleElement =
            document.getElementById(
                "t" + i
            );

        const linkElement =
            document.getElementById(
                "l" + i
            );


        if(
            !titleElement ||
            !linkElement
        ){
            continue;
        }


        const title =
            titleElement.value.trim();

        const link =
            linkElement.value.trim();


        if(
            title &&
            link
        ){

            let finalLink =
                link;


            /* URL FIX */

            if(
                !/^https?:\/\//i.test(
                    finalLink
                ) &&
                !/^mailto:/i.test(
                    finalLink
                ) &&
                !/^tel:/i.test(
                    finalLink
                )
            ){

                finalLink =
                    "https://" +
                    finalLink;
            }


            const a =
                document.createElement(
                    "a"
                );


            a.className =
                "bio-link";


            a.href =
                finalLink;


            a.target =
                "_blank";


            a.rel =
                "noopener noreferrer";


            a.innerText =
                title;


            linksArea.appendChild(
                a
            );
        }
    }


    /* EMPTY LINKS */

    if(
        linksArea.children.length === 0
    ){

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "bio-link";


        empty.style.opacity =
            "0.35";


        empty.style.pointerEvents =
            "none";


        empty.innerText =
            "Your Links will appear here";


        linksArea.appendChild(
            empty
        );
    }


    /* SAVE */

    saveData();
}
  /* =========================
   GET PROFILE DATA
========================= */

function getProfileData(){

    const links = [];

    for(
        let i = 1;
        i <= 6;
        i++
    ){

        const titleElement =
            document.getElementById(
                "t" + i
            );

        const linkElement =
            document.getElementById(
                "l" + i
            );


        if(
            !titleElement ||
            !linkElement
        ){
            continue;
        }


        const title =
            titleElement.value.trim();

        const url =
            linkElement.value.trim();


        if(
            title &&
            url
        ){

            links.push({
                title: title,
                url: url
            });
        }
    }


    return {

        name:
            document.getElementById(
                "inName"
            ).value.trim(),

        bio:
            document.getElementById(
                "inBio"
            ).value.trim(),

        phone:
            document.getElementById(
                "inPhone"
            ).value.trim(),

        whatsapp:
            document.getElementById(
                "inWhatsapp"
            ).value.trim(),

        email:
            document.getElementById(
                "inEmail"
            ).value.trim(),

        location:
            document.getElementById(
                "inLocation"
            ).value.trim(),

        theme:
            document.getElementById(
                "inTheme"
            ).value,

        links:
            links,

        photo:
            currentPhoto || ""
    };
}


/* =========================
   SAVE DATA
========================= */

function saveData(){

    try{

        const data =
            getProfileData();


        /*
          LocalStorage లో
          profile information save.
        */

        localStorage.setItem(
            "sarvatraBioLink",
            JSON.stringify(data)
        );

    }catch(error){

        console.error(
            "Save error:",
            error
        );
    }
}


/* =========================
   LOAD SAVED DATA
========================= */

function loadSavedData(){

    try{

        const raw =
            localStorage.getItem(
                "sarvatraBioLink"
            );


        if(!raw){
            return;
        }


        const data =
            JSON.parse(raw);


        /* NAME */

        document.getElementById(
            "inName"
        ).value =

        /* BIO */

        document.getElementById(
            "inBio"
        ).value =

        /* PHONE */

        document.getElementById(
            "inPhone"
        ).value =
            data.phone || "";


        /* WHATSAPP */

        document.getElementById(
            "inWhatsapp"
        ).value =
            data.whatsapp || "";


        /* EMAIL */

        document.getElementById(
            "inEmail"
        ).value =
            data.email || "";


        /* LOCATION */

        document.getElementById(
            "inLocation"
        ).value =
            data.location || "";


        /* THEME */

        document.getElementById(
            "inTheme"
        ).value =
            data.theme || "blue";


        /* PHOTO */

        if(data.photo){

            currentPhoto =
                data.photo;

            document.getElementById(
                "viewImg"
            ).src =
                data.photo;

            document.getElementById(
                "viewImg"
            ).style.display =
                "block";
        }


        /* CUSTOM LINKS */

        if(
            Array.isArray(data.links)
        ){

            data.links.forEach(
                function(item,index){

                    const number =
                        index + 1;


                    if(number > 6){
                        return;
                    }


                    const titleInput =
                        document.getElementById(
                            "t" + number
                        );

                    const urlInput =
                        document.getElementById(
                            "l" + number
                        );


                    if(titleInput){

                        titleInput.value =
                            item.title || "";
                    }


                    if(urlInput){

                        urlInput.value =
                            item.url || "";
                    }
                }
            );
        }


    }catch(error){

        console.error(
            "Load error:",
            error
        );
    }
}


/* =========================
   ENCODE PROFILE
========================= */

function encodeData(data){

    const json =
        JSON.stringify(data);


    const bytes =
        new TextEncoder().encode(
            json
        );


    let binary = "";


    bytes.forEach(
        function(byte){

            binary +=
                String.fromCharCode(
                    byte
                );
        }
    );


    return btoa(binary);
}


/* =========================
   DECODE PROFILE
========================= */

function decodeData(encoded){

    const binary =
        atob(encoded);


    const bytes =
        Uint8Array.from(
            binary,
            function(char){

                return char.charCodeAt(0);
            }
        );


    const json =
        new TextDecoder().decode(
            bytes
        );


    return JSON.parse(json);
}


/* =========================
   CREATE PROFILE URL
========================= */

function createProfileURL(){

    const data =
        getProfileData();


    data.name =
        data.name ||
        DEFAULT_NAME;


    data.bio =
        data.bio ||
        DEFAULT_BIO;


    /*
      Photo చాలా పెద్దగా ఉంటే
      URL పెద్దదవుతుంది.

      కాబట్టి shared profile కోసం
      photo లేకుండా link create చేస్తున్నాం.
      Local preview మాత్రం photo తో ఉంటుంది.
    */

    data.photo = "";


    const encoded =
        encodeData(data);


    return (
        window.location.origin +
        window.location.pathname +
        "#profile=" +
        encoded
    );
}


/* =========================
   SHARE PROFILE
========================= */

async function sharePage(){

    try{

        showToast(
            "Profile Link తయారవుతోంది..."
        );


        const url =
            createProfileURL();


        /*
          Mobile Share
        */

        if(
            navigator.share
        ){

            await navigator.share({

                title:
                    "SARVATRA Digital Bio-Link",

                text:
                    "నా SARVATRA Digital Profile చూడండి",

                url:
                    url
            });


            return;
        }


        /*
          Clipboard
        */

        if(
            navigator.clipboard
        ){

            await navigator.clipboard.writeText(
                url
            );


            showToast(
                "Profile Link Copy అయింది ✅"
            );

        }else{

            prompt(
                "Profile Link Copy చేసుకోండి:",
                url
            );
        }


    }catch(error){

        if(
            error.name !==
            "AbortError"
        ){

            console.error(
                "Share error:",
                error
            );

            showToast(
                "Share failed"
            );
        }
    }
}

/* =========================
   DOWNLOAD PDF
========================= */

async function downloadPDF(){

    try{

        const element =
            document.getElementById(
                "captureArea"
            );


        showToast(
            "PDF తయారవుతోంది..."
        );


        const canvas =
            await html2canvas(
                element,
                {
                    scale:3,

                    useCORS:true,

                    backgroundColor:
                        "#07111f",

                    logging:false
                }
            );


        const imgData =
            canvas.toDataURL(
                "image/png"
            );


        const jsPDF =
            window.jspdf.jsPDF;


        const pdf =
            new jsPDF(
                "p",
                "mm",
                "a4"
            );


        const pageWidth =
            pdf.internal.pageSize.getWidth();


        const pageHeight =
            pdf.internal.pageSize.getHeight();


        const width =
            105;


        const height =
            width *
            canvas.height /
            canvas.width;


        const x =
            (pageWidth - width) /
            2;


        const y =
            (pageHeight - height) /
            2;


        pdf.addImage(
            imgData,
            "PNG",
            x,
            y,
            width,
            height
        );


        pdf.save(
            "SARVATRA-Digital-Bio-Link.pdf"
        );


        showToast(
            "PDF Download అయింది ✅"
        );


    }catch(error){

        console.error(
            "PDF error:",
            error
        );


        showToast(
            "PDF Download failed"
        );
    }
  }
