<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PDF Password Remove | SARVATRA</title>

<link rel="icon" href="../icon-192.png">

<!-- PDF.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#eef3f8;
    min-height:100vh;
}

/* HEADER */

header{
    background:#ffffff;
    padding:18px 15px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.home-btn{
    display:block;
    width:100%;
    max-width:460px;
    margin:0 auto 15px;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#222;
    color:white;
    font-size:16px;
    cursor:pointer;
}

header h1{
    font-size:25px;
    color:#222;
}

header p{
    margin-top:6px;
    color:#666;
}

/* CONTAINER */

.container{
    width:100%;
    max-width:520px;
    margin:25px auto;
    padding:20px;
}

/* CARD */

.card{
    background:white;
    border-radius:16px;
    padding:22px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

/* FILE */

.file-box{
    border:2px dashed #aaa;
    border-radius:12px;
    padding:22px 12px;
    text-align:center;
    margin-bottom:15px;
}

.file-box label{
    display:block;
    font-size:17px;
    font-weight:bold;
    margin-bottom:12px;
}

input[type="file"]{
    width:100%;
}

/* PASSWORD */

.password-title{
    font-weight:bold;
    margin-top:15px;
    margin-bottom:7px;
}

input[type="password"]{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:9px;
    font-size:16px;
}

/* BUTTON */

.remove-btn{
    width:100%;
    padding:14px;
    margin-top:18px;
    border:none;
    border-radius:10px;
    background:#222;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.remove-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* STATUS */

#status{
    text-align:center;
    margin-top:18px;
    font-weight:bold;
    line-height:1.5;
}

/* INFO */

.info{
    margin-top:18px;
    padding:14px;
    background:#f3f6f9;
    border-radius:10px;
    font-size:14px;
    line-height:1.6;
    color:#555;
}

</style>

</head>


<body>


<header>

<button
class="home-btn"
onclick="goHome()">

🏠 SARVATRA Home

</button>

<h1>🔓 PDF Password Remove</h1>

<p>SARVATRA Tools</p>

</header>



<div class="container">

<div class="card">


<div class="file-box">

<label>
📄 Select Password Protected PDF
</label>

<input
type="file"
id="pdfInput"
accept="application/pdf">

</div>



<div class="password-title">

🔐 Enter PDF Password

</div>


<input
type="password"
id="password"
placeholder="Enter correct PDF password">



<button
class="remove-btn"
id="removeBtn">

🔓 Remove Password & Download

</button>



<p id="status"></p>



<div class="info">

<b>How to use:</b><br>

1. Select your password-protected PDF.<br>
2. Enter the correct password.<br>
3. Tap <b>Remove Password & Download</b>.<br>
4. A new PDF without password will be downloaded.

</div>


</div>

</div>



<script>

/* HOME */

function goHome(){

    window.location.href="../index.html";

}



/* PDF.JS WORKER */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";



const pdfInput =
document.getElementById("pdfInput");

const passwordInput =
document.getElementById("password");

const removeBtn =
document.getElementById("removeBtn");

const status =
document.getElementById("status");



let selectedPDF = null;



/* FILE SELECT */

pdfInput.addEventListener(
"change",
function(){

    selectedPDF = this.files[0];

    if(selectedPDF){

        status.innerHTML =
        "📄 PDF selected: " +
        selectedPDF.name;

    }

});



/* REMOVE PASSWORD */

removeBtn.addEventListener(
"click",
async function(){

    if(!selectedPDF){

        alert(
        "Please select a PDF file."
        );

        return;

    }



    const password =
    passwordInput.value.trim();



    if(!password){

        alert(
        "Please enter the PDF password."
        );

        return;

    }



    removeBtn.disabled = true;

    status.innerHTML =
    "⏳ Opening PDF...";



    try{

        const bytes =
        await selectedPDF.arrayBuffer();



        /*
         * PDF.JS loads the encrypted PDF.
         * The supplied password is used
         * to decrypt/read the document.
         */

        const loadingTask =
        pdfjsLib.getDocument({

            data: new Uint8Array(bytes),

            password: password

        });



        loadingTask.onPassword =
        function(
            callback,
            reason
        ){

            /*
             * Password is already supplied
             * above. This prevents PDF.JS
             * from asking again.
             */

            callback(password);

        };



        const pdf =
        await loadingTask.promise;



        status.innerHTML =
        "⏳ Password correct. Processing PDF...";



        const {
            jsPDF
        } = window.jspdf;



        let outputPDF = null;



        /*
         * Process every page
         */

        for(
            let pageNumber = 1;
            pageNumber <= pdf.numPages;
            pageNumber++
        ){

            status.innerHTML =
            "⏳ Processing page " +
            pageNumber +
            " of " +
            pdf.numPages +
            "...";



            const page =
            await pdf.getPage(pageNumber);



            /*
             * High quality rendering
             */

            const scale = 2;

            const viewport =
            page.getViewport({
                scale: scale
            });



            const canvas =
            document.createElement("canvas");



            const context =
            canvas.getContext("2d");



            canvas.width =
            viewport.width;

            canvas.height =
            viewport.height;



            await page.render({

                canvasContext: context,

                viewport: viewport

            }).promise;



            const imageData =
            canvas.toDataURL(
                "image/jpeg",
                0.95
            );



            /*
             * Original page size
             */

            const originalViewport =
            page.getViewport({
                scale: 1
            });



            const pageWidth =
            originalViewport.width *
            0.352777778;



            const pageHeight =
            originalViewport.height *
            0.352777778;



            /*
             * Create PDF only once
             */

            if(!outputPDF){

                outputPDF =
                new jsPDF({

                    orientation:
                    pageWidth > pageHeight
                    ? "landscape"
                    : "portrait",

                    unit:"mm",

                    format:[
                        pageWidth,
                        pageHeight
                    ],

                    compress:true

                });

            }else{

                outputPDF.addPage(
                    [
                        pageWidth,
                        pageHeight
                    ],

                    pageWidth > pageHeight
                    ? "landscape"
                    : "portrait"
                );

            }



            outputPDF.addImage(

                imageData,

                "JPEG",

                0,

                0,

                pageWidth,

                pageHeight,

                undefined,

                "FAST"

            );

        }



        status.innerHTML =
        "⏳ Creating unlocked PDF...";



        /*
         * Download
         */

        const safeName =
        selectedPDF.name
        .replace(
            /\.pdf$/i,
            ""
        );



        outputPDF.save(
            safeName +
            "-unlocked.pdf"
        );



        status.innerHTML =
        "✅ Password removed successfully!<br>" +
        "📥 Unlocked PDF downloaded.";



    }catch(error){

        console.error(error);



        if(
            error &&
            (
                error.name ===
                "PasswordException"
                ||
                String(error.message)
                .toLowerCase()
                .includes("password")
            )
        ){

            status.innerHTML =
            "❌ Incorrect PDF password.";

        }else{

            status.innerHTML =
            "❌ Unable to unlock this PDF.<br>" +
            "Please check the PDF and password.";

        }

    }



    removeBtn.disabled = false;

});

</script>


</body>

</html>
