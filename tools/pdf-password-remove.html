<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SARVATRA - PDF Password Remove</title>

<link rel="icon" href="../icon-192.png">

<!-- PDF.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- JSPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#eef5ff;
    min-height:100vh;
    color:#222;
}


/* ================= HEADER ================= */

header{
    background:#ffffff;
    padding:15px;
    text-align:center;

    box-shadow:
    0 2px 12px rgba(0,0,0,.10);

    position:sticky;
    top:0;
    z-index:10;
}


/* TOP BUTTONS */

.top-buttons{
    display:flex;
    gap:10px;

    max-width:520px;
    margin:0 auto 15px;
}


.top-btn{
    flex:1;

    padding:12px 10px;

    border:none;
    border-radius:10px;

    background:#0d6efd;
    color:white;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 4px 10px rgba(13,110,253,.25);

    transition:.15s;
}


.top-btn:active{
    transform:scale(.97);
}


.top-btn:hover{
    background:#095dcc;
}


/* TITLE */

header h1{
    color:#0d6efd;
    font-size:25px;
    margin-top:5px;
}


header p{
    color:#666;
    margin-top:5px;
    font-size:14px;
}



/* ================= MAIN ================= */

.container{
    width:100%;
    max-width:520px;

    margin:25px auto;

    padding:0 15px;
}


.card{
    background:#ffffff;

    border-radius:18px;

    padding:22px;

    box-shadow:
    0 5px 22px rgba(0,0,0,.09);

    border:1px solid #e1eaf7;
}



/* ================= FILE BOX ================= */

.file-box{
    border:2px dashed #0d6efd;

    background:#f4f8ff;

    border-radius:14px;

    padding:24px 15px;

    text-align:center;
}


.file-icon{
    font-size:40px;
    margin-bottom:8px;
}


.file-title{
    font-size:17px;

    font-weight:bold;

    color:#0d6efd;

    margin-bottom:12px;
}


input[type="file"]{
    width:100%;
    font-size:14px;
}



/* ================= PASSWORD ================= */

.password-title{
    font-size:16px;

    font-weight:bold;

    margin-top:20px;
    margin-bottom:8px;

    color:#333;
}


.password-wrap{
    position:relative;
}


#password{

    width:100%;

    padding:13px;

    padding-right:50px;

    border:1px solid #ccd6e5;

    border-radius:10px;

    font-size:16px;

    outline:none;
}


#password:focus{

    border-color:#0d6efd;

    box-shadow:
    0 0 0 3px rgba(13,110,253,.12);
}


/* SHOW PASSWORD */

.show-pass{

    position:absolute;

    right:8px;
    top:50%;

    transform:translateY(-50%);

    width:38px;
    height:38px;

    border:none;

    border-radius:8px;

    background:#e9f2ff;

    color:#0d6efd;

    cursor:pointer;
}



/* ================= REMOVE BUTTON ================= */

.remove-btn{

    width:100%;

    margin-top:20px;

    padding:14px;

    border:none;

    border-radius:11px;

    background:#0d6efd;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 5px 14px rgba(13,110,253,.28);
}


.remove-btn:hover{
    background:#095dcc;
}


.remove-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}



/* ================= STATUS ================= */

#status{

    text-align:center;

    margin-top:18px;

    font-size:15px;

    font-weight:bold;

    line-height:1.6;
}



/* ================= INFO ================= */

.info{

    margin-top:20px;

    padding:15px;

    background:#f1f6ff;

    border-left:4px solid #0d6efd;

    border-radius:9px;

    color:#555;

    font-size:14px;

    line-height:1.7;
}


.info b{
    color:#0d6efd;
}



/* ================= FOOTER ================= */

.footer{

    text-align:center;

    color:#777;

    font-size:13px;

    margin:25px 0;
}



/* ================= MOBILE ================= */

@media(max-width:420px){

    header h1{
        font-size:22px;
    }

    .card{
        padding:17px;
    }

    .top-btn{
        font-size:14px;
    }

}

</style>

</head>



<body>


<!-- ================= HEADER ================= -->

<header>


<div class="top-buttons">


<button
class="top-btn"
onclick="goHome()">

🏠 Home

</button>


<button
class="top-btn"
onclick="refreshPage()">

🔄 Refresh

</button>


</div>



<h1>

🔓 PDF Password Remove

</h1>


<p>

SARVATRA Tools

</p>


</header>



<!-- ================= MAIN ================= -->

<div class="container">


<div class="card">



<!-- FILE -->

<div class="file-box">


<div class="file-icon">
📄
</div>


<div class="file-title">

Select Password Protected PDF

</div>


<input
type="file"
id="pdfInput"
accept="application/pdf">


</div>



<!-- PASSWORD -->

<div class="password-title">

🔐 PDF Password

</div>


<div class="password-wrap">


<input
type="password"
id="password"
placeholder="Enter correct PDF password">


<button
class="show-pass"
onclick="togglePassword()">

👁️

</button>


</div>



<!-- REMOVE -->

<button
class="remove-btn"
id="removeBtn">

🔓 Remove Password & Download

</button>



<!-- STATUS -->

<p id="status"></p>



<!-- INFO -->

<div class="info">

<b>How to use</b><br>

1. Select your password protected PDF.<br>

2. Enter the correct password.<br>

3. Click <b>Remove Password & Download</b>.<br>

4. A new PDF without password will be downloaded.

</div>


</div>



<div class="footer">

© 2026 SARVATRA • All Government Services

</div>


</div>



<script>


/* ================= HOME ================= */

function goHome(){

    window.location.href="../index.html";

}



/* ================= REFRESH ================= */

function refreshPage(){

    location.reload();

}



/* ================= SHOW PASSWORD ================= */

function togglePassword(){

    const input =
    document.getElementById("password");

    const button =
    document.querySelector(".show-pass");


    if(input.type === "password"){

        input.type = "text";

        button.innerHTML = "🙈";

    }

    else{

        input.type = "password";

        button.innerHTML = "👁️";

    }

}



/* ================= PDF.JS WORKER ================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";



const pdfInput =
document.getElementById("pdfInput");


const passwordInput =
document.getElementById("password");


const removeBtn =
document.getElementById("removeBtn");


const status =
document.getElementById("status");


let selectedPDF = null;



/* ================= FILE SELECT ================= */

pdfInput.addEventListener(
"change",
function(){

    selectedPDF = this.files[0];


    if(selectedPDF){

        status.innerHTML =
        "📄 Selected: " +
        selectedPDF.name;

    }

});



/* ================= REMOVE PASSWORD ================= */

removeBtn.addEventListener(
"click",
async function(){


    if(!selectedPDF){

        alert(
        "Please select a PDF file."
        );

        return;

    }



    const password =
    passwordInput.value.trim();


    if(!password){

        alert(
        "Please enter PDF password."
        );

        return;

    }



    removeBtn.disabled = true;


    status.innerHTML =
    "⏳ Opening PDF...";



    try{


        const bytes =
        await selectedPDF.arrayBuffer();



        /* LOAD ENCRYPTED PDF */

        const loadingTask =
        pdfjsLib.getDocument({

            data:new Uint8Array(bytes),

            password:password

        });



        loadingTask.onPassword =
        function(
            callback,
            reason
        ){

            callback(password);

        };



        const pdf =
        await loadingTask.promise;



        status.innerHTML =
        "✅ Password accepted.<br>" +
        "⏳ Creating new PDF...";



        const {
            jsPDF
        } = window.jspdf;



        let outputPDF = null;



        /* PROCESS ALL PAGES */

        for(
            let pageNumber=1;
            pageNumber<=pdf.numPages;
            pageNumber++
        ){


            status.innerHTML =
            "⏳ Processing page " +
            pageNumber +
            " / " +
            pdf.numPages;



            const page =
            await pdf.getPage(
                pageNumber
            );



            /*
             * Render at 2x
             * for good quality.
             */

            const scale = 2;



            const viewport =
            page.getViewport({

                scale:scale

            });



            const canvas =
            document.createElement(
                "canvas"
            );


            const context =
            canvas.getContext(
                "2d"
            );



            canvas.width =
            viewport.width;


            canvas.height =
            viewport.height;



            await page.render({

                canvasContext:
                context,

                viewport:
                viewport

            }).promise;



            const image =
            canvas.toDataURL(
                "image/jpeg",
                0.95
            );



            /*
             * Get original page size
             */

            const original =
            page.getViewport({

                scale:1

            });



            /*
             * PDF points → mm
             */

            const width =
            original.width *
            0.352777778;


            const height =
            original.height *
            0.352777778;



            const orientation =
            width > height
            ? "landscape"
            : "portrait";



            /*
             * Create new PDF
             */

            if(!outputPDF){

                outputPDF =
                new jsPDF({

                    orientation:
                    orientation,

                    unit:"mm",

                    format:[
                        width,
                        height
                    ],

                    compress:true

                });

            }

            else{

                outputPDF.addPage(

                    [
                        width,
                        height
                    ],

                    orientation

                );

            }



            /*
             * Add rendered page
             */

            outputPDF.addImage(

                image,

                "JPEG",

                0,
                0,

                width,
                height,

                undefined,

                "FAST"

            );


        }



        status.innerHTML =
        "⏳ Preparing unlocked PDF...";



        /*
         * Create filename
         */

        const fileName =
        selectedPDF.name
        .replace(
            /\.pdf$/i,
            ""
        );



        /*
         * Download new PDF
         */

        outputPDF.save(

            fileName +
            "-unlocked.pdf"

        );



        status.innerHTML =
        "✅ Password removed successfully!<br>" +
        "📥 Unlocked PDF downloaded.";



    }

    catch(error){


        console.error(error);



        const message =
        String(

            error &&
            error.message
            ? error.message
            : error

        ).toLowerCase();



        if(

            error.name ===
            "PasswordException"

            ||

            message.includes(
                "password"
            )

        ){

            status.innerHTML =
            "❌ Incorrect PDF password.";

        }

        else{

            status.innerHTML =
            "❌ Unable to process this PDF.<br>" +
            "Please check the PDF and password.";

        }


    }



    removeBtn.disabled = false;


});

</script>


</body>

</html>
