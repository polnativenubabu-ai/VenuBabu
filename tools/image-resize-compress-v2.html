<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SARVATRA - Image Resize & Compress</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#eef3f8;
    color:#111;
    padding:12px;
}

.container{
    max-width:850px;
    margin:auto;
}

/* ================= HEADER ================= */

.topBar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
}

.homeBtn{
    background:#087b35;
    color:#fff;
    border:0;
    border-radius:9px;
    padding:10px 13px;
    font-weight:bold;
    cursor:pointer;
}

.titleBox{
    flex:1;
}

.titleBox h1{
    color:#087b35;
    font-size:23px;
}

.titleBox p{
    color:#777;
    font-size:12px;
    margin-top:2px;
}

/* ================= MAIN BOX ================= */

.box{
    background:#fff;
    border-radius:16px;
    padding:18px;
    box-shadow:0 4px 18px rgba(0,0,0,.10);
    margin-bottom:15px;
}

.box h2{
    color:#087b35;
    font-size:20px;
    margin-bottom:14px;
}

/* ================= UPLOAD ================= */

.uploadBox{
    border:2px dashed #159447;
    border-radius:13px;
    padding:28px 15px;
    text-align:center;
    background:#f7fffa;
    cursor:pointer;
}

.uploadIcon{
    font-size:40px;
    margin-bottom:7px;
}

.uploadBox strong{
    color:#087b35;
}

.uploadBox p{
    color:#777;
    font-size:13px;
    margin-top:5px;
}

#imageInput{
    display:none;
}

/* ================= PREVIEW ================= */

.previewBox{
    display:none;
    margin-top:18px;
}

.previewBox img{
    display:block;
    max-width:100%;
    max-height:360px;
    margin:auto;
    border-radius:10px;
    border:1px solid #ddd;
}

/* ================= INFO ================= */

.infoGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:15px;
}

.info{
    background:#f5f7f9;
    border-radius:9px;
    padding:10px;
}

.info small{
    color:#777;
    display:block;
    font-size:10px;
}

.info strong{
    display:block;
    margin-top:3px;
    font-size:14px;
}

/* ================= CONTROLS ================= */

.controls{
    display:none;
    margin-top:18px;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:12px;
}

.field label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:5px;
}

.field input,
.field select{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:14px;
    outline:none;
}

.checkboxRow{
    display:flex;
    align-items:center;
    gap:8px;
    margin:10px 0;
    font-size:13px;
}

.checkboxRow input{
    width:18px;
    height:18px;
}

/* ================= QUALITY ================= */

.rangeBox{
    background:#f6f8fa;
    padding:13px;
    border-radius:10px;
    margin-top:10px;
}

.rangeTop{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
}

#qualityRange{
    width:100%;
}

/* ================= TARGET ================= */

.targetBox{
    margin-top:12px;
    background:#eef7ff;
    border:1px solid #b9dcff;
    padding:13px;
    border-radius:10px;
}

.targetBox h3{
    color:#0874bd;
    font-size:15px;
    margin-bottom:9px;
}

.targetRow{
    display:grid;
    grid-template-columns:1fr 120px;
    gap:8px;
}

.targetRow input,
.targetRow select{
    width:100%;
    padding:10px;
    border:1px solid #bbb;
    border-radius:8px;
}

/* ================= COMPRESS ================= */

.compressBtn{
    width:100%;
    padding:13px;
    margin-top:15px;
    border:0;
    border-radius:9px;
    background:#087b35;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.progressBox{
    display:none;
    margin-top:14px;
}

.progressText{
    text-align:center;
    font-size:13px;
    color:#555;
    margin-bottom:5px;
}

.progress{
    height:9px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
}

.progressFill{
    width:0%;
    height:100%;
    background:#087b35;
}

/* ================= RESULT ================= */

.result{
    display:none;
}

.result h2{
    color:#087b35;
}

.resultImage{
    max-width:100%;
    max-height:350px;
    display:block;
    margin:15px auto;
    border-radius:10px;
    border:1px solid #ddd;
}

.resultInfo{
    text-align:center;
    background:#f4f6f8;
    border-radius:10px;
    padding:12px;
    margin-bottom:14px;
}

.resultInfo strong{
    color:#087b35;
}

/* ================= DOWNLOAD BUTTONS ================= */

.downloadGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.actionBtn{
    border:0;
    border-radius:9px;
    padding:12px;
    color:#fff;
    font-weight:bold;
    font-size:14px;
    cursor:pointer;
}

.jpgBtn{
    background:#087b35;
}

.pngBtn{
    background:#087b35;
}

.webpBtn{
    background:#0874bd;
}

.pdfBtn{
    background:#0874bd;
}

.printBtn{
    background:#333;
}

.resetBtn{
    background:#c62828;
}

.fullBtn{
    grid-column:1/-1;
}

/* ================= NOTICE ================= */

.notice{
    text-align:center;
    color:#777;
    font-size:11px;
    margin-top:15px;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    body{
        padding:8px;
    }

    .row,
    .infoGrid{
        grid-template-columns:1fr;
    }

    .downloadGrid{
        grid-template-columns:1fr 1fr;
    }

    .titleBox h1{
        font-size:20px;
    }

    .homeBtn{
        padding:9px 10px;
    }

    .targetRow{
        grid-template-columns:1fr;
    }

}

/* ================= PRINT ================= */

@media print{

    body{
        background:#fff;
        padding:0;
    }

    .topBar,
    .controls,
    .uploadBox,
    .buttons,
    .downloadGrid,
    .notice{
        display:none!important;
    }

    .box{
        box-shadow:none;
        padding:0;
    }

    .result{
        display:block!important;
    }

}

</style>

</head>

<body>


<div class="container">


<!-- HEADER -->

<div class="topBar">

<button
    class="homeBtn"
    onclick="goHome()">

🏠 Home

</button>

<div class="titleBox">

<h1>SARVATRA</h1>

<p>
Image Resize & Compress Tool
</p>

</div>

</div>


<!-- UPLOAD -->

<div class="box">

<h2>
🖼️ Select Image
</h2>

<label
    class="uploadBox"
    for="imageInput">

<div class="uploadIcon">
📷
</div>

<strong>
Choose Image
</strong>

<p>
JPG, JPEG, PNG, WEBP supported
</p>

</label>

<input
    id="imageInput"
    type="file"
    accept="image/*">


<!-- PREVIEW -->

<div
    id="previewBox"
    class="previewBox">

<img id="originalPreview">

<div class="infoGrid">

<div class="info">

<small>
Original Size
</small>

<strong id="originalSize">
---
</strong>

</div>

<div class="info">

<small>
Dimensions
</small>

<strong id="originalDimensions">
---
</strong>

</div>

</div>

</div>


<!-- CONTROLS -->

<div
    id="controls"
    class="controls">


<div class="row">


<div class="field">

<label>
Width (px)
</label>

<input
    id="widthInput"
    type="number"
    min="1">

</div>


<div class="field">

<label>
Height (px)
</label>

<input
    id="heightInput"
    type="number"
    min="1">

</div>


</div>


<div class="checkboxRow">

<input
    id="ratioLock"
    type="checkbox"
    checked>

<label for="ratioLock">
Lock Aspect Ratio
</label>

</div>


<div class="row">


<div class="field">

<label>
Output Format
</label>

<select id="formatSelect">

<option value="image/jpeg">
JPG
</option>

<option value="image/png">
PNG
</option>

<option value="image/webp">
WEBP
</option>

</select>

</div>


<div class="field">

<label>
Quality
</label>

<select id="qualitySelect">

<option value="1">
100%
</option>

<option value="0.9">
90%
</option>

<option value="0.8" selected>
80%
</option>

<option value="0.7">
70%
</option>

<option value="0.6">
60%
</option>

<option value="0.5">
50%
</option>

<option value="0.4">
40%
</option>

<option value="0.3">
30%
</option>

</select>

</div>

</div>


<!-- TARGET SIZE -->

<div class="targetBox">

<h3>
🎯 Target File Size
</h3>

<div class="targetRow">

<input
    id="targetSize"
    type="number"
    min="1"
    placeholder="Example: 300">

<select id="targetUnit">

<option value="KB">
KB
</option>

<option value="MB">
MB
</option>

</select>

</div>

</div>


<button
    class="compressBtn"
    onclick="compressImage()">

Compress / Resize Image

</button>


<div
    id="progressBox"
    class="progressBox">

<div
    id="progressText"
    class="progressText">

Processing...

</div>

<div class="progress">

<div
    id="progressFill"
    class="progressFill">
</div>

</div>

</div>

</div>

</div>


<!-- RESULT -->

<div
    id="result"
    class="box result">

<h2>
✅ Compressed Image
</h2>


<img
    id="resultImage"
    class="resultImage">


<div class="resultInfo">

Original:
<strong id="resultOriginal">
---
</strong>

&nbsp; → &nbsp;

New:
<strong id="resultNew">
---
</strong>

<br>

Saved:
<strong id="savedPercent">
---
</strong>

</div>


<div class="downloadGrid">

<button
    class="actionBtn jpgBtn"
    onclick="downloadAs('image/jpeg')">

⬇️ JPG

</button>


<button
    class="actionBtn pngBtn"
    onclick="downloadAs('image/png')">

⬇️ PNG

</button>


<button
    class="actionBtn webpBtn"
    onclick="downloadAs('image/webp')">

⬇️ WEBP

</button>


<button
    class="actionBtn pdfBtn"
    onclick="downloadPDF()">

📄 PDF

</button>


<button
    class="actionBtn printBtn"
    onclick="printImage()">

🖨️ Print

</button>


<button
    class="actionBtn resetBtn"
    onclick="resetTool()">

🔄 New Image

</button>

</div>


<div class="notice">

SARVATRA Image Resize & Compress Tool

</div>

</div>


</div>


<script>

/* =========================
   GLOBAL VARIABLES
========================= */

let originalFile = null;

let originalImage = null;

let resultCanvas = null;

let resultBlob = null;


/* =========================
   HOME
========================= */

function goHome(){

    window.location.href =
    "../index.html";

}


/* =========================
   FILE SELECT
========================= */

document
.getElementById("imageInput")
.addEventListener(
    "change",
    function(){

        const file =
        this.files[0];

        if(!file) return;

        originalFile = file;

        const reader =
        new FileReader();

        reader.onload =
        function(e){

            const img =
            new Image();

            img.onload =
            function(){

                originalImage =
                img;

                document
                .getElementById(
                    "originalPreview"
                )
                .src =
                e.target.result;


                document
                .getElementById(
                    "originalSize"
                )
                .textContent =
                formatBytes(
                    file.size
                );


                document
                .getElementById(
                    "originalDimensions"
                )
                .textContent =
                img.width +
                " × " +
                img.height +
                " px";


                document
                .getElementById(
                    "widthInput"
                )
                .value =
                img.width;


                document
                .getElementById(
                    "heightInput"
                )
                .value =
                img.height;


                document
                .getElementById(
                    "previewBox"
                )
                .style.display =
                "block";


                document
                .getElementById(
                    "controls"
                )
                .style.display =
                "block";

            };

            img.src =
            e.target.result;

        };

        reader.readAsDataURL(file);

    }
);


/* =========================
   ASPECT RATIO
========================= */

let changingWidth = false;
let changingHeight = false;

document
.getElementById("widthInput")
.addEventListener(
    "input",
    function(){

        if(
            !document
            .getElementById(
                "ratioLock"
            ).checked
        ) return;

        if(
            changingWidth ||
            !originalImage
        ) return;

        changingWidth = true;

        const ratio =
        originalImage.height /
        originalImage.width;

        document
        .getElementById(
            "heightInput"
        )
        .value =
        Math.round(
            this.value * ratio
        );

        changingWidth = false;

    }
);


document
.getElementById("heightInput")
.addEventListener(
    "input",
    function(){

        if(
            !document
            .getElementById(
                "ratioLock"
            ).checked
        ) return;

        if(
            changingHeight ||
            !originalImage
        ) return;

        changingHeight = true;

        const ratio =
        originalImage.width /
        originalImage.height;

        document
        .getElementById(
            "widthInput"
        )
        .value =
        Math.round(
            this.value * ratio
        );

        changingHeight = false;

    }
);


/* =========================
   FORMAT BYTES
========================= */

function formatBytes(bytes){

    if(bytes < 1024){

        return bytes + " B";

    }

    if(bytes < 1024 * 1024){

        return (
            bytes / 1024
        ).toFixed(1) + " KB";

    }

    return (
        bytes /
        (1024 * 1024)
    ).toFixed(2) + " MB";

}


/* =========================
   TARGET BYTES
========================= */

function getTargetBytes(){

    const value =
    parseFloat(
        document
        .getElementById(
            "targetSize"
        ).value
    );

    if(!value || value <= 0){

        return null;

    }

    const unit =
    document
    .getElementById(
        "targetUnit"
    ).value;

    if(unit === "KB"){

        return value * 1024;

    }

    return value *
    1024 *
    1024;

}


/* =========================
   CANVAS
========================= */

function createCanvas(){

    const width =
    parseInt(
        document
        .getElementById(
            "widthInput"
        ).value
    );

    const height =
    parseInt(
        document
        .getElementById(
            "heightInput"
        ).value
    );

    const canvas =
    document.createElement(
        "canvas"
    );

    canvas.width =
    width;

    canvas.height =
    height;

    const ctx =
    canvas.getContext(
        "2d"
    );

    ctx.drawImage(
        originalImage,
        0,
        0,
        width,
        height
    );

    return canvas;

}


/* =========================
   CANVAS BLOB
========================= */

function canvasBlob(
    canvas,
    type,
    quality
){

    return new Promise(
        resolve => {

            canvas.toBlob(
                blob => {

                    resolve(blob);

                },
                type,
                quality
            );

        }
    );

}


/* =========================
   COMPRESS
========================= */

async function compressImage(){

    if(!originalImage){

        alert(
            "Please select an image first."
        );

        return;

    }


    const progressBox =
    document.getElementById(
        "progressBox"
    );

    const progressFill =
    document.getElementById(
        "progressFill"
    );

    const progressText =
    document.getElementById(
        "progressText"
    );


    progressBox.style.display =
    "block";


    progressFill.style.width =
    "10%";


    progressText.textContent =
    "Preparing image...";


    await wait(100);


    const canvas =
    createCanvas();


    const type =
    document
    .getElementById(
        "formatSelect"
    ).value;


    const selectedQuality =
    parseFloat(
        document
        .getElementById(
            "qualitySelect"
        ).value
    );


    const target =
    getTargetBytes();


    let bestBlob = null;


    /* TARGET SIZE MODE */

    if(target && type !== "image/png"){

        progressText.textContent =
        "Finding best compression...";


        let low = 0.05;
        let high = 1;


        for(
            let i = 0;
            i < 10;
            i++
        ){

            const quality =
            (low + high) / 2;


            const blob =
            await canvasBlob(
                canvas,
                type,
                quality
            );


            if(blob.size > target){

                high =
                quality;

            }else{

                low =
                quality;

                bestBlob =
                blob;

            }


            progressFill.style.width =
            (20 + i * 7) + "%";


            await wait(20);

        }


        /* If even lowest quality is
           larger than target, use it */

        if(!bestBlob){

            bestBlob =
            await canvasBlob(
                canvas,
                type,
                0.05
            );

        }

    }else{

        progressText.textContent =
        "Compressing image...";


        bestBlob =
        await canvasBlob(
            canvas,
            type,
            selectedQuality
        );


        progressFill.style.width =
        "80%";

    }


    resultCanvas =
    canvas;

    resultBlob =
    bestBlob;


    progressFill.style.width =
    "100%";


    progressText.textContent =
    "Complete";


    document
    .getElementById(
        "resultImage"
    )
    .src =
    URL.createObjectURL(
        bestBlob
    );


    const originalSize =
    originalFile.size;


    const newSize =
    bestBlob.size;


    document
    .getElementById(
        "resultOriginal"
    )
    .textContent =
    formatBytes(
        originalSize
    );


    document
    .getElementById(
        "resultNew"
    )
    .textContent =
    formatBytes(
        newSize
    );


    let saved =
    0;


    if(originalSize > 0){

        saved =
        ((originalSize -
        newSize) /
        originalSize) *
        100;

    }


    document
    .getElementById(
        "savedPercent"
    )
    .textContent =
    saved.toFixed(1) +
    "%";


    document
    .getElementById(
        "result"
    )
    .style.display =
    "block";


    document
    .getElementById(
        "result"
    )
    .scrollIntoView({
        behavior:"smooth"
    });


    setTimeout(
        () => {
            progressBox.style.display =
            "none";
        },
        800
    );

}


/* =========================
   DOWNLOAD
========================= */

async function downloadAs(type){

    if(!resultCanvas){

        alert(
            "Please compress the image first."
        );

        return;

    }


    const quality =
    type === "image/png"
    ? undefined
    : parseFloat(
        document
        .getElementById(
            "qualitySelect"
        ).value
    );


    let blob;


    if(type === "image/png"){

        blob =
        await canvasBlob(
            resultCanvas,
            type
        );

    }else{

        blob =
        await canvasBlob(
            resultCanvas,
            type,
            quality
        );

    }


    let extension = "jpg";


    if(type === "image/png"){
        extension = "png";
    }

    if(type === "image/webp"){
        extension = "webp";
    }


    const link =
    document.createElement("a");

    link.href =
    URL.createObjectURL(
        blob
    );

    link.download =
    "SARVATRA-image." +
    extension;

        link.click();


    setTimeout(
        function(){

            URL.revokeObjectURL(
                link.href
            );

        },
        1000
    );

}
    

/* =========================
   PDF DOWNLOAD
========================= */

function downloadPDF(){

    if(!resultCanvas){

        alert(
            "Please compress the image first."
        );

        return;
    }


    const image =
    resultCanvas.toDataURL(
        "image/jpeg",
        0.95
    );


    const win =
    window.open(
        "",
        "_blank"
    );


    if(!win){

        alert(
            "Please allow pop-ups to download PDF."
        );

        return;
    }


    win.document.write(`

        <!DOCTYPE html>

        <html>

        <head>

        <title>
            SARVATRA Image PDF
        </title>

        <style>

        @page{
            margin:10mm;
        }

        body{
            margin:0;
            text-align:center;
            background:white;
        }

        img{
            max-width:100%;
            max-height:95vh;
        }

        </style>

        </head>

        <body>

        <img src="${image}">

        <script>

        window.onload = function(){

            window.print();

        };

        <\/script>

        </body>

        </html>

    `);


    win.document.close();

}
