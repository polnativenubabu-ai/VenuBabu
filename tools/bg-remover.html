<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Background Remover | SARVATRA</title>

<link rel="icon" href="../icon-192.png">
<link rel="stylesheet" href="bg.css">

<style>
#removeBtn {
    background: #1976d2;
    color: white;
    border: none;
    padding: 13px 24px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s ease;
    box-shadow: 0 3px 8px rgba(25, 118, 210, 0.25);
}

#removeBtn:hover {
    background: #1565c0;
    transform: translateY(-1px);
}

#removeBtn:active {
    transform: scale(0.98);
}

#removeBtn:disabled {
    background: #90caf9;
    cursor: not-allowed;
    transform: none;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/dist/browser.js"></script>

</head>

<body>

<div class="container">

<a href="../index.html" class="home-btn">🏠 Home</a>

<h1>🖼 AI Background Remover</h1>

<p class="subtitle">
Remove image background instantly using AI
</p>

<div id="dropArea">

<div class="upload-icon">📷</div>

<h2>Upload Image</h2>

<p>Drag & Drop Image Here</p>

<p class="or">OR</p>

<input
type="file"
id="imageInput"
accept="image/*"
hidden>

<button id="browseBtn">
Choose Image
</button>

</div>

<div id="loading" class="hidden">
<div class="loader"></div>
<p>Processing Image...</p>
</div>

<div id="previewSection" class="hidden">

<div class="card">
<h3>Original</h3>
<img id="originalImage">
</div>

<div class="card">
<h3>Background Removed</h3>
<img id="resultImage">
</div>

    <div class="bg-controls">

    <h3>🎨 Background Color</h3>

    <div class="color-options">

        <button class="color-btn transparent"
                data-color="transparent"
                title="Transparent">
            🟦
        </button>

        <button class="color-btn"
                data-color="#ffffff"
                style="background:#ffffff"
                title="White">
        </button>

        <button class="color-btn"
                data-color="#000000"
                style="background:#000000"
                title="Black">
        </button>

        <button class="color-btn"
                data-color="#1976d2"
                style="background:#1976d2"
                title="Blue">
        </button>

        <button class="color-btn"
                data-color="#4caf50"
                style="background:#4caf50"
                title="Green">
        </button>

        <button class="color-btn"
                data-color="#f44336"
                style="background:#f44336"
                title="Red">
        </button>

        <button class="color-btn"
                data-color="#ffeb3b"
                style="background:#ffeb3b"
                title="Yellow">
        </button>

        <input
            type="color"
            id="customColor"
            value="#ffffff"
            title="Custom Color">

    </div>

    </div>


    

<div class="buttons">

<button id="removeBtn">
✨ Remove Background
</button>

<button id="downloadBtn" disabled>
⬇ Download PNG
</button>

</div>

</div>

</div>

<script type="module" src="bg.js"></script>

</body>
</html>
