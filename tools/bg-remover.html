<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Background Remover | SARVATRA</title>

<link rel="icon" href="../icon-192.png">
<link rel="stylesheet" href="bg.css">

<script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/dist/browser.js"></script>
</head>

<body>

<div class="container">

<a href="../index.html" class="home-btn">🏠 Home</a>

<h1>🖼 AI Background Remover</h1>

<p class="subtitle">
Remove image background instantly using AI
</p>

<div id="dropArea">

<div class="upload-icon">📷</div>

<h2>Upload Image</h2>

<p>Drag & Drop Image Here</p>

<p class="or">OR</p>

<input
type="file"
id="imageInput"
accept="image/*"
hidden>

<button id="browseBtn">
Choose Image
</button>

</div>

<div id="loading" class="hidden">
<div class="loader"></div>
<p>Processing Image...</p>
</div>

<div id="previewSection" class="hidden">

<div class="card">
<h3>Original</h3>
<img id="originalImage">
</div>

<div class="card">
<h3>Background Removed</h3>
<img id="resultImage">
</div>

<div class="buttons">

<button id="removeBtn">
✨ Remove Background
</button>

<button id="downloadBtn" disabled>
⬇ Download PNG
</button>

</div>

</div>

</div>

<script type="module" src="bg.js"></script>

</body>
</html>
