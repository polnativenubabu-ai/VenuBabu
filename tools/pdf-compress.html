<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<meta name="theme-color"
content="#075985">

<title>
SARVATRA - PDF Compressor
</title>


<!-- PDF.JS -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<!-- JSPDF -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


<style>

/* =========================
   BASIC
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{

    background:#eef3f8;

    color:#172033;

    min-height:100vh;
}


/* =========================
   HEADER
========================= */

.header{

    background:
    linear-gradient(
        135deg,
        #075985,
        #0284c7
    );

    color:white;

    padding:18px 15px;

    text-align:center;

    box-shadow:
    0 3px 12px
    rgba(0,0,0,.15);
}

.header h1{

    font-size:25px;

    font-weight:800;
}

.header p{

    margin-top:5px;

    font-size:13px;

    opacity:.95;
}


/* =========================
   CONTAINER
========================= */

.container{

    max-width:680px;

    margin:auto;

    padding:
    16px
    14px
    35px;
}


/* =========================
   HOME
========================= */

.home-btn{

    display:block;

    width:100%;

    text-align:center;

    text-decoration:none;

    background:white;

    color:#075985;

    padding:13px;

    border-radius:12px;

    font-size:15px;

    font-weight:bold;

    box-shadow:
    0 2px 8px
    rgba(0,0,0,.10);

    margin-bottom:15px;
}


/* =========================
   CARD
========================= */

.card{

    background:white;

    border-radius:18px;

    padding:18px;

    box-shadow:
    0 3px 14px
    rgba(0,0,0,.10);

    margin-bottom:15px;
}

.card-title{

    font-size:18px;

    font-weight:bold;

    color:#075985;

    margin-bottom:13px;
}


/* =========================
   FILE PICKER
========================= */

.file-label{

    display:block;

    border:
    2px dashed
    #0284c7;

    background:#f0f9ff;

    border-radius:14px;

    padding:25px 15px;

    text-align:center;

    cursor:pointer;

    color:#075985;

    font-weight:bold;
}

.file-label span{

    display:block;

    font-size:40px;

    margin-bottom:8px;
}

.file-label small{

    display:block;

    margin-top:7px;

    font-size:12px;

    color:#64748b;

    font-weight:normal;
}

#pdfInput{

    display:none;
}


/* =========================
   FILE LIST
========================= */

.file-list{

    margin-top:14px;
}

.file-item{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    background:#f8fafc;

    border:
    1px solid
    #dbe5ee;

    border-radius:10px;

    padding:10px;

    margin-top:8px;

    font-size:13px;
}

.file-info{

    flex:1;

    min-width:0;
}

.file-name{

    font-weight:bold;

    word-break:break-all;
}

.file-size{

    color:#64748b;

    margin-top:3px;
}

.remove-btn{

    border:none;

    background:#fee2e2;

    color:#dc2626;

    padding:7px 9px;

    border-radius:8px;

    font-size:12px;

    font-weight:bold;

    cursor:pointer;
}


/* =========================
   MORE PDF
========================= */

.more-btn{

    width:100%;

    border:
    2px solid
    #0284c7;

    background:white;

    color:#0284c7;

    padding:12px;

    border-radius:11px;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    margin-top:12px;
}


/* =========================
   SETTINGS
========================= */

.controls{

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:12px;

    margin-top:15px;
}

label{

    font-size:14px;

    font-weight:bold;

    display:block;

    margin-bottom:7px;
}

select{

    width:100%;

    padding:12px;

    border:
    1px solid
    #cbd5e1;

    border-radius:10px;

    background:white;

    font-size:15px;

    outline:none;
}


/* =========================
   COMPRESS BUTTON
========================= */

.compress-btn{

    width:100%;

    border:none;

    background:
    linear-gradient(
        135deg,
        #0284c7,
        #0369a1
    );

    color:white;

    padding:15px;

    border-radius:12px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    margin-top:15px;

    box-shadow:
    0 4px 10px
    rgba(2,132,199,.25);
}

.compress-btn:disabled{

    opacity:.5;

    cursor:not-allowed;
}


/* =========================
   PROGRESS
========================= */

.progress-box{

    display:none;

    margin-top:15px;
}

.progress-text{

    font-size:13px;

    margin-bottom:7px;

    color:#475569;
}

.progress{

    width:100%;

    height:10px;

    background:#e2e8f0;

    border-radius:20px;

    overflow:hidden;
}

.progress-bar{

    width:0%;

    height:100%;

    background:
    linear-gradient(
        90deg,
        #0284c7,
        #16a34a
    );

    transition:.2s;
}


/* =========================
   RESULT
========================= */

.result{

    display:none;

    background:#f0fdf4;

    border:
    1px solid
    #bbf7d0;

    border-radius:14px;

    padding:15px;
}

.result h3{

    color:#15803d;

    font-size:17px;

    margin-bottom:10px;
}

.result-row{

    background:white;

    border-radius:10px;

    padding:11px;

    margin-top:8px;

    font-size:13px;
}

.result-size{

    color:#64748b;

    margin-top:5px;

    line-height:1.5;
}


/* =========================
   DOWNLOAD
========================= */

.download-btn{

    display:block;

    width:100%;

    text-align:center;

    text-decoration:none;

    background:#16a34a;

    color:white;

    padding:12px;

    border-radius:10px;

    font-size:14px;

    font-weight:bold;

    margin-top:10px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .controls{

        grid-template-columns:1fr;
    }

    .header h1{

        font-size:22px;
    }

    .card{

        padding:15px;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<div class="header">

    <h1>
        📄 SARVATRA
    </h1>

    <p>
        PDF Compress Tool
    </p>

</div>



<div class="container">


<!-- =========================
     HOME
========================= -->

<a
    href="../index.html"
    class="home-btn"
>

    🏠 SARVATRA Home

</a>



<!-- =========================
     MAIN CARD
========================= -->

<div class="card">


<div class="card-title">

    📄 Select PDF Files

</div>



<label
    for="pdfInput"
    class="file-label"
>

    <span>
        📂
    </span>

    Select PDF Files

    <small>
        Select multiple PDF files together
    </small>

</label>


<input
    type="file"
    id="pdfInput"
    accept="application/pdf,.pdf"
    multiple
>



<div
    class="file-list"
    id="fileList"
></div>



<button
    type="button"
    class="more-btn"
    id="moreBtn"
>

    ➕ More PDF

</button>



<!-- SETTINGS -->

<div class="controls">


<div>

<label for="targetSize">
    Target Size
</label>

<select id="targetSize">

<option value="100">
    100 KB
</option>

<option value="200">
    200 KB
</option>

<option
    value="300"
    selected
>
    300 KB
</option>

<option value="500">
    500 KB
</option>

<option value="1024">
    1 MB
</option>

</select>

</div>



<div>

<label for="quality">

    Compression Quality

</label>

<select id="quality">

<option value="high">
    High Quality
</option>

<option
    value="medium"
    selected
>
    Medium
</option>

<option value="low">
    Strong Compression
</option>

</select>

</div>


</div>



<!-- COMPRESS -->

<button
    class="compress-btn"
    id="compressBtn"
    disabled
>

    🗜️ Compress PDF

</button>



<!-- PROGRESS -->

<div
    class="progress-box"
    id="progressBox"
>

<div
    class="progress-text"
    id="progressText"
>
    Preparing...
</div>


<div class="progress">

<div
    class="progress-bar"
    id="progressBar"
>
</div>

</div>

</div>


</div>



<!-- =========================
     RESULT
========================= -->

<div
    class="card result"
    id="resultBox"
>

<h3>

    ✅ Compression Completed

</h3>


<div
    id="resultList"
></div>

</div>



</div>



<script>

/* =================================
   PDF.JS WORKER
================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =================================
   ELEMENTS
================================= */

const pdfInput =
document.getElementById(
    "pdfInput"
);

const moreBtn =
document.getElementById(
    "moreBtn"
);

const fileList =
document.getElementById(
    "fileList"
);

const compressBtn =
document.getElementById(
    "compressBtn"
);

const progressBox =
document.getElementById(
    "progressBox"
);

const progressBar =
document.getElementById(
    "progressBar"
);

const progressText =
document.getElementById(
    "progressText"
);

const resultBox =
document.getElementById(
    "resultBox"
);

const resultList =
document.getElementById(
    "resultList"
);


let selectedFiles = [];


/* =================================
   FILE SELECT
================================= */

pdfInput.addEventListener(
    "change",
    function(){

        addFiles(
            Array.from(
                this.files
            )
        );

        this.value = "";

    }
);


/* =================================
   MORE PDF
================================= */

moreBtn.addEventListener(
    "click",
    function(){

        pdfInput.click();

    }
);


/* =================================
   ADD FILES
================================= */

function addFiles(files){

    files.forEach(
        function(file){

            if(
                !file.name
                .toLowerCase()
                .endsWith(".pdf")
            ){

                return;

            }


            const duplicate =
            selectedFiles.some(
                function(old){

                    return(
                        old.name === file.name
                        &&
                        old.size === file.size
                    );

                }
            );


            if(!duplicate){

                selectedFiles.push(
                    file
                );

            }

        }
    );


    renderFiles();

}


/* =================================
   RENDER FILES
================================= */

function renderFiles(){

    fileList.innerHTML = "";


    selectedFiles.forEach(
        function(file,index){

            const item =
            document.createElement(
                "div"
            );

            item.className =
            "file-item";


            item.innerHTML = `

            <div class="file-info">

                <div class="file-name">

                    📄
                    ${escapeHtml(
                        file.name
                    )}

                </div>

                <div class="file-size">

                    ${formatSize(
                        file.size
                    )}

                </div>

            </div>


            <button
                class="remove-btn"
                onclick="removeFile(${index})"
            >

                Remove

            </button>

            `;


            fileList.appendChild(
                item
            );

        }
    );


    compressBtn.disabled =
    selectedFiles.length === 0;

}


/* =================================
   REMOVE
================================= */

function removeFile(index){

    selectedFiles.splice(
        index,
        1
    );

    renderFiles();

}


/* =================================
   SIZE
================================= */

function formatSize(bytes){

    if(bytes < 1024){

        return bytes + " B";

    }


    if(
        bytes <
        1024 * 1024
    ){

        return(
            bytes / 1024
        ).toFixed(1)
        + " KB";

    }


    return(
        bytes /
        (1024 * 1024)
    ).toFixed(2)
    + " MB";

}


/* =================================
   ESCAPE
================================= */

function escapeHtml(text){

    return text.replace(
        /[&<>"']/g,
        function(m){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[m];

        }
    );

}


/* =================================
   GET QUALITY SETTINGS
================================= */

function getQualitySettings(){

    const level =
    document.getElementById(
        "quality"
    ).value;


    if(level === "high"){

        return {

            scale:1.25,

            quality:.72

        };

    }


    if(level === "low"){

        return {

            scale:.70,

            quality:.38

        };

    }


    return {

        scale:.90,

        quality:.52

    };

}


/* =================================
   REAL PDF COMPRESSION
================================= */

async function compressPDF(
    file,
    targetKB
){

    const originalBytes =
    await file.arrayBuffer();


    const pdf =
    await pdfjsLib.getDocument({
        data:originalBytes
    }).promise;


    const settings =
    getQualitySettings();


    /*
       First attempt
    */

    let result =
    await renderPDF(
        pdf,
        settings.scale,
        settings.quality
    );


    /*
       If still above target,
       progressively reduce quality.
    */

    let attempts = 0;


    while(
        result.size >
        targetKB * 1024
        &&
        attempts < 4
    ){

        attempts++;


        let newScale =
        settings.scale -
        (attempts * .12);


        let newQuality =
        settings.quality -
        (attempts * .08);


        if(newScale < .45){

            newScale = .45;

        }


        if(newQuality < .22){

            newQuality = .22;

        }


        result =
        await renderPDF(
            pdf,
            newScale,
            newQuality
        );

    }


    /*
       Never return a larger PDF
       than original.
    */

    if(
        result.size >=
        file.size
    ){

        return {

            blob:
            new Blob(
                [originalBytes],
                {
                    type:
                    "application/pdf"
                }
            ),

            reached:false

        };

    }


    return {

        blob:result.blob,

        reached:
        result.size <=
        targetKB * 1024

    };

}


/* =================================
   RENDER ALL PAGES
================================= */

async function renderPDF(
    pdf,
    scale,
    quality
){

    const {
        jsPDF
    } =
    window.jspdf;


    let doc = null;


    for(
        let pageNumber = 1;
        pageNumber <= pdf.numPages;
        pageNumber++
    ){

        progressText.textContent =
        "Processing page "
        +
        pageNumber
        +
        " of "
        +
        pdf.numPages;


        const page =
        await pdf.getPage(
            pageNumber
        );


        const viewport =
        page.getViewport({
            scale:scale
        });


        const canvas =
        document.createElement(
            "canvas"
        );


        const context =
        canvas.getContext(
            "2d",
            {
                alpha:false
            }
        );


        canvas.width =
        Math.floor(
            viewport.width
        );


        canvas.height =
        Math.floor(
            viewport.height
        );


        context.fillStyle =
        "#ffffff";


        context.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        await page.render({

            canvasContext:
            context,

            viewport:
            viewport

        }).promise;


        const image =
        canvas.toDataURL(
            "image/jpeg",
            quality
        );


        const orientation =
        viewport.width >
        viewport.height
        ?
        "landscape"
        :
        "portrait";


        const width =
        viewport.width;


        const height =
        viewport.height;


        if(!doc){

            doc =
            new jsPDF({

                orientation:
                orientation,

                unit:"pt",

                format:[
                    width,
                    height
                ],

                compress:true

            });

        }
        else{

            doc.addPage(
                [
                    width,
                    height
                ],
                orientation
            );

        }


        doc.addImage(
            image,
            "JPEG",
            0,
            0,
            width,
            height,
            undefined,
            "FAST"
        );


        canvas.width = 1;

        canvas.height = 1;


        const percent =
        pageNumber /
        pdf.numPages *
        100;


        progressBar.style.width =
        percent.toFixed(0)
        + "%";


        await new Promise(
            function(resolve){

                setTimeout(
                    resolve,
                    0
                );

            }
        );

    }


    const blob =
    doc.output(
        "blob"
    );


    return {

        blob:blob,

        size:blob.size

    };

}


/* =================================
   COMPRESS BUTTON
================================= */

compressBtn.addEventListener(
    "click",
    async function(){

        if(
            selectedFiles.length === 0
        ){

            alert(
                "Please select PDF files."
            );

            return;

        }


        compressBtn.disabled =
        true;


        progressBox.style.display =
        "block";


        resultBox.style.display =
        "none";


        resultList.innerHTML =
        "";


        const targetKB =
        Number(
            document.getElementById(
                "targetSize"
            ).value
        );


        for(
            let i=0;
            i<selectedFiles.length;
            i++
        ){

            const file =
            selectedFiles[i];


            progressText.textContent =
            "Opening "
            +
            (i+1)
            +
            " of "
            +
            selectedFiles.length
            +
            ": "
            +
            file.name;


            progressBar.style.width =
            (
                i /
                selectedFiles.length *
                100
            )
            + "%";


            try{

                const compressed =
                await compressPDF(
                    file,
                    targetKB
                );


                showResult(
                    file,
                    compressed.blob,
                    compressed.reached,
                    targetKB
                );

            }
            catch(error){

                console.error(
                    error
                );


                const row =
                document.createElement(
                    "div"
                );


                row.className =
                "result-row";


                row.innerHTML = `

                    ❌
                    ${escapeHtml(
                        file.name
                    )}

                    <div class="result-size">

                        Unable to compress
                        this PDF.

                    </div>

                `;

resultList.appendChild(
                    row
                );

            }

        }


        progressBar.style.width =
        "100%";


        progressText.textContent =
        "All PDFs completed.";


        resultBox.style.display =
        "block";


        compressBtn.disabled =
        false;

    }
);


/* =================================
   RESULT
================================= */

function showResult(
    originalFile,
    blob,
    reached,
    targetKB
){

    const originalSize =
    originalFile.size;


    const newSize =
    blob.size;


    const reduction =
    originalSize > 0
    ?
    (
        (
            originalSize -
            newSize
        )
        /
        originalSize
        *
        100
    )
    :
    0;


    const row =
    document.createElement(
        "div"
    );


    row.className =
    "result-row";


    row.innerHTML = `

        <b>
            📄
            ${escapeHtml(
                originalFile.name
            )}
        </b>

        <div class="result-size">

            Original:
            ${formatSize(
                originalSize
            )}

            <br>

            Compressed:
            ${formatSize(
                newSize
            )}

            <br>

            Reduced:
            ${reduction.toFixed(1)}%

            <br>

            ${
                reached
                ?
                "🎯 Target reached"
                :
                "ℹ️ Best possible result in browser"
            }

        </div>

    `;


    const download =
    document.createElement(
        "a"
    );


    download.className =
    "download-btn";


    download.textContent =
    "⬇️ Download Compressed PDF";


    const url =
    URL.createObjectURL(
        blob
    );


    download.href =
    url;


    download.download =
    originalFile.name
    .replace(
        /\.pdf$/i,
        ""
    )
    +
    "-compressed.pdf";


    row.appendChild(
        download
    );


    resultList.appendChild(
        row
    );

}

</script>


</body>

</html>
