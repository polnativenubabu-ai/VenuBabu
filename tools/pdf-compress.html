/* HEADER */

<body>

<!-- HEADER -->

<div class="header">

    <h1>📄 SARVATRA</h1>

    <p>
        PDF Compress Tool
    </p>

</div>


<div class="container">

    <!-- HOME BUTTON -->

    <a
        href="../index.html"
        class="home-btn"
    >
        🏠 SARVATRA Home
    </a>


    <!-- MAIN CARD -->

    <div class="card">

        <div class="card-title">
            📄 Select PDF Files
        </div>


        <!-- FILE SELECT -->

        <label
            for="pdfInput"
            class="file-label"
        >

            <span>📂</span>

            Select PDF Files

            <small>
                Multiple PDFs can be selected
            </small>

        </label>


        <input
            type="file"
            id="pdfInput"
            accept="application/pdf,.pdf"
            multiple
        >


        <!-- FILE LIST -->

        <div
            class="file-list"
            id="fileList"
        ></div>


        <!-- MORE PDF -->

        <button
            type="button"
            class="more-btn"
            id="moreBtn"
        >
            ➕ More PDF
        </button>


        <!-- SETTINGS -->

        <div
            class="controls"
            style="margin-top:15px;"
        >

            <div>

                <label for="targetSize">
                    Target Size
                </label>

                <select id="targetSize">

                    <option value="100">
                        100 KB
                    </option>

                    <option value="200">
                        200 KB
                    </option>

                    <option
                        value="300"
                        selected
                    >
                        300 KB
                    </option>

                    <option value="500">
                        500 KB
                    </option>

                    <option value="1024">
                        1 MB
                    </option>

                </select>

            </div>


            <div>

                <label for="quality">
                    Quality
                </label>

                <select id="quality">

                    <option value="0.9">
                        High Quality
                    </option>

                    <option
                        value="0.7"
                        selected
                    >
                        Medium
                    </option>

                    <option value="0.5">
                        Strong Compress
                    </option>

                </select>

            </div>

        </div>


        <!-- COMPRESS -->

        <button
            class="compress-btn"
            id="compressBtn"
            disabled
        >
            🗜️ Compress PDF
        </button>


        <!-- PROGRESS -->

        <div
            class="progress-box"
            id="progressBox"
        >

            <div
                class="progress-text"
                id="progressText"
            >
                Preparing...
            </div>

            <div class="progress">

                <div
                    class="progress-bar"
                    id="progressBar"
                ></div>

            </div>

        </div>

    </div>


    <!-- RESULT -->

    <div
        class="result"
        id="resultBox"
    >

        <h3>
            ✅ Compression Completed
        </h3>

        <div
            id="resultList"
        ></div>

    </div>

</div>


<div class="footer">

    SARVATRA • All Government Services

</div>


<script
src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js">
</script>


<script>

/* VARIABLES */

const pdfInput =
    document.getElementById(
        "pdfInput"
    );

const moreBtn =
    document.getElementById(
        "moreBtn"
    );

const fileList =
    document.getElementById(
        "fileList"
    );

const compressBtn =
    document.getElementById(
        "compressBtn"
    );

const progressBox =
    document.getElementById(
        "progressBox"
    );

const progressBar =
    document.getElementById(
        "progressBar"
    );

const progressText =
    document.getElementById(
        "progressText"
    );

const resultBox =
    document.getElementById(
        "resultBox"
    );

const resultList =
    document.getElementById(
        "resultList"
    );


let selectedFiles = [];


/* SELECT PDF */

pdfInput.addEventListener(
    "change",
    function(){

        addFiles(
            Array.from(
                this.files
            )
        );

        this.value = "";

    }
);


/* MORE PDF */

moreBtn.addEventListener(
    "click",
    function(){

        pdfInput.click();

    }
);


/* ADD FILES */

function addFiles(files){

    files.forEach(
        function(file){

            if(
                file.type !==
                "application/pdf"
                &&
                !file.name
                    .toLowerCase()
                    .endsWith(".pdf")
            ){
                return;
            }


            const exists =
                selectedFiles.some(
                    f =>
                    f.name === file.name
                    &&
                    f.size === file.size
                );


            if(!exists){

                selectedFiles.push(
                    file
                );

            }

        }
    );


    renderFiles();

}


/* DISPLAY FILES */

function renderFiles(){

    fileList.innerHTML = "";


    if(
        selectedFiles.length === 0
    ){

        compressBtn.disabled = true;

        return;

    }


    selectedFiles.forEach(
        function(file,index){

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "file-item";


            item.innerHTML = `

                <div class="file-info">

                    <div class="file-name">
                        📄 ${escapeHtml(
                            file.name
                        )}
                    </div>

                    <div class="file-size">
                        ${formatSize(
                            file.size
                        )}
                    </div>

                </div>


                <button
                    class="remove-btn"
                    onclick="removeFile(${index})"
                >
                    Remove
                </button>

            `;


            fileList.appendChild(
                item
            );

        }
    );


    compressBtn.disabled = false;

}


/* REMOVE FILE */

function removeFile(index){

    selectedFiles.splice(
        index,
        1
    );

    renderFiles();

}


/* FORMAT SIZE */

function formatSize(bytes){

    if(bytes < 1024){

        return bytes + " B";

    }

    if(
        bytes <
        1024 * 1024
    ){

        return (
            bytes / 1024
        ).toFixed(1)
        + " KB";

    }


    return (
        bytes /
        (1024 * 1024)
    ).toFixed(2)
    + " MB";

}


/* ESCAPE */

function escapeHtml(text){

    return text.replace(
        /[&<>"']/g,
        function(match){

            const map = {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            };

            return map[match];

        }
    );

}


/* COMPRESS */

compressBtn.addEventListener(
    "click",
    async function(){

        if(
            selectedFiles.length === 0
        ){

            alert(
                "Please select PDF files."
            );

            return;

        }


        compressBtn.disabled = true;

        progressBox.style.display =
            "block";

        resultBox.style.display =
            "none";

        resultList.innerHTML =
            "";

        const targetKB =
            Number(
                document.getElementById(
                    "targetSize"
                ).value
            );


        for(
            let i = 0;
            i < selectedFiles.length;
            i++
        ){

            const file =
                selectedFiles[i];


            progressText.textContent =
                "Compressing "
                +
                (i + 1)
                +
                " of "
                +
                selectedFiles.length
                +
                " : "
                +
                file.name;


            progressBar.style.width =
                (
                    i /
                    selectedFiles.length
                    *
                    100
                )
                + "%";


            try{

                const compressed =
                    await compressPDF(
                        file,
                        targetKB
                    );


                showResult(
                    file,
                    compressed
                );


            }
            catch(error){

                console.error(
                    error
                );


                const errorRow =
                    document.createElement(
                        "div"
                    );

                errorRow.className =
                    "result-row";

                errorRow.innerHTML =
                    `
                    ❌ ${escapeHtml(
                        file.name
                    )}

                    <div class="result-size">
                        Unable to compress this PDF.
                    </div>
                    `;

                resultList.appendChild(
                    errorRow
                );

            }

        }


        progressBar.style.width =
            "100%";

        progressText.textContent =
            "All PDFs completed.";

        resultBox.style.display =
            "block";

        compressBtn.disabled =
            false;

    }
);


/* PDF COMPRESS FUNCTION */

async function compressPDF(
    file,
    targetKB
){

    const arrayBuffer =
        await file.arrayBuffer();


    const pdfDoc =
        await PDFLib.PDFDocument.load(
            arrayBuffer,
            {
                ignoreEncryption:true
            }
        );


    /*
      Re-save PDF using
      compressed object streams.
    */

    let bytes =
        await pdfDoc.save({

            useObjectStreams:true,

            addDefaultPage:false

        });


    /*
      If original is already
      smaller, keep original.
    */

    if(
        bytes.length >=
        file.size
    ){

        return new Blob(
            [arrayBuffer],
            {
                type:
                "application/pdf"
            }
        );

    }


    return new Blob(
        [bytes],
        {
            type:
            "application/pdf"
        }
    );

}


/* SHOW RESULT */

function showResult(
    originalFile,
    compressedBlob
){

    const originalSize =
        originalFile.size;

    const newSize =
        compressedBlob.size;


    const reduced =
        originalSize > 0
        ?
        (
            (
                originalSize -
                newSize
            )
            /
            originalSize
            *
            100
        )
        : 0;


    const row =
        document.createElement(
            "div"
        );

    row.className =
        "result-row";


    const title =
        document.createElement(
            "div"
        );

    title.innerHTML =
        `
        <b>
            📄 ${escapeHtml(
                originalFile.name
            )}
        </b>

        <div class="result-size">

            ${formatSize(
                originalSize
            )}

            →
            
            ${formatSize(
                newSize
            )}

            <br>

            Reduced:
            ${reduced.toFixed(1)}%

        </div>
        `;


    row.appendChild(
        title
    );


    const download =
        document.createElement(
            "a"
        );


    download.className =
        "download-btn";


    download.textContent =
        "⬇️ Download Compressed PDF";


    download.href =
        URL.createObjectURL(
            compressedBlob
        );


    download.download =
        originalFile.name
            .replace(
                /\.pdf$/i,
                ""
            )
        +
        "-compressed.pdf";


    row.appendChild(
        download
    );


    resultList.appendChild(
        row
    );

}

</script>
