<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit PDF Pages - SARVATRA</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

header{
    background:#0d6efd;
    color:#fff;
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

input[type=file]{
    width:100%;
    padding:10px;
    margin-bottom:20px;
}

#preview{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:15px;
}

.page-card{
    background:#fff;
    border-radius:10px;
    padding:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
    text-align:center;
}

canvas{
    width:100%;
    height:auto;
    border:1px solid #ddd;
    border-radius:5px;
}

.page-title{
    margin:10px 0;
    font-weight:bold;
}

button{
    padding:8px 12px;
    margin:4px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.download{
    background:#28a745;
    color:#fff;
}

.home{
    background:#0d6efd;
    color:#fff;
}
    #uploadBtn,
#addBtn{
    background:#0d6efd;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    margin:5px;
    font-size:16px;
}
    .subtitle{
    text-align:center;
    color:#666;
    font-size:16px;
    margin:15px 0;
    }
    header{
    background:#0d6efd;
    color:#fff;
    padding:18px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.top-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.top-bar h1{
    margin:0;
    flex:1;
    text-align:center;
    font-size:24px;
}

.home-btn{
    background:#fff;
    color:#0d6efd;
    border:none;
    padding:8px 15px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.subtitle{
    margin-top:10px;
    font-size:15px;
    opacity:.95;
}
    .tool-card{
    background:#fff;
    border-radius:16px;
    padding:25px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
    margin-top:20px;
}

.container{
    max-width:950px;
    margin:25px auto;
    padding:15px;
}
</style>
</head>

<body>

<header>Edit PDF Pages</header>
    <p class="subtitle">
Upload your PDF and edit pages easily
    </p>

<div class="container">
<div class="tool-card">


<input type="file" id="pdfInput" accept="application/pdf" hidden>

<button id="uploadBtn">📂 Upload PDF</button>
<button id="addBtn">➕ Add PDF</button>

<br><br>

<div id="preview"></div>

<br>

<button class="download" id="saveBtn">💾 Download PDF</button>

<header>
    <div class="top-bar">
        <button class="home-btn" onclick="location.href='../index.html'">🏠 Home</button>
        <h1>📄 Edit PDF Pages</h1>
    </div>
    <p class="subtitle">Delete • Rotate • Rearrange PDF Pages Easily</p>
</header>

</div> 

</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

    <script src="edit-pdf.js"></script>

</body>
</html>
