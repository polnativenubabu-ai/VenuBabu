<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SARVATRA Digital Business Card</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#fff;
    color:#222;
    padding-bottom:25px;
}
.header{
    text-align:center;
    padding:16px 8px 14px;
}
.header h1{
    margin:0;
    color:#b996b1;
    font:700 27px Georgia,serif;
}
.container{
    width:100%;
    max-width:720px;
    margin:auto;
    padding:0 18px;
}

/* ================= CARD ================= */

#card{
    position:relative;
    width:100%;
    aspect-ratio:1.586;
    overflow:hidden;
    background:#fff;
    border:1px solid #ddd;
    border-radius:22px;
    isolation:isolate;
}

/* Background is ONLY a background layer */
#cardBg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    background-position:center;
    background-size:cover;
    background-repeat:no-repeat;
    display:none;
}

.cardShade{
    position:absolute;
    inset:0;
    z-index:1;
    background:rgba(255,255,255,.08);
}

.cardContent{
    position:absolute;
    inset:0;
    z-index:5;
    padding:4% 4% 12%;
}

.topRow{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
}

.leftTop{
    width:58%;
    min-width:0;
}

.titlePreview{
    color:#79066e;
    font:700 31px/1.05 Georgia,serif;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.emailPreview{
    color:#064b8d;
    font-size:17px;
    margin-top:6px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.rightTop{
    width:38%;
    text-align:right;
    color:#173c65;
}

.namePreview{
    font-size:22px;
    font-weight:800;
    line-height:1.08;
    overflow-wrap:anywhere;
}

.phonePreview{
    margin-top:7px;
    font-size:18px;
    font-weight:800;
}

.middleRow{
    display:flex;
    align-items:center;
    gap:6%;
    height:56%;
    margin-top:3%;
}

.logoArea{
    width:39%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

#logoPreview{
    display:none;
    max-width:88%;
    max-height:90%;
    width:auto;
    height:auto;
    object-fit:contain;
}

.serviceArea{
    flex:1;
    min-width:0;
}

.servicePreview{
    color:#07566b;
    font-size:18px;
    font-weight:800;
    line-height:1.15;
    margin:8px 0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.servicePreview:before{
    content:"•";
    color:#0b9b4b;
    margin-right:9px;
}

.addressPreview{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    min-height:13%;
    z-index:8;
    padding:8px 18px;
    background:rgba(255,255,255,.78);
    color:#5b185f;
    text-align:center;
    font:17px/1.18 Georgia,serif;
    overflow:hidden;
}

/* ================= CONTROLS ================= */

.controls{
    margin-top:30px;
}

.topTools{
    display:grid;
    grid-template-columns:55px 1fr 1.45fr;
    gap:8px;
    align-items:center;
}

.clearTool{
    text-align:center;
}

.clearTool button{
    width:48px;
    height:54px;
    border:0;
    background:none;
    color:#c40000;
    font-size:38px;
    cursor:pointer;
}

.clearTool span{
    display:block;
    font-size:16px;
}

.toolButton{
    height:78px;
    border:0;
    border-radius:18px;
    background:#1976d2;
    color:#fff;
    font-size:21px;
    font-weight:800;
    box-shadow:0 3px 6px #0003;
    cursor:pointer;
}

input[type=file]{
    display:none;
}

.fields{
    margin-top:26px;
}

.field{
    display:grid;
    grid-template-columns:55px 1fr;
    gap:10px;
    align-items:center;
    margin-bottom:16px;
}

.fieldIcon{
    text-align:center;
    font-size:37px;
    opacity:.7;
}

.field input,
.field textarea{
    width:100%;
    border:1px solid #999;
    border-radius:11px;
    padding:17px 14px;
    font-size:20px;
    font-weight:bold;
    outline:none;
    background:#fff;
}

.field textarea{
    min-height:80px;
    resize:vertical;
}

.serviceTitle{
    color:#07566b;
    font-size:21px;
    font-weight:800;
    margin:12px 0 15px;
}

.serviceRow{
    display:grid;
    grid-template-columns:55px 1fr;
    gap:10px;
    align-items:center;
    margin-bottom:14px;
}

.number{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#9bd8e9;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:bold;
    margin:auto;
}

.serviceRow input{
    width:100%;
    border:1px solid #bbb;
    border-radius:11px;
    padding:17px 14px;
    font-size:20px;
    color:#1c586b;
}

/* ================= ACTION BUTTONS ================= */

.actionButtons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
    margin-top:25px;
}

.actionBtn{
    border:0;
    border-radius:12px;
    color:#fff;
    padding:14px 8px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

.preview{background:#7b1fa2}
.jpg{background:#1976d2}
.pdf{background:#159447}
.print{background:#ef8b00}
.share{background:#6a1b9a}
.home{background:#00695c}

/* ================= PRINT ================= */

@page{
    size:A4 landscape;
    margin:0;
}

@media print{
    html,body{
        width:100%;
        height:100%;
        background:#fff!important;
    }

    body *{
        visibility:hidden!important;
    }

    #card,#card *{
        visibility:visible!important;
    }

    #card{
        position:absolute!important;
        left:50%!important;
        top:50%!important;
        transform:translate(-50%,-50%)!important;
        width:90vw!important;
        max-width:none!important;
        border:0!important;
        box-shadow:none!important;
        print-color-adjust:exact!important;
        -webkit-print-color-adjust:exact!important;
    }

    #cardBg{
        display:block!important;
    }
}

/* ================= MOBILE ================= */

@media(max-width:600px){
    .header h1{
        font-size:27px;
    }

    .container{
        padding:0 18px;
    }

    .titlePreview{
        font-size:25px;
    }

    .emailPreview{
        font-size:14px;
    }

    .namePreview{
        font-size:16px;
    }

    .phonePreview{
        font-size:15px;
    }

    .middleRow{
        gap:5%;
    }

    .logoArea{
        width:40%;
    }

    #logoPreview{
        max-width:90%;
        max-height:90%;
    }

    .servicePreview{
        font-size:13px;
        margin:5px 0;
    }

    .addressPreview{
        font-size:11px;
        min-height:14%;
        padding:6px 10px;
    }

    .toolButton{
        height:78px;
        font-size:18px;
    }

    .field input,
    .field textarea{
        font-size:18px;
    }

    .actionButtons{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>Create Your Digital Business Card</h1>
</div>

<div class="container">

<!-- ================= CARD PREVIEW ================= -->

<div id="card">

    <div id="cardBg"></div>
    <div class="cardShade"></div>

    <div class="cardContent">

        <div class="topRow">

            <div class="leftTop">
                <div class="titlePreview" id="pTitle">Business Name</div>
                <div class="emailPreview" id="pEmail">email@example.com</div>
            </div>

            <div class="rightTop">
                <div class="namePreview" id="pName">User Name</div>
                <div class="phonePreview">
                    ☎ <span id="pPhone">9999999999</span>
                </div>
            </div>

        </div>

        <div class="middleRow">

            <div class="logoArea">
                <img id="logoPreview" alt="Logo">
            </div>

            <div class="serviceArea">
                <div class="servicePreview" id="pService1">Service One</div>
                <div class="servicePreview" id="pService2">Service Two</div>
                <div class="servicePreview" id="pService3">Service Three</div>
                <div class="servicePreview" id="pService4">Service Four</div>
                <div class="servicePreview" id="pService5">All Digital Works</div>
            </div>

        </div>

    </div>

    <div class="addressPreview" id="pAddress">
        Your Address
    </div>

</div>

<!-- ================= EDITOR ================= -->

<div class="controls">

    <div class="topTools">

        <div class="clearTool">
            <button type="button" onclick="clearAll()">🗑️</button>
            <span>Clear</span>
        </div>

        <button type="button"
                class="toolButton"
                onclick="document.getElementById('logoInput').click()">
            Change Logo
        </button>

        <button type="button"
                class="toolButton"
                onclick="document.getElementById('bgInput').click()">
            Change Background
        </button>

    </div>

    <input id="logoInput" type="file" accept="image/*">
    <input id="bgInput" type="file" accept="image/*">

    <div class="fields">

        <div class="field">
            <div class="fieldIcon">🏢</div>
            <input id="titleInput"
                   value="Business Name"
                   oninput="updateCard()">
        </div>

        <div class="field">
            <div class="fieldIcon">👤</div>
            <input id="nameInput"
                   value="User Name"
                   oninput="updateCard()">
        </div>

        <div class="field">
            <div class="fieldIcon">✉️</div>
            <input id="emailInput"
                   value="email@example.com"
                   oninput="updateCard()">
        </div>

        <div class="field">
            <div class="fieldIcon">📞</div>
            <input id="phoneInput"
                   value="9999999999"
                   oninput="updateCard()">
        </div>

        <div class="field">
            <div class="fieldIcon">🏠</div>
            <textarea id="addressInput"
                      oninput="updateCard()">Your Address</textarea>
        </div>

    </div>

    <div class="serviceTitle">
        ↘ Your Service / Products / Other Details
    </div>

    <div class="serviceRow">
        <div class="number">1</div>
        <input id="service1"
               value="Service One"
               oninput="updateCard()">
    </div>

    <div class="serviceRow">
        <div class="number">2</div>
        <input id="service2"
               value="Service Two"
               oninput="updateCard()">
    </div>

    <div class="serviceRow">
        <div class="number">3</div>
        <input id="service3"
               value="Service Three"
               oninput="updateCard()">
    </div>

    <div class="serviceRow">
        <div class="number">4</div>
        <input id="service4"
               value="Service Four"
               oninput="updateCard()">
    </div>

    <div class="serviceRow">
        <div class="number">5</div>
        <input id="service5"
               value="All Digital Works"
               oninput="updateCard()">
    </div>

    <div class="actionButtons">

        <button type="button"
                class="actionBtn preview"
                onclick="previewCard()">
            👁️ Preview
        </button>

        <button type="button"
                class="actionBtn jpg"
                onclick="downloadJPG()">
            📥 Download JPG
        </button>

        <button type="button"
                class="actionBtn pdf"
                onclick="downloadPDF()">
            📄 Download PDF
        </button>

        <button type="button"
                class="actionBtn print"
                onclick="printCard()">
            🖨️ Print
        </button>

        <button type="button"
                class="actionBtn share"
                onclick="shareCard()">
            📤 Share
        </button>

        <!-- SARVATRA HOME BUTTON -->
        <button type="button"
                class="actionBtn home"
                onclick="goHome()">
            🏠 SARVATRA Home
        </button>

    </div>

</div>
</div>

<script>
const logoInput = document.getElementById("logoInput");
const bgInput = document.getElementById("bgInput");

/* ================= UPDATE ================= */

function updateCard(){

    document.getElementById("pTitle").textContent =
        document.getElementById("titleInput").value || "Business Name";

    document.getElementById("pName").textContent =
        document.getElementById("nameInput").value || "User Name";

    document.getElementById("pEmail").textContent =
        document.getElementById("emailInput").value || "";

    document.getElementById("pPhone").textContent =
        document.getElementById("phoneInput").value || "";

    document.getElementById("pAddress").textContent =
        document.getElementById("addressInput").value || "";

    for(let i=1;i<=5;i++){
        document.getElementById("pService"+i).textContent =
            document.getElementById("service"+i).value || "";
    }
}

/* ================= LOGO ================= */

logoInput.addEventListener("change",function(e){

    const file=e.target.files[0];

    if(!file)return;

    const reader=new FileReader();

    reader.onload=function(ev){

        const img=document.getElementById("logoPreview");

        img.src=ev.target.result;
        img.style.display="block";

    };

    reader.readAsDataURL(file);
});

/* ================= BACKGROUND ================= */

bgInput.addEventListener("change",function(e){

    const file=e.target.files[0];

    if(!file)return;

    const reader=new FileReader();

    reader.onload=function(ev){

        const bg=document.getElementById("cardBg");

        bg.style.backgroundImage =
            'url("' + ev.target.result + '")';

        bg.style.display="block";

    };

    reader.readAsDataURL(file);
});

/* ================= CANVAS ================= */

async function makeCanvas(){

    await new Promise(resolve=>setTimeout(resolve,300));

    const card=document.getElementById("card");

    return await html2canvas(card,{
        scale:3,
        useCORS:true,
        allowTaint:false,
        backgroundColor:"#ffffff",
        imageTimeout:20000,
        logging:false
    });
}

/* ================= JPG ================= */

async function downloadJPG(){

    try{

        const canvas=await makeCanvas();

        canvas.toBlob(function(blob){

            if(!blob){
                alert("JPG download failed.");
                return;
            }

            const url=URL.createObjectURL(blob);

            const a=document.createElement("a");

            a.href=url;
            a.download="SARVATRA-Digital-Business-Card.jpg";

            document.body.appendChild(a);
            a.click();
            a.remove();

            setTimeout(()=>{
                URL.revokeObjectURL(url);
            },1000);

        },"image/jpeg",0.95);

    }catch(error){

        console.error(error);
        alert("JPG download failed.");

    }
}

/* ================= PDF ================= */

async function downloadPDF(){

    try{

        const canvas=await makeCanvas();

        const image=canvas.toDataURL("image/jpeg",0.95);

        const {jsPDF}=window.jspdf;

        const pdf=new jsPDF({
            orientation:"landscape",
            unit:"mm",
            format:"a4"
        });

        const pageWidth=pdf.internal.pageSize.getWidth();
        const pageHeight=pdf.internal.pageSize.getHeight();

        const margin=10;

        const width=pageWidth-(margin*2);

        const height=
            width/(canvas.width/canvas.height);

        const y=
            (pageHeight-height)/2;

        pdf.addImage(
            image,
            "JPEG",
            margin,
            y,
            width,
            height
        );

        pdf.save(
            "SARVATRA-Digital-Business-Card.pdf"
        );

    }catch(error){

        console.error(error);
        alert("PDF download failed.");

    }
}

/* ================= PRINT ================= */

function printCard(){

    window.print();

}

/* ================= SHARE ================= */

async function shareCard(){

    try{

        const canvas=await makeCanvas();

        canvas.toBlob(async function(blob){

            if(!blob){
                alert("Share failed.");
                return;
            }

            const file=new File(
                [blob],
                "SARVATRA-Digital-Business-Card.jpg",
                {
                    type:"image/jpeg"
                }
            );

            if(
                navigator.share &&
                navigator.canShare &&
                navigator.canShare({
                    files:[file]
                })
            ){

                await navigator.share({
                    title:"SARVATRA Digital Business Card",
                    text:"My Digital Business Card",
                    files:[file]
                });

            }else if(navigator.share){

                await navigator.share({
                    title:"SARVATRA Digital Business Card",
                    text:"My Digital Business Card"
                });

            }else{

                alert(
                    "Share support లేదు. JPG Download చేసి Share చేయండి."
                );

            }

        },"image/jpeg",0.95);

    }catch(error){

        if(error.name!=="AbortError"){

            console.error(error);

            alert("Share failed.");

        }

    }
}

/* ================= PREVIEW ================= */

function previewCard(){

    const card=document.getElementById("card");

    const win=window.open(
        "",
        "_blank"
    );

    if(!win){

        alert(
            "Preview కోసం pop-up allow చేయండి."
        );

        return;
    }

    win.document.write(`
<!DOCTYPE html>
<html>
<head>
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>SARVATRA Card Preview</title>

<style>

html,body{
    margin:0;
    min-height:100%;
    background:#222;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
}

#card{
    width:min(900px,100%);
    aspect-ratio:1.586;
    position:relative;
    overflow:hidden;
    background:#fff;
    border-radius:22px;
}

#cardBg{
    position:absolute!important;
    inset:0!important;
    width:100%!important;
    height:100%!important;
    background-position:center!important;
    background-size:cover!important;
    background-repeat:no-repeat!important;
}

.cardShade{
    position:absolute!important;
    inset:0!important;
}

.cardContent{
    position:absolute!important;
    inset:0!important;
}

.addressPreview{
    position:absolute!important;
    left:0!important;
    right:0!important;
    bottom:0!important;
}

</style>
</head>

<body>

${card.outerHTML}

</body>
</html>
`);

    win.document.close();
}

/* ================= CLEAR ================= */

function clearAll(){

    document.getElementById("titleInput").value="";
    document.getElementById("nameInput").value="";
    document.getElementById("emailInput").value="";
    document.getElementById("phoneInput").value="";
    document.getElementById("addressInput").value="";

    for(let i=1;i<=5;i++){

        document.getElementById(
            "service"+i
        ).value="";

    }

    document.getElementById(
        "logoPreview"
    ).style.display="none";

    document.getElementById(
        "logoPreview"
    ).removeAttribute("src");

    document.getElementById(
        "cardBg"
    ).style.backgroundImage="";

    document.getElementById(
        "cardBg"
    ).style.display="none";

    updateCard();
}

/* ================= SARVATRA HOME ================= */

function goHome(){

    window.location.href="../index.html";

}

/* INITIAL */

updateCard();

</script>

</body>
</html>
