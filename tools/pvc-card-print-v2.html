<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PVC Card Print | SARVATRA</title>

<link rel="icon" href="../icon-192.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
}

header{
background:#0d6efd;
color:#fff;
text-align:center;
padding:20px;
position:relative;
}

.home-btn{
position:absolute;
left:15px;
top:15px;
background:#fff;
color:#0d6efd;
border:none;
padding:8px 14px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.container{
max-width:900px;
margin:20px auto;
padding:15px;
}

.box{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
margin-bottom:20px;
}

.card-preview{
width:340px;
height:215px;
margin:20px auto;
border:2px solid #ddd;
border-radius:10px;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:#fafafa;
}

.card-preview img{
width:100%;
height:100%;
object-fit:cover;
display:none;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

</style>

</head>

<body>

<header>

<button class="home-btn" onclick="window.location.href='../index.html'">
🏠 Home
</button>

<h1>💳 PVC Card Print</h1>

<p>SARVATRA Tools</p>

</header>

<div class="container">

<div class="box">

<h2>📤 Front Side Upload</h2>

<input type="file" id="frontInput" accept="image/*">

<br><br>

<h2>📤 Back Side Upload</h2>

<input type="file" id="backInput" accept="image/*">

</div>

<div class="box">

<h2>💳 Front Preview</h2>

<div class="card-preview">

<img id="frontImage">

</div>

<h2>💳 Back Preview</h2>

<div class="card-preview">

<img id="backImage">

</div>

</div>

</div>

<script>

const frontInput = document.getElementById("frontInput");
const backInput = document.getElementById("backInput");

const frontImage = document.getElementById("frontImage");
const backImage = document.getElementById("backImage");

    let frontCropper = null;
    let backCropper = null;

frontInput.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function (e) {

        frontImage.src = e.target.result;
        frontImage.style.display = "block";

        frontImage.onload = function(){

    if(frontCropper){
        frontCropper.destroy();
    }

    frontCropper = new Cropper(frontImage,{
        aspectRatio:86/54,
        viewMode:2,
        dragMode:"move",
        autoCropArea:1,
        background:false,
        movable:true,
        zoomable:true,
        rotatable:true
    });

};

    };

    reader.readAsDataURL(file);

});

backInput.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function (e) {

        backImage.src = e.target.result;
        backImage.style.display = "block";

        backImage.onload = function(){

    if(backCropper){
        backCropper.destroy();
    }

    backCropper = new Cropper(backImage,{
        aspectRatio:86/54,
        viewMode:2,
        dragMode:"move",
        autoCropArea:1,
        background:false,
        movable:true,
        zoomable:true,
        rotatable:true
    });

};

    };

    reader.readAsDataURL(file);

});

  

</script>

</body>
</html>
