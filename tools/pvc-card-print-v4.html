<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PVC Card Cutter & Cropper</title>
    <!-- Tailwind CSS for modern UI styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Cropper.js for precise image cutting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
    <!-- pdf.js to handle ID PDF uploads -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans pb-12">

    <!-- Header Section -->
    <header class="bg-blue-600 text-white shadow-md p-5 text-center mb-8">
        <h1 class="text-2xl md:text-3xl font-bold tracking-wide">🪪 PVC Card Cutter Studio</h1>
        <p class="text-sm md:text-base mt-1 text-blue-100">PAN, Aadhaar, Voter, DL Image/PDF Upload chesi Front & Back custom cut chesukondi</p>
    </header>

    <main class="max-w-5xl mx-auto px-4">
        <!-- Upload Box -->
        <div class="bg-white rounded-xl shadow p-6 border-2 border-dashed border-gray-300 hover:border-blue-500 transition text-center mb-8">
            <label for="fileInput" class="cursor-pointer block">
                <div class="text-5xl text-gray-400 mb-2">📁</div>
                <span class="text-lg font-semibold block text-gray-700">PDF, JPG, leda PNG File ni Select cheyandi</span>
                <span class="text-xs text-gray-400 block mt-1">Single page multi-side documents support chestundi</span>
            </label>
            <input type="file" id="fileInput" accept="image/*,application/pdf" class="hidden">
        </div>

        <!-- Editor Playground (Initially Hidden) -->
        <div id="editorWorkspace" class="hidden space-y-8">
            <!-- Source Preview / Crop Workspace -->
            <div class="bg-white p-6 rounded-xl shadow">
                <h2 class="text-xl font-bold text-gray-700 mb-4 border-b pb-2 flex items-center gap-2">
                    <span>✂️</span> Step 1: Document Side Target select cheyandi
                </h2>
                <div class="flex flex-wrap gap-4 mb-4">
                    <button id="setFrontBtn" class="flex-1 py-3 px-4 rounded-lg font-bold transition duration-200 bg-blue-600 text-white shadow-md cursor-pointer">
                        🔄 Front Side Setup Target
                    </button>
                    <button id="setBackBtn" class="flex-1 py-3 px-4 rounded-lg font-bold transition duration-200 bg-gray-200 text-gray-700 hover:bg-gray-300 cursor-pointer">
                        🔄 Back Side Setup Target
                    </button>
                </div>
                <!-- Cropper Wrapper -->
                <div class="w-full flex justify-center bg-gray-900 rounded-lg overflow-hidden max-h-[500px]">
                    <img id="imageSource" class="max-w-full hidden">
                </div>
                <div class="mt-4 text-center">
                    <button id="generateCropBtn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 px-6 rounded-lg transition shadow-md cursor-pointer">
                        ✅ Target Size ni Confirm Cheyyi
                    </button>
                </div>
            </div>

            <!-- Previews & Individual Download Layout -->
            <div class="grid md:grid-cols-2 gap-8">
                <!-- Front Side Card Box -->
                <div class="bg-white p-6 rounded-xl shadow flex flex-col justify-between items-center text-center">
                    <div>
                        <h3 class="font-bold text-lg text-blue-600 mb-3">🪪 Front Card Output</h3>
                        <div class="bg-gray-50 border border-gray-200 rounded-lg w-[340px] h-[214px] flex items-center justify-center overflow-hidden shadow-inner mx-auto mb-4">
                            <img id="frontPreview" class="w-full h-full object-cover hidden">
                            <span id="frontPlaceholder" class="text-gray-400 text-sm p-4">Front view inka setup kaledu</span>
                        </div>
                    </div>
                    <button id="downloadFrontBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer" disabled>
                        📥 Download Front Card
                    </button>
                </div>

                <!-- Back Side Card Box -->
                <div class="bg-white p-6 rounded-xl shadow flex flex-col justify-between items-center text-center">
                    <div>
                        <h3 class="font-bold text-lg text-blue-600 mb-3">🪪 Back Card Output</h3>
                        <div class="bg-gray-50 border border-gray-200 rounded-lg w-[340px] h-[214px] flex items-center justify-center overflow-hidden shadow-inner mx-auto mb-4">
                            <img id="backPreview" class="w-full h-full object-cover hidden">
                            <span id="backPlaceholder" class="text-gray-400 text-sm p-4">Back view inka setup kaledu</span>
                        </div>
                    </div>
                    <button id="downloadBackBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer" disabled>
                        📥 Download Back Card
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // PDFJS global setup
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        const fileInput = document.getElementById('fileInput');
        const workspace = document.getElementById('editorWorkspace');
        const imgSource = document.getElementById('imageSource');
        
        const setFrontBtn = document.getElementById('setFrontBtn');
        const setBackBtn = document.getElementById('setBackBtn');
        const generateCropBtn = document.getElementById('generateCropBtn');

        const frontPreview = document.getElementById('frontPreview');
        const frontPlaceholder = document.getElementById('frontPlaceholder');
        const downloadFrontBtn = document.getElementById('downloadFrontBtn');

        const backPreview = document.getElementById('backPreview');
        const backPlaceholder = document.getElementById('backPlaceholder');
        const downloadBackBtn = document.getElementById('downloadBackBtn');

        let cropper = null;
        let activeSide = 'front'; // Tracking active edit state

        // Track output dataUrls
        let frontDataUrl = null;
        let backDataUrl = null;

        // Initialize or rebuild cropper instance with fixed PVC aspect ratio (85.60 / 53.98 ≈ 1.585)
        function initCropper() {
            if (cropper) {
                cropper.destroy();
            }
            cropper = new Cropper(imgSource, {
                aspectRatio: 85.60 / 53.98,
                viewMode: 1,
                autoCropArea: 0.8,
                responsive: true
            });
        }

        // Toggle state controls
        setFrontBtn.addEventListener('click', () => {
            activeSide = 'front';
            setFrontBtn.className = "flex-1 py-3 px-4 rounded-lg font-bold transition duration-200 bg-blue-600 text-white shadow-md cursor-pointer";
            setBackBtn.className = "flex-1 py-3 px-4 rounded-lg font-bold transition duration-200 bg-gray-200 text-gray-700 hover:bg-gray-300 cursor-pointer";
        });

        setBackBtn.addEventListener('click', () => {
            activeSide = 'back';
            setBackBtn.className = "flex-1 py-3 px-4 rounded-lg font-bold transition duration-200 bg-blue-600 text-white shadow-md cursor-pointer";
            setFrontBtn.className = "flex-1 py-3 px-4 rounded-lg font-bold transition duration-200 bg-gray-200 text-gray-700 hover:bg-gray-300 cursor-pointer";
        });

        // Trigger adjustments when files are picked
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            workspace.classList.add('hidden');

            if (file.type === 'application/pdf') {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const typedarray = new Uint8Array(ev.target.result);
                    pdfjsLib.getDocument(typedarray).promise.then(pdf => {
                        // Extract first page of the document
                        pdf.getPage(1).then(page => {
                            const scale = 2.0; // Higher render quality scale
                            const viewport = page.getViewport({ scale: scale });
                            const canvas = document.createElement('canvas');
                            const context = canvas.getContext('2d');
                            canvas.height = viewport.height;
                            canvas.width = viewport.width;

                            const renderContext = {
                                canvasContext: context,
                                viewport: viewport
                            };
                            page.render(renderContext).promise.then(() => {
                                imgSource.src = canvas.toDataURL();
                                imgSource.classList.remove('hidden');
                                workspace.classList.remove('hidden');
                                setTimeout(initCropper, 100);
                            });
                        });
                    });
                };
                reader.readAsArrayBuffer(file);
            } else {
                // Handle native image items
                const reader = new FileReader();
                reader.onload = function(ev) {
                    imgSource.src = ev.target.result;
                    imgSource.classList.remove('hidden');
                    workspace.classList.remove('hidden');
                    setTimeout(initCropper, 100);
                };
                reader.readAsDataURL(file);
            }
        });

        // Execute dynamic cropping and map to standard dimensions
        generateCropBtn.addEventListener('click', () => {
            if (!cropper) return;
            
            // Generate canvas with clear high resolution matching layout targets
            const canvas = cropper.getCroppedCanvas({
                width: 1011,  // High resolution target for crisp PVC prints
                height: 638,
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high'
            });

            const targetDataUrl = canvas.toDataURL('image/jpeg', 0.95);

            if (activeSide === 'front') {
                frontDataUrl = targetDataUrl;
                frontPreview.src = targetDataUrl;
                frontPreview.classList.remove('hidden');
                frontPlaceholder.classList.add('hidden');
                downloadFrontBtn.disabled = false;
            } else {
                backDataUrl = targetDataUrl;
                backPreview.src = targetDataUrl;
                backPreview.classList.remove('hidden');
                backPlaceholder.classList.add('hidden');
                downloadBackBtn.disabled = false;
            }
        });

        // Separate handling triggers for downloads
        downloadFrontBtn.addEventListener('click', () => {
            if (!frontDataUrl) return;
            const a = document.createElement('a');
            a.href = frontDataUrl;
            a.download = 'pvc_front_card.jpg';
            a.click();
        });

        downloadBackBtn.addEventListener('click', () => {
            if (!backDataUrl) return;
            const a = document.createElement('a');
            a.href = backDataUrl;
            a.download = 'pvc_back_card.jpg';
            a.click();
        });
    </script>
</body>
</html>
