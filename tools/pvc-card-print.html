<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PVC Card Print | SARVATRA</title>

<link rel="icon" href="../icon-192.png">

 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

 <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
}

header{
background:#0d6efd;
color:#fff;
text-align:center;
padding:20px;
position:relative;
}

header h1{
font-size:28px;
margin-bottom:5px;
}

.container{
max-width:900px;
margin:20px auto;
padding:15px;
}

.home-btn{
position:absolute;
left:15px;
top:15px;
background:#fff;
color:#0d6efd;
border:none;
padding:8px 14px;
border-radius:8px;
font-size:15px;
font-weight:bold;
cursor:pointer;
box-shadow:0 2px 8px rgba(0,0,0,.2);
}

.home-btn:hover{
background:#f1f1f1;
}

.box{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
margin-bottom:20px;
}
 .card-preview{

width:340px;
height:215px;

margin:20px auto;

border:2px solid #ddd;
border-radius:12px;

overflow:hidden;

background:#fafafa;

display:flex;
justify-content:center;
align-items:center;

}


.card-preview img{

width:100%;
height:100%;

object-fit:cover;

display:block;

}


</style>
    
</head>

<body>

    <script>

function goHome(){

window.location.href="../index.html";

}

</script>

<header>

<button class="home-btn" onclick="goHome()">
🏠 Home
</button>

<h1>💳 PVC Card Print</h1>

<p>SARVATRA Tools</p>

</header>

<div class="container">

    <div class="box">


<h2 style="margin-bottom:15px;">
📤 Front Side Upload
</h2>

<input
type="file"
id="frontInput"
accept="image/*">


<br><br>


<h2 style="margin-bottom:15px;">
📤 Back Side Upload
</h2>

<input
type="file"
id="backInput"
accept="image/*">

    </div>
    <div class="box">

<h2 style="margin-bottom:15px;">
💳 PVC Card Preview
</h2>

<div class="card-preview">


<img id="frontImage" alt="Front Preview">

</div>


<br><br>


<div class="card-preview">


<img id="backImage" alt="Back Preview">

</div>

     <h3 style="margin-top:20px;">🛠️ Adjust Image</h3>

<br>

<label for="zoomRange">🔍 Zoom</label>

<input
type="range"
id="zoomRange"
min="0"
max="1"
step="0.01"
value="0"
style="width:100%;">

<br><br>

<label for="rotateRange">🔄 Rotate</label>

<input
type="range"
id="rotateRange"
min="-180"
max="180"
step="1"
value="0"
style="width:100%;">

    <br><br>

<button 
id="resetBtn"
style="
width:100%;
padding:14px;
background:#dc3545;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
">
🔄 Reset
</button>

<hr style="margin:25px 0;">

<h3 style="margin-top:20px;">🛠️ Back Image Adjust</h3>

<br>

<label for="backZoomRange">🔍 Back Zoom</label>

<input
type="range"
id="backZoomRange"
min="0"
max="1"
step="0.01"
value="0"
style="width:100%;">

<br><br>

<label for="backRotateRange">🔄 Back Rotate</label>

<input
type="range"
id="backRotateRange"
min="-180"
max="180"
step="1"
value="0"
style="width:100%;">

<br><br>

<button
id="backResetBtn"
style="
width:100%;
padding:14px;
background:#dc3545;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
">
🔄 Reset Back
</button>
     

     <br><br>

<button 
id="printBtn"
style="
width:100%;
padding:14px;
background:#0d6efd;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
">
🖨️ Print Card
</button>

    <br><br>

<button 
id="pdfBtn"
style="
width:100%;
padding:14px;
background:#198754;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
">
📄 Download PDF
</button> 

     <br><br>

<button 
id="jpgBtn"
style="
width:100%;
padding:14px;
background:#ff9800;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
">
🖼️ Download JPG
</button>
     
    </div>

</div>
    
<script>
const frontInput = document.getElementById("frontInput");
const backInput = document.getElementById("backInput");

const frontImage = document.getElementById("frontImage");
const backImage = document.getElementById("backImage");

let frontCropper = null;
let backCropper = null;



 frontInput.addEventListener("change", function(){

    const file = this.files[0];

    if(!file){
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e){

        frontImage.src = e.target.result;

        if(frontCropper){

            frontCropper.destroy();

        }


        frontCropper = new Cropper(frontImage,{

            aspectRatio:86/54,
            viewMode:2,
            dragMode:"move",
            autoCropArea:1,
            background:false,
            movable:true,
            zoomable:true,
            rotatable:true

        });

    };


    reader.readAsDataURL(file);

});


 backInput.addEventListener("change", function(){

    const file = this.files[0];

    if(!file){
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e){

        backImage.src = e.target.result;

        if(backCropper){

            backCropper.destroy();

        }


        backCropper = new Cropper(backImage,{

            aspectRatio:86/54,
            viewMode:2,
            dragMode:"move",
            autoCropArea:1,
            background:false,
            movable:true,
            zoomable:true,
            rotatable:true

        });

    };


    reader.readAsDataURL(file);

});
 


 const zoomRange = document.getElementById("zoomRange");
const rotateRange = document.getElementById("rotateRange");


zoomRange.addEventListener("input", function(){

   if(frontCropper){

    frontCropper.zoomTo(
        1 + Number(this.value)
    );

   }

});


rotateRange.addEventListener("input", function(){

    if(frontCropper){

    frontCropper.rotateTo(
        Number(this.value)
    );

}

});



const resetBtn = document.getElementById("resetBtn");


resetBtn.addEventListener("click", function(){

    if(frontCropper){

        frontCropper.reset();

        zoomRange.value = 0;
        rotateRange.value = 0;

    }

});


 const backZoomRange = document.getElementById("backZoomRange");
const backRotateRange = document.getElementById("backRotateRange");
const backResetBtn = document.getElementById("backResetBtn");

backZoomRange.addEventListener("input", function(){

    if(backCropper){

        backCropper.zoomTo(
            1 + Number(this.value)
        );

    }

});

backRotateRange.addEventListener("input", function(){

    if(backCropper){

        backCropper.rotateTo(
            Number(this.value)
        );

    }

});

backResetBtn.addEventListener("click", function(){

    if(backCropper){

        backCropper.reset();

        backZoomRange.value = 0;
        backRotateRange.value = 0;

    }

});
 
 
 
 const printBtn = document.getElementById("printBtn");
 const pdfBtn = document.getElementById("pdfBtn");
 const jpgBtn = document.getElementById("jpgBtn");


printBtn.addEventListener("click", function(){

    if(!frontCropper || !backCropper){
    alert("Please upload both Front and Back images");
    return;
    }


    const frontCanvas = frontCropper.getCroppedCanvas({
    width:1800,
    height:1131,
    imageSmoothingEnabled:true,
    imageSmoothingQuality:"high"
});

const backCanvas = backCropper.getCroppedCanvas({
    width:1800,
    height:1131,
    imageSmoothingEnabled:true,
    imageSmoothingQuality:"high"
});


const frontImageData = frontCanvas.toDataURL("image/png");
const backImageData = backCanvas.toDataURL("image/png");


    const printWindow = window.open(
        "",
        "",
        "width=600,height=500"
    );


    printWindow.document.write(`

<html>

<head>

<title>PVC Card Print</title>

<style>

body{

display:flex;
justify-content:center;
align-items:center;
height:100vh;

}


.card{

width:86mm;
height:54mm;

overflow:hidden;

}


.card img{

width:100%;
height:100%;

object-fit:cover;

}

</style>

</head>


<body>


<div class="card">
    <img src="${frontImageData}">
</div>

<br><br>

<div class="card">
    <img src="${backImageData}">
</div>


</body>

</html>

`);


printWindow.document.close();

printWindow.onload = function(){

    printWindow.focus();

    printWindow.print();

};


});

 pdfBtn.addEventListener("click", function(){

    if(!frontCropper || !backCropper){

    alert("Please upload both Front and Back images");
    return;

    }

    const { jsPDF } = window.jspdf;

    const pdf = new jsPDF({

        orientation:"landscape",
        unit:"mm",
        format:"a4"

    });

    const frontCanvas = frontCropper.getCroppedCanvas({
    width:1800,
    height:1131
});

const backCanvas = backCropper.getCroppedCanvas({
    width:1800,
    height:1131
});

const frontImageData = frontCanvas.toDataURL("image/jpeg",1.0);
const backImageData = backCanvas.toDataURL("image/jpeg",1.0);

    pdf.addImage(
    frontImageData,
    "JPEG",
    10,
    10,
    86,
    54
);

pdf.addImage(
    backImageData,
    "JPEG",
    10,
    70,
    86,
    54
);

    pdf.save("SARVATRA-PVC-Card.pdf");

});

    alert("Please upload both Front and Back images");

</script>
 
</body>

</html>
