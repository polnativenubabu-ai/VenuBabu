<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PVC Card Print | SARVATRA</title>

<link rel="icon" href="../icon-192.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
}

header{

background:#0d6efd;
color:#fff;
text-align:center;
padding:20px;
position:relative;

}

header h1{

font-size:28px;
margin-bottom:5px;

}


.container{

max-width:900px;
margin:20px auto;
padding:15px;

}


.home-btn{

position:absolute;
left:15px;
top:15px;

background:#fff;
color:#0d6efd;

border:none;
padding:8px 14px;

border-radius:8px;

font-size:15px;
font-weight:bold;

cursor:pointer;

box-shadow:0 2px 8px rgba(0,0,0,.2);

}


.home-btn:hover{

background:#f1f1f1;

}



.box{

background:#fff;

border-radius:10px;

padding:20px;

box-shadow:0 2px 8px rgba(0,0,0,.08);

margin-bottom:20px;

}



input[type="file"]{

width:100%;

padding:12px;

background:#fff;

border:2px dashed #0d6efd;

border-radius:10px;

cursor:pointer;

}



.card-area{

display:flex;

justify-content:center;

align-items:center;

margin:25px 0;

}



.pvc-card{

width:340px;

height:215px;

background:#fff;

border:1px solid #ccc;

border-radius:12px;

overflow:hidden;

position:relative;

box-shadow:0 3px 10px rgba(0,0,0,.15);

}



#cardImage{

width:100%;

height:100%;

object-fit:cover;

}



.btn{

width:100%;

padding:14px;

border:none;

border-radius:10px;

font-size:17px;

cursor:pointer;

margin-top:10px;

}



.print-btn{

background:#0d6efd;

color:#fff;

}



.reset-btn{

background:#dc3545;

color:#fff;

}



.info{

background:#e8f5e9;

border-left:5px solid #198754;

padding:15px;

border-radius:8px;

font-size:15px;

margin-top:15px;

}



@media(max-width:600px){

.pvc-card{

width:300px;

height:190px;

}

}



</style>

</head>


<body>


<script>

function goHome(){

window.location.href="../index.html";

}

</script>



<header>


<button class="home-btn" onclick="goHome()">

🏠 Home

</button>


<h1>💳 PVC Card Print</h1>

<p>SARVATRA Tools</p>


</header>



<div class="container">



<div class="box">


<input type="file" id="imageInput" accept="image/*">


</div>

<div class="box">

<h3>🛠️ Adjust Image</h3>

<br>

<label>Zoom</label>

<input type="range" id="zoomRange" min="1" max="2" step="0.1" value="1">


<br><br>


<label>Rotate</label>

<input type="range" id="rotateRange" min="-180" max="180" value="0">


</div>

<div class="box">



<h3 style="text-align:center;margin-bottom:15px;">
PVC Card Preview
</h3>



<div class="card-area">


<div class="pvc-card">


<img id="cardImage"
src=""
alt="PVC Card Preview">


</div>


</div>



<button class="btn print-btn">

🖨️ Print Card

</button>


<button class="btn reset-btn">

🔄 Reset

</button>



<div class="info">

<b>✅ SARVATRA PVC Card Print</b>

<br><br>

Upload your own card image and prepare it for PVC card size printing.

</div>


</div>


</div>

<script>

const imageInput = document.getElementById("imageInput");
const cardImage = document.getElementById("cardImage");

const printBtn = document.querySelector(".print-btn");
const resetBtn = document.querySelector(".reset-btn");


// Image Upload

imageInput.addEventListener("change", function(){

    const file = this.files[0];

    if(!file){
        return;
    }


    const reader = new FileReader();


    reader.onload = function(e){

        cardImage.src = e.target.result;

    };


    reader.readAsDataURL(file);


});




// Reset

resetBtn.addEventListener("click", function(){

    cardImage.src = "";

    imageInput.value = "";

});




// Print

printBtn.addEventListener("click", function(){


    const card = document.querySelector(".pvc-card").outerHTML;


    const printWindow = window.open(
        "",
        "",
        "width=500,height=400"
    );


    printWindow.document.write(`

    <html>

    <head>

    <title>PVC Card Print</title>


    <style>

    body{

    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;

    }


    .pvc-card{

    width:86mm;
    height:54mm;

    border:1px solid #ccc;
    border-radius:5mm;

    overflow:hidden;

    }


    img{

    width:100%;
    height:100%;

    object-fit:cover;

    }



    </style>


    </head>


    <body>


    ${card}


    </body>

    </html>

    `);


    printWindow.document.close();


    printWindow.focus();


    setTimeout(function(){

        printWindow.print();

        printWindow.close();

    },500);



});


      </script>

  
</body>

</html>
