<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PVC Card Print | SARVATRA</title>

<link rel="icon" href="../icon-192.png">

 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

 <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
}

header{
background:#0d6efd;
color:#fff;
text-align:center;
padding:20px;
position:relative;
}

header h1{
font-size:28px;
margin-bottom:5px;
}

.container{
max-width:900px;
margin:20px auto;
padding:15px;
}

.home-btn{
position:absolute;
left:15px;
top:15px;
background:#fff;
color:#0d6efd;
border:none;
padding:8px 14px;
border-radius:8px;
font-size:15px;
font-weight:bold;
cursor:pointer;
box-shadow:0 2px 8px rgba(0,0,0,.2);
}

.home-btn:hover{
background:#f1f1f1;
}

.box{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
margin-bottom:20px;
}
 .card-preview{

width:340px;
height:215px;

margin:20px auto;

border:2px solid #ddd;
border-radius:12px;

overflow:hidden;

background:#fafafa;

display:flex;
justify-content:center;
align-items:center;

}


.card-preview img{

width:100%;
height:100%;

object-fit:cover;


}   

</style>
    
</head>

<body>

    <script>

function goHome(){

window.location.href="../index.html";

}

</script>

<header>

<button class="home-btn" onclick="goHome()">
🏠 Home
</button>

<h1>💳 PVC Card Print</h1>

<p>SARVATRA Tools</p>

</header>

<div class="container">

    <div class="box">

<h2 style="margin-bottom:15px;">
📤 Upload Image
</h2>

<input
type="file"
id="imageInput"
accept="image/*">

    </div>
    <div class="box">

<h2 style="margin-bottom:15px;">
💳 PVC Card Preview
</h2>

<div class="card-preview">

<img id="cardImage" alt="Preview">

</div>

     <h3 style="margin-top:20px;">🛠️ Adjust Image</h3>

<br>

<label for="zoomRange">🔍 Zoom</label>

<input
type="range"
id="zoomRange"
min="0"
max="1"
step="0.01"
value="0"
style="width:100%;">

<br><br>

<label for="rotateRange">🔄 Rotate</label>

<input
type="range"
id="rotateRange"
min="-180"
max="180"
step="1"
value="0"
style="width:100%;">

    <br><br>

<button 
id="resetBtn"
style="
width:100%;
padding:14px;
background:#dc3545;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
">
🔄 Reset
</button>

     <br><br>

<button 
id="printBtn"
style="
width:100%;
padding:14px;
background:#0d6efd;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
">
🖨️ Print Card
</button>

    <br><br>

<button 
id="pdfBtn"
style="
width:100%;
padding:14px;
background:#198754;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
">
📄 Download PDF
</button> 

     
    </div>

</div>
    
<script>

const imageInput = document.getElementById("imageInput");
const cardImage = document.getElementById("cardImage");
let cropper = null;

imageInput.addEventListener("change", function(){

    const file = this.files[0];

    if(!file){
        return;
    }


    const reader = new FileReader();


    reader.onload = function(e){

    cardImage.src = e.target.result;
     

    if(cropper){

        cropper.destroy();

    }

    cropper = new Cropper(cardImage,{

    aspectRatio: 86 / 54,
    viewMode: 2,
    autoCropArea: 1,
    dragMode:"move",
    responsive:true,
    background:false,
    movable:true,
    zoomable:true,
    rotatable:true,
    scalable:true

});

};


    reader.readAsDataURL(file);


});

 const zoomRange = document.getElementById("zoomRange");
const rotateRange = document.getElementById("rotateRange");


zoomRange.addEventListener("input", function(){

    if(cropper){

        cropper.zoomTo(
            1 + Number(this.value)
        );

    }

});


rotateRange.addEventListener("input", function(){

    if(cropper){

        cropper.rotateTo(
            Number(this.value)
        );

    }

});
 const resetBtn = document.getElementById("resetBtn");


resetBtn.addEventListener("click", function(){

    if(cropper){

        cropper.reset();

    }

});
 
 
 
 const printBtn = document.getElementById("printBtn");
 const pdfBtn = document.getElementById("pdfBtn");


printBtn.addEventListener("click", function(){

    if(!cropper){

        alert("Please upload image first");

        return;

    }


    const canvas = cropper.getCroppedCanvas({

    width:1800,
    height:1131,
    imageSmoothingEnabled:true,
    imageSmoothingQuality:"high"

});


const imageData = canvas.toDataURL("image/png");


    const printWindow = window.open(
        "",
        "",
        "width=600,height=500"
    );


    printWindow.document.write(`

<html>

<head>

<title>PVC Card Print</title>

<style>

body{

display:flex;
justify-content:center;
align-items:center;
height:100vh;

}


.card{

width:86mm;
height:54mm;

overflow:hidden;

}


.card img{

width:100%;
height:100%;

object-fit:cover;

}

</style>

</head>


<body>


<div class="card">

<img src="${imageData}">

</div>


</body>

</html>

`);


printWindow.document.close();

printWindow.onload = function(){

    printWindow.focus();

    printWindow.print();

};


});

 
</script>
 
</body>

</html>
