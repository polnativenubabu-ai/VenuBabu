<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PVC Card Print | SARVATRA</title>

<link rel="icon" href="../icon-192.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
}

header{
background:#0d6efd;
color:#fff;
text-align:center;
padding:20px;
position:relative;
}

header h1{
font-size:28px;
margin-bottom:5px;
}

.container{
max-width:900px;
margin:20px auto;
padding:15px;
}

.home-btn{
position:absolute;
left:15px;
top:15px;
background:#fff;
color:#0d6efd;
border:none;
padding:8px 14px;
border-radius:8px;
font-size:15px;
font-weight:bold;
cursor:pointer;
box-shadow:0 2px 8px rgba(0,0,0,.2);
}

.home-btn:hover{
background:#f1f1f1;
}

.box{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
margin-bottom:20px;
}
 .card-preview{

width:340px;
height:215px;

margin:20px auto;

border:2px solid #ddd;
border-radius:12px;

overflow:hidden;

background:#fafafa;

display:flex;
justify-content:center;
align-items:center;

}


.card-preview img{

width:100%;
height:100%;

object-fit:cover;

display:none;

}   

</style>
    
</head>

<body>

    <script>

function goHome(){

window.location.href="../index.html";

}

</script>

<header>

<button class="home-btn" onclick="goHome()">
🏠 Home
</button>

<h1>💳 PVC Card Print</h1>

<p>SARVATRA Tools</p>

</header>

<div class="container">

    <div class="box">

<h2 style="margin-bottom:15px;">
📤 Upload Image
</h2>

<input
type="file"
id="imageInput"
accept="image/*">

    </div>
    <div class="box">

<h2 style="margin-bottom:15px;">
💳 PVC Card Preview
</h2>

<div class="card-preview">

<img id="cardImage" alt="Preview">

</div>

    </div>

</div>
    
<script>

const imageInput = document.getElementById("imageInput");
const cardImage = document.getElementById("cardImage");


imageInput.addEventListener("change", function(){

    const file = this.files[0];

    if(!file){
        return;
    }


    const reader = new FileReader();


    reader.onload = function(e){

        cardImage.src = e.target.result;

        cardImage.style.display = "block";

    };


    reader.readAsDataURL(file);


});

</script>
 
</body>

</html>
