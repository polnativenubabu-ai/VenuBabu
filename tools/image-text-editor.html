<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SARVATRA - Image Text Editor</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f7fb;
    color:#172033;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#0d6efd,#00a86b);
    color:white;
    text-align:center;
    padding:16px 12px;
    box-shadow:0 3px 12px rgba(0,0,0,.18);
}

.header h1{
    font-size:22px;
}

.header p{
    font-size:13px;
    margin-top:5px;
}

.home{
    display:inline-block;
    margin-top:12px;
    padding:9px 18px;
    background:white;
    color:#0d6efd;
    border-radius:25px;
    text-decoration:none;
    font-weight:bold;
}

/* MAIN */

.container{
    max-width:1100px;
    margin:auto;
    padding:12px;
}

/* UPLOAD */

.upload{
    background:white;
    border-radius:16px;
    padding:28px 15px;
    text-align:center;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.upload h2{
    color:#0d6efd;
    margin-bottom:8px;
}

.upload p{
    color:#666;
    font-size:14px;
    margin-bottom:18px;
}

.file-label{
    display:inline-block;
    background:#0d6efd;
    color:white;
    padding:12px 24px;
    border-radius:25px;
    font-weight:bold;
    cursor:pointer;
}

#fileInput{
    display:none;
}

/* EDITOR */

.editor{
    display:none;
    background:white;
    border-radius:16px;
    padding:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

/* TOOLBAR */

.toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:10px;
}

.btn{
    border:0;
    padding:10px 13px;
    border-radius:9px;
    background:#eaf0f6;
    color:#182538;
    font-weight:bold;
    cursor:pointer;
}

.btn:active{
    transform:scale(.97);
}

.blue{
    background:#0d6efd;
    color:white;
}

.green{
    background:#00a86b;
    color:white;
}

.red{
    background:#dc3545;
    color:white;
}

/* TEXT AREA */

.text-area{
    display:flex;
    gap:7px;
    margin-bottom:10px;
}

#textInput{
    flex:1;
    border:1px solid #ccd5df;
    border-radius:9px;
    padding:11px;
    font-size:15px;
}

/* CANVAS */

.canvas-box{
    background:#20252b;
    border-radius:12px;
    padding:12px;
    min-height:300px;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:auto;
}

#canvas{
    display:block;
    max-width:100%;
    height:auto;
    background:white;
    box-shadow:0 2px 15px rgba(0,0,0,.4);
    touch-action:none;
}

/* CONTROLS */

.controls{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px;
    margin-top:12px;
}

.control{
    background:#f6f8fb;
    border-radius:10px;
    padding:10px;
}

.control label{
    display:block;
    font-size:12px;
    font-weight:bold;
    margin-bottom:6px;
}

.control input,
.control select{
    width:100%;
    border:1px solid #ccd5df;
    border-radius:7px;
    padding:8px;
    background:white;
}

/* STATUS */

.status{
    text-align:center;
    margin-top:10px;
    font-size:13px;
    color:#666;
}

/* FOOTER */

.footer{
    text-align:center;
    padding:25px 10px;
    color:#777;
    font-size:12px;
}

/* MOBILE */

@media(max-width:600px){

    .header h1{
        font-size:19px;
    }

    .toolbar{
        display:grid;
        grid-template-columns:repeat(2,1fr);
    }

    .btn{
        width:100%;
    }

    .text-area{
        flex-direction:column;
    }

}

</style>
</head>


<body>


<!-- HEADER -->

<header class="header">

    <h1>🖼️ SARVATRA Image Text Editor</h1>

    <p>
        Add • Edit • Move • Style • Download
    </p>

    <a href="../index.html" class="home">
        🏠 SARVATRA Home
    </a>

</header>



<div class="container">


<!-- UPLOAD -->

<div class="upload" id="uploadBox">

    <h2>Image Text Editor</h2>

    <p>
        Upload your image to start editing.
    </p>

    <label
        for="fileInput"
        class="file-label"
    >
        📁 Select Image
    </label>

    <input
        id="fileInput"
        type="file"
        accept="image/*"
    >

</div>



<!-- EDITOR -->

<div
    class="editor"
    id="editor"
>


<!-- TOOLBAR -->

<div class="toolbar">

    <button
        class="btn blue"
        id="addTextBtn"
    >
        ➕ Add Text
    </button>


    <button
        class="btn"
        id="moveBtn"
    >
        ✋ Move
    </button>


    <button
        class="btn"
        id="deleteBtn"
    >
        🗑️ Delete Text
    </button>


    <button
        class="btn"
        id="undoBtn"
    >
        ↩️ Undo
    </button>


    <button
        class="btn"
        id="redoBtn"
    >
        ↪️ Redo
    </button>


    <button
        class="btn"
        id="resetBtn"
    >
        🔄 Reset
    </button>


    <button
        class="btn green"
        id="pngBtn"
    >
        🖼️ PNG
    </button>


    <button
        class="btn green"
        id="jpgBtn"
    >
        📷 JPG
    </button>

</div>



<!-- TEXT -->

<div class="text-area">

    <input
        id="textInput"
        type="text"
        placeholder="Type your text here..."
    >

    <button
        class="btn blue"
        id="applyBtn"
    >
        Apply
    </button>

</div>



<!-- CANVAS -->

<div class="canvas-box">

    <canvas id="canvas"></canvas>

</div>



<!-- CONTROLS -->

<div class="controls">


    <div class="control">

        <label>
            Font
        </label>

        <select id="fontFamily">

            <option>Arial</option>

            <option>Verdana</option>

            <option>Tahoma</option>

            <option>Georgia</option>

            <option>Times New Roman</option>

            <option>Courier New</option>

        </select>

    </div>



    <div class="control">

        <label>
            Font Size
        </label>

        <input
            id="fontSize"
            type="number"
            value="32"
            min="8"
            max="200"
        >

    </div>



    <div class="control">

        <label>
            Text Color
        </label>

        <input
            id="textColor"
            type="color"
            value="#000000"
        >

    </div>



    <div class="control">

        <label>
            Text Style
        </label>

        <select id="fontStyle">

            <option value="normal">
                Normal
            </option>

            <option value="bold">
                Bold
            </option>

            <option value="italic">
                Italic
            </option>

            <option value="bold italic">
                Bold Italic
            </option>

        </select>

    </div>



    <div class="control">

        <label>
            Text X Position
        </label>

        <input
            id="posX"
            type="number"
            value="50"
        >

    </div>



    <div class="control">

        <label>
            Text Y Position
        </label>

        <input
            id="posY"
            type="number"
            value="50"
        >

    </div>


</div>


<div
    class="status"
    id="status"
>
    Select "Add Text" to begin.
</div>


</div>

</div>



<div class="footer">

    SARVATRA © 2026<br>

    All Government Services

</div>



<script>


/* =========================
   VARIABLES
========================= */

const fileInput =
    document.getElementById("fileInput");

const uploadBox =
    document.getElementById("uploadBox");

const editor =
    document.getElementById("editor");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const textInput =
    document.getElementById("textInput");

const fontFamily =
    document.getElementById("fontFamily");

const fontSize =
    document.getElementById("fontSize");

const textColor =
    document.getElementById("textColor");

const fontStyle =
    document.getElementById("fontStyle");

const posX =
    document.getElementById("posX");

const posY =
    document.getElementById("posY");

const statusBox =
    document.getElementById("status");


let originalImage =
    new Image();

let currentImageSrc =
    "";

let textObjects =
    [];

let selectedText =
    null;

let dragging =
    false;

let dragOffsetX =
    0;

let dragOffsetY =
    0;

let history =
    [];

let redoHistory =
    [];


/* =========================
   UPLOAD IMAGE
========================= */

fileInput.addEventListener(
    "change",
    function(){

        const file =
            fileInput.files[0];

        if(!file){

            return;

        }


        if(!file.type.startsWith("image/")){

            alert(
                "Please select an image file."
            );

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function(e){

                currentImageSrc =
                    e.target.result;


                originalImage =
                    new Image();


                originalImage.onload =
                    function(){

                        canvas.width =
                            originalImage.naturalWidth;

                        canvas.height =
                            originalImage.naturalHeight;


                        textObjects =
                            [];

                        selectedText =
                            null;


                        draw();


                        history =
                            [];

                        redoHistory =
                            [];

                        saveState();


                        uploadBox.style.display =
                            "none";

                        editor.style.display =
                            "block";


                        statusBox.textContent =
                            "Image loaded successfully.";

                    };


                originalImage.src =
                    currentImageSrc;

            };


        reader.readAsDataURL(file);

    }
);


/* =========================
   DRAW IMAGE
========================= */

function draw(){

    if(!originalImage.src){

        return;

    }


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.drawImage(
        originalImage,
        0,
        0,
        canvas.width,
        canvas.height
    );


    textObjects.forEach(
        function(obj){

            drawText(
                obj
            );

        }
    );

}


/* =========================
   DRAW TEXT
========================= */

function drawText(obj){

    ctx.save();


    ctx.font =
        obj.style +
        " " +
        obj.size +
        "px " +
        obj.font;


    ctx.fillStyle =
        obj.color;


    ctx.textBaseline =
        "top";


    ctx.fillText(
        obj.text,
        obj.x,
        obj.y
    );


    if(
        obj === selectedText
    ){

        const width =
            ctx.measureText(
                obj.text
            ).width;


        ctx.strokeStyle =
            "#0d6efd";

        ctx.lineWidth =
            2;

        ctx.setLineDash(
            [6,4]
        );


        ctx.strokeRect(
            obj.x - 4,
            obj.y - 4,
            width + 8,
            obj.size + 8
        );

        ctx.setLineDash([]);

    }


    ctx.restore();

}


/* =========================
   ADD TEXT
========================= */

document
.getElementById("addTextBtn")
.addEventListener(
    "click",
    function(){

        const text =
            textInput.value.trim();


        if(!text){

            alert(
                "Please type some text first."
            );

            textInput.focus();

            return;

        }


        const obj = {

            id:
                Date.now(),

            text:
                text,

            x:
                Math.max(
                    10,
                    Math.min(
                        Number(posX.value) || 50,
                        canvas.width - 20
                    )
                ),

            y:
                Math.max(
                    10,
                    Math.min(
                        Number(posY.value) || 50,
                        canvas.height - 20
                    )
                ),

            font:
                fontFamily.value,

            size:
                Number(fontSize.value) || 32,

            color:
                textColor.value,

            style:
                fontStyle.value

        };


        textObjects.push(
            obj
        );


        selectedText =
            obj;


        updateControls();


        saveState();


        draw();


        statusBox.textContent =
            "Text added. Drag it on the image.";

    }
);


/* =========================
   APPLY EDIT
========================= */

document
.getElementById("applyBtn")
.addEventListener(
    "click",
    function(){

        if(!selectedText){

            alert(
                "First select a text object."
            );

            return;

        }


        selectedText.text =
            textInput.value ||
            selectedText.text;


        selectedText.font =
            fontFamily.value;


        selectedText.size =
            Number(fontSize.value);


        selectedText.color =
            textColor.value;


        selectedText.style =
            fontStyle.value;


        selectedText.x =
            Number(posX.value);


        selectedText.y =
            Number(posY.value);


        saveState();


        draw();


        statusBox.textContent =
            "Text updated.";

    }
);


/* =========================
   SELECT TEXT
========================= */

function getPointerPosition(e){

    const rect =
        canvas.getBoundingClientRect();


    const scaleX =
        canvas.width /
        rect.width;


    const scaleY =
        canvas.height /
        rect.height;


    return {

        x:
            (e.clientX - rect.left)
            * scaleX,

        y:
            (e.clientY - rect.top)
            * scaleY

    };

}


function findTextAt(
    x,
    y
){

    for(
        let i =
            textObjects.length - 1;

        i >= 0;

        i--
    ){

        const obj =
            textObjects[i];


        ctx.font =
            obj.style +
            " " +
            obj.size +
            "px " +
            obj.font;


        const width =
            ctx.measureText(
                obj.text
            ).width;


        const height =
            obj.size + 10;


        if(
            x >= obj.x &&
            x <= obj.x + width &&
            y >= obj.y &&
            y <= obj.y + height
        ){

            return obj;

        }

    }


    return null;

}


/* =========================
   POINTER DOWN
========================= */

canvas.addEventListener(
    "pointerdown",
    function(e){

        const p =
            getPointerPosition(e);


        const obj =
            findTextAt(
                p.x,
                p.y
            );


        if(!obj){

            return;

        }


        selectedText =
            obj;


        dragging =
            true;


        dragOffsetX =
            p.x - obj.x;


        dragOffsetY =
            p.y - obj.y;


        updateControls();


        canvas.setPointerCapture(
            e.pointerId
        );


        draw();

    }
);


/* =========================
   POINTER MOVE
========================= */

canvas.addEventListener(
    "pointermove",
    function(e){

        if(
            !dragging ||
            !selectedText
        ){

            return;

        }


        const p =
            getPointerPosition(e);


        selectedText.x =
            Math.round(
                p.x -
                dragOffsetX
            );


        selectedText.y =
            Math.round(
                p.y -
                dragOffsetY
            );


        posX.value =
            selectedText.x;


        posY.value =
            selectedText.y;


        draw();

    }
);


/* =========================
   POINTER UP
========================= */

canvas.addEventListener(
    "pointerup",
    function(){

        if(dragging){

            saveState();

        }


        dragging =
            false;

    }
);


/* =========================
   UPDATE CONTROLS
========================= */

function updateControls(){

    if(!selectedText){

        return;

    }


    textInput.value =
        selectedText.text;


    fontFamily.value =
        selectedText.font;


    fontSize.value =
        selectedText.size;


    textColor.value =
        selectedText.color;


    fontStyle.value =
        selectedText.style;


    posX.value =
        selectedText.x;


    posY.value =
        selectedText.y;

}


/* =========================
   MOVE BUTTON
========================= */

document
.getElementById("moveBtn")
.addEventListener(
    "click",
    function(){

        statusBox.textContent =
            "Tap or drag a text on the image.";

    }
);


/* =========================
   DELETE TEXT
========================= */

document
.getElementById("deleteBtn")
.addEventListener(
    "click",
    function(){

        if(!selectedText){

            alert(
                "Select a text first."
            );

            return;

        }


        const index =
            textObjects.indexOf(
                selectedText
            );


        if(index !== -1){

            textObjects.splice(
                index,
                1
            );

        }


        selectedText =
            null;


        saveState();


        draw();


        textInput.value =
            "";


        statusBox.textContent =
            "Text deleted.";

    }
);


/* =========================
   SAVE STATE
========================= */

function saveState(){

    const state =
        JSON.stringify(
            textObjects
        );


    history.push(
        state
    );


    if(
        history.length > 30
    ){

        history.shift();

    }


    redoHistory =
        [];

}


/* =========================
   UNDO
========================= */

document
.getElementById("undoBtn")
.addEventListener(
    "click",
    function(){

        if(
            history.length <= 1
        ){

            return;

        }


        const current =
            history.pop();


        redoHistory.push(
            current
        );


        const previous =
            history[
                history.length - 1
            ];


        textObjects =
            JSON.parse(
                previous
            );


        selectedText =
            null;


        draw();


        statusBox.textContent =
            "Undo completed.";

    }
);


/* =========================
   REDO
========================= */

document
.getElementById("redoBtn")
.addEventListener(
    "click",
    function(){

        if(
            redoHistory.length === 0
        ){

            return;

        }


        const state =
            redoHistory.pop();


        history.push(
            state
        );


        textObjects =
            JSON.parse(
                state
            );


        selectedText =
            null;


        draw();


        statusBox.textContent =
            "Redo completed.";

    }
);


/* =========================
   RESET
========================= */

document
.getElementById("resetBtn")
.addEventListener(
    "click",
    function(){

        if(
            !confirm(
                "Remove all added text?"
            )
        ){

            return;

        }

        textObjects = [];

        selectedText = null;

        textInput.value = "";

        fontSize.value = 32;

        fontFamily.value = "Arial";

        textColor.value = "#000000";

        fontStyle.value = "normal";

        posX.value = 50;

        posY.value = 50;

        draw();

        saveState();

        statusBox.textContent =
            "All added text removed.";

    }
);


/* =========================
   DOWNLOAD PNG
========================= */

document
.getElementById("pngBtn")
.addEventListener(
    "click",
    function(){

        downloadImage("png");

    }
);


/* =========================
   DOWNLOAD JPG
========================= */

document
.getElementById("jpgBtn")
.addEventListener(
    "click",
    function(){

        downloadImage("jpg");

    }
);


/* =========================
   DOWNLOAD IMAGE
========================= */

function downloadImage(type){

    const output =
        document.createElement("canvas");

    output.width =
        canvas.width;

    output.height =
        canvas.height;

    const outCtx =
        output.getContext("2d");


    /*
       JPGకి white background
    */

    if(type === "jpg"){

        outCtx.fillStyle =
            "#ffffff";

        outCtx.fillRect(
            0,
            0,
            output.width,
            output.height
        );

    }


    /*
       Final edited image
    */

    outCtx.drawImage(
        canvas,
        0,
        0
    );


    let mimeType;

    let quality;


    if(type === "png"){

        mimeType =
            "image/png";

        quality =
            undefined;

    }else{

        mimeType =
            "image/jpeg";

        quality =
            0.95;

    }


    const imageData =
        output.toDataURL(
            mimeType,
            quality
        );


    const link =
        document.createElement("a");


    link.href =
        imageData;


    link.download =
        "SARVATRA-Image-Text-Editor." +
        type;


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    statusBox.textContent =
        "Image downloaded successfully.";

}


/* =========================
   INITIAL STATUS
========================= */

statusBox.textContent =
    "Upload an image to start.";

</script>

</body>
</html>
