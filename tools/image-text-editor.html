<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SARVATRA - AI Image Text Editor</title>

<!-- OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f7fb;
    color:#172033;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#0d6efd,#00a86b);
    color:white;
    text-align:center;
    padding:16px 12px;
    box-shadow:0 3px 12px rgba(0,0,0,.18);
}

.header h1{
    font-size:22px;
}

.header p{
    font-size:13px;
    margin-top:5px;
}

.home{
    display:inline-block;
    margin-top:12px;
    padding:9px 18px;
    background:white;
    color:#0d6efd;
    border-radius:25px;
    text-decoration:none;
    font-weight:bold;
}

/* MAIN */

.container{
    max-width:1100px;
    margin:auto;
    padding:12px;
}

/* UPLOAD */

.upload{
    background:white;
    border-radius:16px;
    padding:30px 15px;
    text-align:center;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.upload h2{
    color:#0d6efd;
    margin-bottom:8px;
}

.upload p{
    color:#666;
    font-size:14px;
    margin-bottom:18px;
}

.file-label{
    display:inline-block;
    background:#0d6efd;
    color:white;
    padding:12px 25px;
    border-radius:25px;
    font-weight:bold;
    cursor:pointer;
}

#fileInput{
    display:none;
}

/* EDITOR */

.editor{
    display:none;
    background:white;
    border-radius:16px;
    padding:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

/* TOOLBAR */

.toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:10px;
}

.btn{
    border:0;
    padding:10px 13px;
    border-radius:9px;
    background:#eaf0f6;
    color:#182538;
    font-weight:bold;
    cursor:pointer;
}

.btn:active{
    transform:scale(.97);
}

.blue{
    background:#0d6efd;
    color:white;
}

.green{
    background:#00a86b;
    color:white;
}

.red{
    background:#dc3545;
    color:white;
}

.orange{
    background:#f59e0b;
    color:white;
}

/* TEXT */

.text-area{
    display:flex;
    gap:7px;
    margin-bottom:10px;
}

#textInput{
    flex:1;
    border:1px solid #ccd5df;
    border-radius:9px;
    padding:11px;
    font-size:15px;
}

/* CANVAS */

.canvas-box{
    background:#20252b;
    border-radius:12px;
    padding:12px;
    min-height:300px;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:auto;
}

#canvas{
    display:block;
    max-width:100%;
    height:auto;
    background:white;
    box-shadow:0 2px 15px rgba(0,0,0,.4);
    touch-action:none;
}

/* CONTROLS */

.controls{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(150px,1fr));
    gap:10px;
    margin-top:12px;
}

.control{
    background:#f6f8fb;
    border-radius:10px;
    padding:10px;
}

.control label{
    display:block;
    font-size:12px;
    font-weight:bold;
    margin-bottom:6px;
}

.control input,
.control select{
    width:100%;
    border:1px solid #ccd5df;
    border-radius:7px;
    padding:8px;
    background:white;
}

/* OCR */

.ocr-box{
    margin-top:12px;
    background:#eef7ff;
    border-radius:10px;
    padding:12px;
}

.ocr-title{
    font-weight:bold;
    color:#0d6efd;
    margin-bottom:7px;
}

#ocrText{
    width:100%;
    min-height:80px;
    border:1px solid #c9d8e8;
    border-radius:8px;
    padding:10px;
    resize:vertical;
}

/* STATUS */

.status{
    margin-top:10px;
    text-align:center;
    color:#666;
    font-size:13px;
}

.progress{
    width:100%;
    height:8px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
    margin-top:8px;
    display:none;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#0d6efd;
    transition:.2s;
}

/* FOOTER */

.footer{
    text-align:center;
    padding:25px 10px;
    color:#777;
    font-size:12px;
}

/* MOBILE */

@media(max-width:600px){

    .header h1{
        font-size:19px;
    }

    .toolbar{
        display:grid;
        grid-template-columns:
            repeat(2,1fr);
    }

    .btn{
        width:100%;
    }

    .text-area{
        flex-direction:column;
    }

}

</style>
</head>


<body>


<!-- HEADER -->

<header class="header">

    <h1>
        🖼️ SARVATRA AI Image Text Editor
    </h1>

    <p>
        OCR • Erase • Add Text • Edit • Download
    </p>

    <a
        href="../index.html"
        class="home"
    >
        🏠 SARVATRA Home
    </a>

</header>



<div class="container">


<!-- UPLOAD -->

<div
    class="upload"

>

    </label>

<div

<!-- TOOLBAR -->

<div class="toolbar">

    </button>

        id="pngBtn"

    </button>

<div class="text-area">

    <input
        id="textInput"

        Apply
    </button>

</div>



<!-- CANVAS -->

<div class="canvas-box">

    <canvas
        id="canvas"
    ></canvas>

</div>



<!-- CONTROLS -->

<div class="controls">


    <div class="control">

        <label>
            Font
        </label>

        <select id="fontFamily">

            <option>
                Arial
            </option>

            <option>
                Verdana
            </option>

            <option>

            </option>

    <div class="control">

    <div class="control">

    <div class="control">

</div>



<!-- OCR -->

<div class="ocr-box">

</div>



<div class="progress" id="progress">

    <div
        class="progress-bar"

    ></div>

</div>



<div
    class="status"
    id="status"
>
    Upload an image to start.
</div>


</div>

</div>



<div class="footer">

    SARVATRA © 2026

    <br>

    All Government Services

</div>



<script>

/* =====================================================
   VARIABLES
===================================================== */

const fileInput =
    document.getElementById(
        "fileInput"
    );

const uploadBox =
    document.getElementById(
        "uploadBox"
    );

const editor =
    document.getElementById(
        "editor"
    );

const canvas =
    document.getElementById(
        "canvas"
    );

const ctx =
    canvas.getContext(
        "2d"
    );

const textInput =
    document.getElementById(
        "textInput"
    );

const fontFamily =
    document.getElementById(
        "fontFamily"
    );

const fontSize =
    document.getElementById(
        "fontSize"
    );

const textColor =
    document.getElementById(
        "textColor"
    );

const fontStyle =
    document.getElementById(
        "fontStyle"
    );

const eraseSize =
    document.getElementById(
        "eraseSize"
    );

const statusBox =
    document.getElementById(
        "status"
    );

const ocrText =
    document.getElementById(
        "ocrText"
    );

const progress =
    document.getElementById(
        "progress"
    );

const progressBar =
    document.getElementById(
        "progressBar"
    );


let originalImage =
    new Image();

let imageLoaded =
    false;

let textObjects =
    [];

let selectedText =
    null;

let mode =
    "move";

let dragging =
    false;

let erasing =
    false;

let offsetX =
    0;

let offsetY =
    0;

let history =
    [];

let redoHistory =
    [];


/* =====================================================
   IMAGE UPLOAD
===================================================== */

fileInput.addEventListener(
    "change",
    function(){

        const file =
            fileInput.files[0];

        if(!file){

            return;

        }


        if(
            !file.type.startsWith(
                "image/"
            )
        ){

            alert(
                "Please select an image."
            );

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function(e){

                originalImage =
                    new Image();


                originalImage.onload =
                    function(){

                        canvas.width =
                            originalImage.naturalWidth;

                        canvas.height =
                            originalImage.naturalHeight;


                        textObjects =
                            [];

                        selectedText =
                            null;

                        imageLoaded =
                            true;


                        draw();


                        history =
                            [];

                        redoHistory =
                            [];

                        saveState();


                        uploadBox.style.display =
                            "none";

                        editor.style.display =
                            "block";


                        statusBox.textContent =
                            "Image loaded successfully.";

                    };


                originalImage.src =
                    e.target.result;

            };


        reader.readAsDataURL(
            file
        );

    }
);


/* =====================================================
   DRAW
===================================================== */

function draw(){

    if(
        !imageLoaded
    ){

        return;

    }


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.drawImage(
        originalImage,
        0,
        0,
        canvas.width,
        canvas.height
    );


    textObjects.forEach(
        function(obj){

            ctx.save();


            ctx.font =
                obj.style +
                " " +
                obj.size +
                "px " +
                obj.font;


            ctx.fillStyle =
                obj.color;


            ctx.textBaseline =
                "top";


            ctx.fillText(
                obj.text,
                obj.x,
                obj.y
            );


            if(
                obj === selectedText
            ){

                const width =
                    ctx.measureText(
                        obj.text
                    ).width;


                ctx.strokeStyle =
                    "#0d6efd";


                ctx.lineWidth =
                    2;


                ctx.setLineDash(
                    [6,4]
                );


                ctx.strokeRect(
                    obj.x - 5,
                    obj.y - 5,
                    width + 10,
                    obj.size + 10
                );


                ctx.setLineDash([]);

            }


            ctx.restore();

        }
    );

}


/* =====================================================
   ADD TEXT
===================================================== */

document
.getElementById(
    "addTextBtn"
)
.addEventListener(
    "click",
    function(){

        const value =
            textInput.value.trim();


        if(!value){

            alert(
                "Enter text first."
            );

            return;

        }


        const obj = {

            id:
                Date.now(),

            text:
                value,

            x:
                canvas.width / 2 - 50,

            y:
                canvas.height / 2 - 20,

            font:
                fontFamily.value,

            size:
                Number(
                    fontSize.value
                ),

            color:
                textColor.value,

            style:
                fontStyle.value

        };


        textObjects.push(
            obj
        );


        selectedText =
            obj;


        saveState();

        draw();


        statusBox.textContent =
            "Text added. Drag it to move.";

    }
);


/* =====================================================
   SELECT TEXT
===================================================== */

function getPosition(e){

    const rect =
        canvas.getBoundingClientRect();


    return {

        x:
            (
                e.clientX -
                rect.left
            )
            *
            canvas.width /
            rect.width,

        y:
            (
                e.clientY -
                rect.top
            )
            *
            canvas.height /
            rect.height

    };

}


function findText(
    x,
    y
){

    for(
        let i =
            textObjects.length - 1;

        i >= 0;

        i--
    ){

        const obj =
            textObjects[i];


        ctx.font =
            obj.style +
            " " +
            obj.size +
            "px " +
            obj.font;


        const width =
            ctx.measureText(
                obj.text
            ).width;


        if(
            x >= obj.x &&
            x <= obj.x + width &&
            y >= obj.y &&
            y <= obj.y + obj.size + 10
        ){

            return obj;

        }

    }


    return null;

}


/* =====================================================
   POINTER DOWN
===================================================== */

canvas.addEventListener(
    "pointerdown",
    function(e){

        if(
            !imageLoaded
        ){

            return;

        }


        const p =
            getPosition(e);


        if(
            mode === "erase"
        ){

            erasing =
                true;

            canvas.setPointerCapture(
                e.pointerId
            );


            eraseAt(
                p.x,
                p.y
            );


            return;

        }


        const obj =
            findText(
                p.x,
                p.y
            );


        if(
            obj
        ){

            selectedText =
                obj;


            dragging =
                true;


            offsetX =
                p.x - obj.x;


            offsetY =
                p.y - obj.y;


            updateTextControls();


            canvas.setPointerCapture(
                e.pointerId
            );


            draw();

        }

    }
);


/* =====================================================
   POINTER MOVE
===================================================== */

canvas.addEventListener(
    "pointermove",
    function(e){

        if(
            mode === "erase" &&
            erasing
        ){

            const p =
                getPosition(e);


            eraseAt(
                p.x,
                p.y
            );


            return;

        }


        if(
            !dragging ||
            !selectedText
        ){

            return;

        }


        const p =
            getPosition(e);


        selectedText.x =
            p.x - offsetX;


        selectedText.y =
            p.y - offsetY;


        draw();

    }
);


/* =====================================================
   POINTER UP
===================================================== */

canvas.addEventListener(
    "pointerup",
    function(){

        if(
            dragging
        ){

            dragging =
                false;

            saveState();

        }


        if(
            erasing
        ){

            erasing =
                false;

            saveState();

        }

    }
);


/* =====================================================
   TEXT CONTROLS
===================================================== */

function updateTextControls(){

    if(
        !selectedText
    ){

        return;

    }


    textInput.value =
        selectedText.text;


    fontFamily.value =
        selectedText.font;


    fontSize.value =
        selectedText.size;


    textColor.value =
        selectedText.color;


    fontStyle.value =
        selectedText.style;

}


/* =====================================================
   APPLY TEXT
===================================================== */

document
.getElementById(
    "applyBtn"
)
.addEventListener(
    "click",
    function(){

        if(
            !selectedText
        ){

            alert(
                "Select a text first."
            );

            return;

        }


        selectedText.text =
            textInput.value;


        selectedText.font =
            fontFamily.value;


        selectedText.size =
            Number(
                fontSize.value
            );


        selectedText.color =
            textColor.value;


        selectedText.style =
            fontStyle.value;


        saveState();

        draw();


        statusBox.textContent =
            "Text updated.";

    }
);


/* =====================================================
   MOVE MODE
===================================================== */

document
.getElementById(
    "moveBtn"
)
.addEventListener(
    "click",
    function(){

        mode =
            "move";


        statusBox.textContent =
            "Move mode enabled.";

    }
);


/* =====================================================
   ERASE MODE
===================================================== */

document
.getElementById(
    "eraseBtn"
)
.addEventListener(
    "click",
    function(){

        mode = "erase";

        statusBox.textContent =
            "Erase mode enabled. Draw over the unwanted area.";

    }
);


/* =====================================================
   BASIC BACKGROUND REPAIR
===================================================== */

function eraseAt(x, y){

    const size =
        Number(eraseSize.value);

    const radius =
        size / 2;


    /*
       Take nearby pixels as background samples.
    */

    const sample =
        Math.max(
            3,
            Math.floor(radius * 0.6)
        );


    const points = [

        {
            x:
                Math.max(
                    0,
                    x - radius - sample
                ),
            y: y
        },

        {
            x:
                Math.min(
                    canvas.width - 1,
                    x + radius + sample
                ),
            y: y
        },

        {
            x: x,
            y:
                Math.max(
                    0,
                    y - radius - sample
                )
        },

        {
            x: x,
            y:
                Math.min(
                    canvas.height - 1,
                    y + radius + sample
                )
        }

    ];


    let r = 0;
    let g = 0;
    let b = 0;


    points.forEach(function(p){

        const pixel =
            ctx.getImageData(
                Math.round(p.x),
                Math.round(p.y),
                1,
                1
            ).data;


        r += pixel[0];
        g += pixel[1];
        b += pixel[2];

    });


    r =
        Math.round(
            r / points.length
        );

    g =
        Math.round(
            g / points.length
        );

    b =
        Math.round(
            b / points.length
        );


    /*
       Soft circular repair.
    */

    ctx.save();


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
    );

    ctx.clip();


    const gradient =
        ctx.createRadialGradient(
            x,
            y,
            0,
            x,
            y,
            radius
        );


    gradient.addColorStop(
        0,
        "rgba(" +
        r + "," +
        g + "," +
        b +
        ",1)"
    );


    gradient.addColorStop(
        0.65,
        "rgba(" +
        r + "," +
        g + "," +
        b +
        ",0.85)"
    );


    gradient.addColorStop(
        1,
        "rgba(" +
        r + "," +
        g + "," +
        b +
        ",0.15)"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        x - radius,
        y - radius,
        size,
        size
    );


    ctx.restore();

}


/* =====================================================
   OCR
===================================================== */

document
.getElementById(
    "ocrBtn"
)
.addEventListener(
    "click",
    async function(){

        if(!imageLoaded){

            alert(
                "Upload an image first."
            );

            return;

        }


        if(
            typeof Tesseract ===
            "undefined"
        ){

            alert(
                "OCR library could not load. Please check your internet connection."
            );

            return;

        }


        progress.style.display =
            "block";


        progressBar.style.width =
            "0%";


        ocrText.value =
            "";


        statusBox.textContent =
            "Starting OCR...";


        try{

            const result =
                await Tesseract.recognize(
                    canvas,
                    "eng",
                    {

                        logger:
                            function(message){

                                if(
                                    typeof message.progress ===
                                    "number"
                                ){

                                    progressBar.style.width =
                                        Math.round(
                                            message.progress *
                                            100
                                        ) +
                                        "%";

                                }


                                if(
                                    message.status
                                ){

                                    statusBox.textContent =
                                        message.status;

                                }

                            }

                    }
                );


            ocrText.value =
                result.data.text.trim();


            progressBar.style.width =
                "100%";


            statusBox.textContent =
                "Text detection completed.";

        }
        catch(error){

            console.error(
                error
            );


            statusBox.textContent =
                "OCR failed.";

            alert(
                "OCR failed. Please try another image."
            );

        }


        setTimeout(
            function(){

                progress.style.display =
                    "none";

            },
            800
        );

    }
);


/* =====================================================
   SAVE STATE
===================================================== */

function saveState(){

    history.push(
        JSON.stringify(
            textObjects
        )
    );


    if(
        history.length > 30
    ){

        history.shift();

    }


    redoHistory =
        [];

}


/* =====================================================
   UNDO
===================================================== */

document
.getElementById(
    "undoBtn"
)
.addEventListener(
    "click",
    function(){

        if(
            history.length <= 1
        ){

            return;

        }


        const current =
            history.pop();


        redoHistory.push(
            current
        );


        const previous =
            history[
                history.length - 1
            ];


        textObjects =
            JSON.parse(
                previous
            );


        selectedText =
            null;


        draw();


        statusBox.textContent =
            "Undo completed.";

    }
);


/* =====================================================
   REDO
===================================================== */

document
.getElementById(
    "redoBtn"
)
.addEventListener(
    "click",
    function(){

        if(
            redoHistory.length === 0
        ){

            return;

        }


        const state =
            redoHistory.pop();


        history.push(
            state
        );


        textObjects =
            JSON.parse(
                state
            );


        selectedText =
            null;


        draw();


        statusBox.textContent =
            "Redo completed.";

    }
);


/* =====================================================
   RESET
===================================================== */

document
.getElementById(
    "resetBtn"
)
.addEventListener(
    "click",
    function(){

        if(
            !confirm(
                "Remove all added text and reset the editor?"
            )
        ){

            return;

        }


        textObjects =
            [];


        selectedText =
            null;


        mode =
            "move";


        textInput.value =
            "";


        draw();


        saveState();


        statusBox.textContent =
            "Editor reset.";

    }
);


/* =====================================================
   PNG DOWNLOAD
===================================================== */

document
.getElementById(
    "pngBtn"
)
.addEventListener(
    "click",
    function(){

        downloadImage(
            "png"
        );

    }
);


/* =====================================================
   JPG DOWNLOAD
===================================================== */

document
.getElementById(
    "jpgBtn"
)
.addEventListener(
    "click",
    function(){

        downloadImage(
            "jpg"
        );

    }
);


/* =====================================================
   DOWNLOAD IMAGE
===================================================== */

function downloadImage(type){

    const output =
        document.createElement(
            "canvas"
        );


    output.width =
        canvas.width;


    output.height =
        canvas.height;


    const outputContext =
        output.getContext(
            "2d"
        );


    /*
       JPG needs white background.
    */

    if(
        type === "jpg"
    ){

        outputContext.fillStyle =
            "#ffffff";


        outputContext.fillRect(
            0,
            0,
            output.width,
            output.height
        );

    }


    outputContext.drawImage(
        canvas,
        0,
        0
    );


    const mimeType =
        type === "png"
        ? "image/png"
        : "image/jpeg";


    const quality =
        type === "jpg"
        ? 0.95
        : undefined;


    const imageData =
        output.toDataURL(
            mimeType,
            quality
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        imageData;


    link.download =
        "SARVATRA-Image-Text-Editor." +
        type;


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    statusBox.textContent =
        "Download completed.";

}


/* =====================================================
   INITIAL STATUS
===================================================== */

statusBox.textContent =
    "Upload an image to start.";

</script>
