<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SARVATRA Digital Bio-Link Maker</title>

<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

:root{
    --bg:#07111f;
    --panel:#0d1726;
    --panel2:#111f32;
    --border:rgba(255,255,255,.10);
    --text:#ffffff;
    --muted:#9ca9ba;
    --blue:#2563eb;
    --green:#10b981;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,"Noto Sans Telugu",sans-serif;
    background:
        radial-gradient(circle at top left,#12356b 0%,transparent 32%),
        radial-gradient(circle at bottom right,#064e3b 0%,transparent 28%),
        var(--bg);
    color:var(--text);
    padding:20px;
}

/* HOME BUTTON */

.home-btn{
    position:fixed;
    top:15px;
    left:15px;
    z-index:9999;

    border:none;
    border-radius:12px;
    padding:11px 18px;

    background:linear-gradient(135deg,#2563eb,#10b981);
    color:white;
    font-weight:800;
    font-size:14px;

    cursor:pointer;
    box-shadow:0 8px 25px rgba(0,0,0,.35);
    transition:.2s;
}

.home-btn:hover{
    transform:translateY(-2px);
}

/* HEADER */

.page-title{
    text-align:center;
    margin:8px 0 20px;
}

.page-title h1{
    margin:0;
    font-size:27px;
    font-weight:900;
}

.page-title p{
    margin:7px 0 0;
    color:var(--muted);
    font-size:13px;
}

/* MAIN */

.wrapper{
    max-width:1100px;
    margin:auto;

    display:grid;
    grid-template-columns:minmax(350px,1fr) 390px;

    gap:30px;
    align-items:start;
}

/* EDITOR */

.editor-panel{
    background:rgba(13,23,38,.94);
    border:1px solid var(--border);
    border-radius:22px;
    padding:22px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.35);

    backdrop-filter:blur(12px);
}

.editor-title{
    margin:0 0 18px;
    font-size:22px;
    font-weight:900;

    padding-bottom:13px;
    border-bottom:1px solid var(--border);
}

.section-title{
    font-size:14px;
    font-weight:800;
    color:#60a5fa;
    margin:20px 0 10px;
}

.form-group{
    margin-bottom:13px;
}

label{
    display:block;
    margin-bottom:6px;
    font-size:12px;
    font-weight:700;
    color:#cbd5e1;
}

input,
textarea,
select{
    width:100%;
    border:1px solid rgba(255,255,255,.10);
    outline:none;

    background:#081321;
    color:white;

    padding:12px;
    border-radius:10px;

    font-size:14px;
    font-family:inherit;

    transition:.2s;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#3b82f6;
    box-shadow:0 0 0 2px rgba(59,130,246,.12);
}

textarea{
    resize:vertical;
    min-height:70px;
}

/* PHOTO */

.file-box{
    border:1px dashed #3b82f6;
    background:rgba(37,99,235,.07);
    padding:12px;
    border-radius:12px;
}

/* TWO INPUTS */

.two-input{
    display:grid;
    grid-template-columns:38% 1fr;
    gap:7px;
}

/* LINKS */

.link-row{
    display:grid;
    grid-template-columns:38% 1fr;
    gap:7px;
    margin-bottom:8px;
}

/* BUTTONS */

.btn-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:20px;
}

.action-btn{
    border:0;
    border-radius:11px;
    padding:13px 8px;

    color:white;
    font-weight:800;
    font-size:13px;

    cursor:pointer;
    transition:.2s;
}

.action-btn:hover{
    transform:translateY(-2px);
    filter:brightness(1.08);
}

.btn-jpg{
    background:linear-gradient(135deg,#059669,#10b981);
}

.btn-pdf{
    background:linear-gradient(135deg,#dc2626,#f43f5e);
}

.btn-qr{
    background:linear-gradient(135deg,#7c3aed,#a855f7);
}

.btn-share{
    grid-column:span 2;
    background:linear-gradient(135deg,#2563eb,#06b6d4);
}

/* PREVIEW SIDE */

.preview-wrapper{
    display:flex;
    flex-direction:column;
    align-items:center;

    position:sticky;
    top:20px;
}

.preview-label{
    font-size:13px;
    font-weight:900;
    letter-spacing:1px;
    color:#94a3b8;
    margin-bottom:10px;
}

/* PHONE */

.capture-area{
    padding:5px;
}

.phone{
    width:320px;
    height:600px;

    padding:35px 20px 18px;

    border:8px solid #252b35;
    border-radius:42px;

    position:relative;
    overflow:hidden;

    display:flex;
    flex-direction:column;
    align-items:center;

    background:linear-gradient(
        180deg,
        #2563eb 0%,
        #07111f 100%
    );

    box-shadow:
        0 25px 70px rgba(0,0,0,.65);
}

/* NOTCH */

.notch{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);

    width:105px;
    height:18px;

    border-radius:20px;
    background:#252b35;
}

/* AVATAR */

.avatar{
    width:88px;
    height:88px;

    border-radius:50%;
    object-fit:cover;

    margin-top:17px;

    border:3px solid white;
    background:#333;

    box-shadow:
        0 8px 25px rgba(0,0,0,.35);
}

/* PROFILE */

.profile-name{
    margin-top:12px;
    font-size:20px;
    font-weight:900;

    text-align:center;

    text-shadow:
        0 2px 5px rgba(0,0,0,.4);
}

.profile-bio{
    margin:5px 0 17px;

    font-size:12px;
    line-height:1.4;

    text-align:center;
    color:#e2e8f0;

    max-width:260px;

    max-height:48px;
    overflow:hidden;
}

/* CONTACT BUTTONS */

.quick-buttons{
    display:flex;
    gap:7px;

    width:100%;
    margin-bottom:10px;
}

.quick-btn{
    flex:1;

    padding:8px 5px;

    border-radius:10px;

    text-align:center;

    text-decoration:none;

    color:white;

    font-size:11px;
    font-weight:800;

    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.16);

    backdrop-filter:blur(7px);
}

/* LINKS */

.links-container{
    width:100%;

    display:flex;
    flex-direction:column;

    gap:9px;

    flex:1;

    overflow-y:auto;

    padding-right:2px;
}

.links-container::-webkit-scrollbar{
    width:3px;
}

.links-container::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.25);
    border-radius:10px;
}

.bio-link{
    display:block;

    width:100%;

    padding:12px;

    border-radius:12px;

    text-align:center;

    color:white;
    text-decoration:none;

    font-size:13px;
    font-weight:800;

    background:rgba(255,255,255,.09);

    border:1px solid rgba(255,255,255,.16);

    backdrop-filter:blur(8px);

    transition:.2s;
}

.bio-link:hover{
    transform:scale(1.02);
    background:rgba(255,255,255,.18);
}

/* BRAND */

.branding{
    padding-top:10px;

    font-size:9px;
    font-weight:900;

    letter-spacing:2px;

    color:rgba(255,255,255,.48);

    flex-shrink:0;
}

/* QR */

.qr-section{
    margin-top:15px;

    background:#fff;

    border-radius:15px;

    padding:10px;

    display:none;
}

#qrcode img{
    display:block;
    margin:auto;
}

.qr-text{
    color:#111;
    font-size:10px;
    text-align:center;
    margin-top:5px;
    font-weight:800;
}

/* TOAST */

.toast{
    position:fixed;

    bottom:20px;
    left:50%;

    transform:translateX(-50%) translateY(80px);

    background:#111827;
    color:white;

    padding:12px 18px;

    border-radius:12px;

    font-size:13px;
    font-weight:700;

    opacity:0;

    transition:.3s;

    z-index:10000;

    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* SHARED PROFILE */

.shared-mode .editor-panel,
.shared-mode .page-title,
.shared-mode .preview-label,
.shared-mode .home-btn{
    display:none;
}

.shared-mode{
    padding-top:20px;
}

.shared-wrapper{
    display:flex;
    justify-content:center;
}

.shared-actions{
    margin-top:12px;
    display:flex;
    gap:8px;
}

.shared-actions button{
    border:0;
    padding:10px 14px;
    border-radius:10px;
    color:white;
    background:#2563eb;
    font-weight:800;
    cursor:pointer;
}

/* MOBILE */

@media(max-width:850px){

    body{
        padding:65px 12px 20px;
    }

    .wrapper{
        grid-template-columns:1fr;
        gap:25px;
    }

    .preview-wrapper{
        position:static;
    }

    .editor-panel{
        width:100%;
    }

    .page-title h1{
        font-size:22px;
    }
}

@media(max-width:420px){

    .phone{
        width:310px;
        height:580px;
    }

    .editor-panel{
        padding:16px;
    }

    .link-row{
        grid-template-columns:36% 1fr;
    }

    .two-input{
        grid-template-columns:36% 1fr;
    }
}
</style>
</head>

<body>

<!-- HOME -->
<button class="home-btn" onclick="goHome()">🏠 Home</button>

<div class="page-title">
    <h1>✨ SARVATRA Digital Bio-Link</h1>
    <p>మీ Digital Profile • Visiting Card • Bio Link</p>
</div>

<div class="wrapper">

<!-- ================= EDITOR ================= -->

<div class="editor-panel">

    <h2 class="editor-title">
        Bio-Link మేకర్ <span style="color:#3b82f6;">(SARVATRA)</span>
    </h2>

    <!-- PHOTO -->

    <div class="section-title">👤 Profile Details</div>

    <div class="form-group">
        <label>ప్రొఫైల్ ఫోటో (Upload Photo)</label>

        <div class="file-box">
            <input
                type="file"
                id="inPhoto"
                accept="image/*"
                onchange="previewFile(event)"
            >
        </div>
    </div>

    <!-- THEME -->

    <div class="form-group">
        <label>🎨 కలర్ థీమ్</label>

        <select id="inTheme" onchange="changeTheme()">
            <option value="blue">Royal Blue</option>
            <option value="dark">Midnight Dark</option>
            <option value="purple">Sunset Purple</option>
            <option value="emerald">Emerald Green</option>
            <option value="cyan">Ocean Cyan</option>
            <option value="red">Ruby Red</option>
        </select>
    </div>

    <!-- NAME -->

    <div class="form-group">

            oninput="updateBio()"

    <!-- BIO -->

    <div class="form-group">

    <!-- CONTACT -->

    <div class="form-group">

        <input

            id="inWhatsapp"

        >
    </div>

    <div class="form-group">
        <label>📧 Email</label>

        <input
            type="email"
            id="inEmail"
            placeholder="example@gmail.com"
            oninput="updateBio()"
        >
    </div>

    <!-- LOCATION -->

    <div class="form-group">
        <label>📍 Location</label>

        <input
            type="text"
            id="inLocation"
            placeholder="Eluru, Andhra Pradesh"
            oninput="updateBio()"
        >
    </div>

    <!-- LINKS -->

    <div class="section-title">🔗 Custom Links</div>

    <div class="link-row">
        <input
            type="text"
            id="t1"
            placeholder="WhatsApp"
            oninput="updateBio()"
        >
        <input
            type="url"
            id="l1"

    <div class="link-row">
        <input

            id="t2"
            placeholder="YouTube"
            oninput="updateBio()"
        >
        <input
            type="url"
            id="l2"
            placeholder="https://..."
            oninput="updateBio()"
        >
    </div>

    <div class="link-row">
        <input
            type="text"
            id="t3"
            placeholder="Instagram"
            oninput="updateBio()"
        >
        <input
            type="url"
            id="l3"
            placeholder="https://..."
            oninput="updateBio()"
        >
    </div>

    <div class="link-row">
        <input
            type="text"
            id="t4"
            placeholder="Facebook"
            oninput="updateBio()"
        >
        <input
            type="url"
            id="l4"
            placeholder="https://..."
            oninput="updateBio()"
        >
    </div>

    <div class="link-row">
        <input
            type="text"
            id="t5"
            placeholder="My Website"
            oninput="updateBio()"
        >
        <input
            type="url"
            id="l5"
            placeholder="https://..."
            oninput="updateBio()"
        >
    </div>

    <div class="link-row">
        <input
            type="text"
            id="t6"
            placeholder="Other Link"
            oninput="updateBio()"
        >
        <input
            type="url"
            id="l6"
            placeholder="https://..."
            oninput="updateBio()"
        >
    </div>

    <!-- BUTTONS -->

    <div class="btn-grid">

        <button
            class="action-btn btn-jpg"
            onclick="downloadImage()"

            📥 Download JPG

        <button

    <div class="qr-section" id="qrSection">

</div>


<!-- ================= PREVIEW ================= -->

<div class="preview-wrapper">

    <div class="preview-label">
        LIVE PREVIEW
    </div>

    <div class="capture-area" id="captureArea">

            <div class="notch"></div>

                id="viewImg"

                alt="Profile"
            >

                id="viewName"

                Kalyan Tech

<script>

/* =========================
   DEFAULT VALUES
========================= */

const DEFAULT_NAME = "Kalyan Tech";
const DEFAULT_BIO = "Digital Creator & Developer";

let currentPhoto = "";


/* =========================
   HOME
========================= */

function goHome(){

    /*
      Tool location:
      /tools/digital-bio-link.html

      Main SARVATRA:
      /index.html
    */

    window.location.href = "../index.html";
}


/* =========================
   TOAST
========================= */

function showToast(message){

    const toast = document.getElementById("toast");

    toast.innerText = message;
    toast.classList.add("show");

    setTimeout(()=>{
        toast.classList.remove("show");
    },2200);
}


/* =========================
   PHOTO PREVIEW
========================= */

function previewFile(event){

    const file = event.target.files[0];

    if(!file){
        return;
    }

    if(!file.type.startsWith("image/")){
        showToast("Image file మాత్రమే select చేయండి");
        return;
    }

    const reader = new FileReader();

    reader.onload = function(){

        currentPhoto = reader.result;

        document.getElementById("viewImg").src = reader.result;
    };

    reader.readAsDataURL(file);
}


/* =========================
   THEME
========================= */

function changeTheme(){

    const theme =
        document.getElementById("inTheme").value;

    const panel =
        document.getElementById("phonePanel");

    const themes = {

        blue:
        "linear-gradient(180deg,#2563eb 0%,#07111f 100%)",

        dark:
        "linear-gradient(180deg,#27272a 0%,#050505 100%)",

        purple:
        "linear-gradient(180deg,#7c3aed 0%,#10051d 100%)",

        emerald:
        "linear-gradient(180deg,#059669 0%,#021a12 100%)",

        cyan:
        "linear-gradient(180deg,#0891b2 0%,#06202a 100%)",

        red:
        "linear-gradient(180deg,#dc2626 0%,#210606 100%)"
    };

    panel.style.background =
        themes[theme] || themes.blue;

    saveData();
}


/* =========================
   UPDATE PROFILE
========================= */

function updateBio(){

    const name =
        document.getElementById("inName").value.trim();

    const bio =
        document.getElementById("inBio").value.trim();

    document.getElementById("viewName").innerText =
        name || DEFAULT_NAME;

    document.getElementById("viewBio").innerText =
        bio || DEFAULT_BIO;


    /* CONTACT */

    const phone =
        document.getElementById("inPhone").value.trim();

    const whatsapp =
        document.getElementById("inWhatsapp").value.trim();

    const email =
        document.getElementById("inEmail").value.trim();

    const location =
        document.getElementById("inLocation").value.trim();

    const quick =
        document.getElementById("quickButtons");

    quick.innerHTML = "";


    if(phone){

        quick.innerHTML += `
            <a
                class="quick-btn"
                href="tel:${phone}"
            >
                📞 Call
            </a>
        `;
    }

    if(whatsapp){

        const clean =
            whatsapp.replace(/\D/g,"");

        quick.innerHTML += `
            <a
                class="quick-btn"
                href="https://wa.me/${clean}"
                target="_blank"
            >
                💬 WhatsApp
            </a>
        `;
    }

    if(email){

        quick.innerHTML += `
            <a
                class="quick-btn"
                href="mailto:${email}"
            >
                📧 Email
            </a>
        `;
    }


    /* LINKS */

    const linksArea =
        document.getElementById("linksArea");

    linksArea.innerHTML = "";

    for(let i=1;i<=6;i++){

        const titleElement =
            document.getElementById("t"+i);

        const linkElement =
            document.getElementById("l"+i);

        const title =
            titleElement.value.trim();

        const link =
            linkElement.value.trim();

        if(title && link){

            let finalLink = link;

            if(
                !/^https?:\/\//i.test(finalLink) &&
                !/^mailto:/i.test(finalLink) &&
                !/^tel:/i.test(finalLink)
            ){
                finalLink = "https://" + finalLink;
            }

            const a =
                document.createElement("a");

            a.className = "bio-link";
            a.href = finalLink;
            a.target = "_blank";
            a.rel = "noopen
            a.rel =
                "noopener noreferrer";

            a.innerText =
                title;

            linksArea.appendChild(
                a
            );
        }
    }


    /* =========================
       EMPTY LINKS MESSAGE
    ========================= */

    if(linksArea.children.length === 0){

        const empty =
            document.createElement("div");

        empty.className =
            "bio-link";

        empty.style.opacity =
            "0.35";

        empty.style.pointerEvents =
            "none";

        empty.innerText =
            "Your Links will appear here";

        linksArea.appendChild(
            empty
        );
    }


    /* =========================
       SAVE
    ========================= */

    saveData();
          }
  /* =========================
   GET PROFILE DATA
========================= */

function getProfileData(){

    const links = [];

    for(let i = 1; i <= 6; i++){

        const titleElement =
            document.getElementById("t" + i);

        const linkElement =
            document.getElementById("l" + i);

        if(!titleElement || !linkElement){
            continue;
        }

        const title =
            titleElement.value.trim();

        const url =
            linkElement.value.trim();

        if(title && url){

            links.push({
                title: title,
                url: url
            });
        }
    }


    return {

        name:
            document.getElementById("inName").value.trim(),

        bio:
            document.getElementById("inBio").value.trim(),

        phone:
            document.getElementById("inPhone").value.trim(),

        whatsapp:
            document.getElementById("inWhatsapp").value.trim(),

        email:
            document.getElementById("inEmail").value.trim(),

        location:
            document.getElementById("inLocation").value.trim(),

        theme:
            document.getElementById("inTheme").value,

        links: links,

        photo: currentPhoto
    };
}


/* =========================
   SAVE DATA
========================= */

function saveData(){

    try{

        const data =
            getProfileData();

        const saveObject = {
            ...data,
            photo: ""
        };

        localStorage.setItem(
            "sarvatraBioLink",
            JSON.stringify(saveObject)
        );

    }catch(error){

        console.log(
            "Save error:",
            error
        );
    }
}
  /* =========================
   LOAD LOCAL DATA
========================= */

function loadSavedData(){

    try{

        const raw =
            localStorage.getItem("sarvatraBioLink");

        if(!raw){
            return;
        }

        const data =
            JSON.parse(raw);


        /* NAME */

  /* =========================
   RESIZE PHOTO
========================= */

function resizePhoto(dataUrl){

    return new Promise((resolve)=>{

        if(!dataUrl){
            resolve("");
            return;
        }

        const img =
            new Image();

        img.onload = function(){

            const canvas =
                document.createElement("canvas");

            const size = 150;

            canvas.width = size;
            canvas.height = size;

            const ctx =
                canvas.getContext("2d");

            ctx.clearRect(
                0,
                0,
                size,
                size
            );

            const ratio =
                Math.max(
                    size / img.width,
                    size / img.height
                );

            const width =
                img.width * ratio;

            const height =
                img.height * ratio;

            const x =
                (size - width) / 2;

            const y =
                (size - height) / 2;

            ctx.drawImage(
                img,
                x,
                y,
                width,
                height
            );

            resolve(
                canvas.toDataURL(
                    "image/jpeg",
                    0.65
                )
            );
        };

        img.onerror = function(){

            resolve("");
        };

        img.src = dataUrl;
    });
}


/* =========================
   ENCODE PROFILE DATA
========================= */

function encodeData(data){

    const json =
        JSON.stringify(data);

    const bytes =
        new TextEncoder().encode(json);

    let binary = "";

    bytes.forEach(
        byte => {
            binary +=
                String.fromCharCode(byte);
        }
    );

    return btoa(binary);
}


/* =========================
   DECODE PROFILE DATA
========================= */

function decodeData(encoded){

    const binary =
        atob(encoded);

    const bytes =
        Uint8Array.from(
            binary,
            char => char.charCodeAt(0)
        );

    const json =
        new TextDecoder().decode(bytes);

    return JSON.parse(json);
}


/* =========================
   CREATE SHARE URL
========================= */

async function createShareURL(){

    const data =
        getProfileData();


    if(!data.name){
        data.name =
            DEFAULT_NAME;
    }


    if(!data.bio){
        data.bio =
            DEFAULT_BIO;
    }


    if(currentPhoto){

        data.photo =
            await resizePhoto(
                currentPhoto
            );

    }else{

        data.photo = "";
    }


    const encoded =
        encodeData(data);


    return (
        window.location.origin +
        window.location.pathname +
        "#profile=" +
        encoded
    );
}

/* =========================
   DOWNLOAD PDF
========================= */

async function downloadPDF(){

    const element =
        document.getElementById(
            "captureArea"
        );

    showToast(
        "PDF తయారవుతోంది..."
    );


    try{

        const canvas =
            await html2canvas(
                element,
                {
                    scale:3,
                    useCORS:true,
                    backgroundColor:"#07111f"
                }
            );


        const imgData =
            canvas.toDataURL(
                "image/png"
            );


        const {
            jsPDF
        } = window.jspdf;


        const pdf =
            new jsPDF(
                "p",
                "mm",
                "a4"
            );


        const pageWidth =
            pdf.internal.pageSize.getWidth();

        const pageHeight =
            pdf.internal.pageSize.getHeight();


        const phoneWidth = 105;


        const phoneHeight =
            phoneWidth *
            canvas.height /
            canvas.width;


        const x =
            (pageWidth -
             phoneWidth) / 2;


        const y =
            (pageHeight -
             phoneHeight) / 2;


        pdf.addImage(
            imgData,
            "PNG",
            x,
            y,
            phoneWidth,
            phoneHeight
        );


        pdf.save(
            "SARVATRA-Digital-Bio-Link.pdf"
        );


        showToast(
            "PDF Download అయింది ✅"
        );

    }catch(error){

        console.error(
            "PDF error:",
            error
        );

        showToast(
            "PDF Download failed"
        );
    }
  }

========================= */

function loadSharedProfile(){

    const hash =
        window.location.hash;

    if(!hash.startsWith("#profile=")){
        return false;
    }

    try{

        const encoded =
            hash.substring(9);

        const data =
            decodeData(encoded);

        applySharedProfile(data);

        return true;

    }catch(error){

        console.error(
            "Shared profile error:",
            error
        );

        return false;
    }
}
