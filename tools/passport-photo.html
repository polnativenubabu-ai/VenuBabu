<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Passport Photo Creator | SARVATRA</title>

<link rel="icon" href="../icon-192.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f3f6fb;
}

header{
background:#1565c0;
color:#fff;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
box-shadow:0 2px 8px rgba(0,0,0,.2);
}

.container{
max-width:900px;
margin:25px auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.buttons{
display:flex;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap;
}

.btn{
text-decoration:none;
background:#1565c0;
color:white;
padding:10px 18px;
border-radius:8px;
font-weight:bold;
transition:.3s;
}

.btn:hover{
background:#0d47a1;
}

.upload-box{
border:2px dashed #1565c0;
padding:35px;
text-align:center;
border-radius:10px;
background:#eef5ff;
cursor:pointer;
}

.upload-box:hover{
background:#dcecff;
}

input[type=file]{
display:none;
}

.preview{
margin-top:20px;
text-align:center;
}

.preview img{
max-width:100%;
max-height:500px;
border-radius:10px;
display:none;
box-shadow:0 0 10px rgba(0,0,0,.25);
}

.controls{
margin-top:25px;
display:none;
}

.control-group{
margin:15px 0;
}

label{
display:block;
margin-bottom:8px;
font-weight:bold;
}

input[type=range]{
width:100%;
}

select{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid #ccc;
}

.action-buttons{
display:flex;
gap:12px;
margin-top:25px;
flex-wrap:wrap;
}

.action-buttons button{
flex:1;
padding:12px;
font-size:16px;
font-weight:bold;
border:none;
border-radius:8px;
cursor:pointer;
color:white;
}

#downloadJPG{
background:#2e7d32;
}

#downloadPDF{
background:#c62828;
}

footer{
text-align:center;
padding:20px;
margin-top:30px;
color:#666;
font-size:14px;
}

@media(max-width:700px){

.action-buttons{
flex-direction:column;
}

header{
font-size:20px;
}

.container{
margin:10px;
}

}

</style>

<script src="https://unpkg.com/jspdf@latest/dist/jspdf.umd.min.js"></script>
  
</head>

<body>

<header>

📷 Passport Photo Creator

</header>

<div class="container">

<div class="buttons">

<a href="../index.html" class="btn">🏠 Home</a>

<a href="javascript:history.back()" class="btn">⬅ Back</a>

</div>

<label class="upload-box">

<h2>📤 Upload Photo</h2>

<br>

<p>Select Image (JPG / PNG)</p>

<input type="file" id="imageInput" accept="image/*">

</label>

<div class="preview">

<img id="previewImage">

</div>

<div class="controls" id="controls">

<div class="control-group">

<label>

🔍 Zoom

</label>

<input
type="range"
id="zoom"
min="1"
max="3"
step="0.1"
value="1">

</div>

<div class="control-group">

<label>

📏 Passport Size

</label>

<select id="photoSize">

<option value="35x45">

35 × 45 mm

</option>

<option value="2x2">

2 × 2 inch

</option>

<option value="50x50">

50 × 50 mm

</option>

<option value="visa">

Visa Photo

</option>

</select>

</div>

<div class="action-buttons">

<button id="downloadJPG">

⬇ Download JPG

</button>

<button id="downloadPDF">

⬇ Download PDF

</button>

<button id="resetPhoto" style="background:#1565c0;">
🔄 Reset
</button>
  
</div>

</div>

</div>

<footer>

© SARVATRA

</footer>

<script>

const imageInput=document.getElementById("imageInput");

const preview=document.getElementById("previewImage");

const controls=document.getElementById("controls");

let zoom=1;

imageInput.onchange=function(e){

const file=e.target.files[0];

if(!file) return;
  if(!file.type.startsWith("image/")){
    alert("Image file మాత్రమే upload చేయండి");
    return;
  }

const reader=new FileReader();

reader.onload=function(){

preview.src=reader.result;

preview.style.display="block";

controls.style.display="block";

}

reader.readAsDataURL(file);

};

document.getElementById("zoom").oninput=function(){

zoom=this.value;

preview.style.transform="scale("+zoom+")";

};
  // Passport Photo Canvas Setup

const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");

let originalImage = new Image();

let imgX = 0;
let imgY = 0;
let scale = 1;

preview.onload = function(){

    originalImage.src = preview.src;

    originalImage.onload = function(){

        canvas.width = 413;
        canvas.height = 531;

        drawPhoto();

    }

};


function drawPhoto(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    let width = originalImage.width * scale;
    let height = originalImage.height * scale;


    let x =
    (canvas.width-width)/2 + imgX;


    let y =
    (canvas.height-height)/2 + imgY;


    ctx.drawImage(
        originalImage,
        x,
        y,
        width,
        height
    );


}


// Zoom control update

document.getElementById("zoom").oninput=function(){

    scale=this.value;

    drawPhoto();

};
// Photo Drag Support

let dragging = false;

let startX = 0;
let startY = 0;


canvas.style.maxWidth="100%";
canvas.style.borderRadius="10px";



canvas.addEventListener("mousedown",function(e){

    dragging=true;

    startX=e.clientX;
    startY=e.clientY;

});



canvas.addEventListener("mousemove",function(e){

    if(!dragging) return;


    imgX += e.clientX - startX;
    imgY += e.clientY - startY;


    startX=e.clientX;
    startY=e.clientY;


    drawPhoto();

});



canvas.addEventListener("mouseup",function(){

    dragging=false;

});



canvas.addEventListener("mouseleave",function(){

    dragging=false;

});




// Mobile Touch

canvas.addEventListener("touchstart",function(e){

    dragging=true;

    startX=e.touches[0].clientX;
    startY=e.touches[0].clientY;

});



canvas.addEventListener("touchmove",function(e){

    if(!dragging) return;


    imgX += e.touches[0].clientX - startX;
    imgY += e.touches[0].clientY - startY;


    startX=e.touches[0].clientX;
    startY=e.touches[0].clientY;


    drawPhoto();

});



canvas.addEventListener("touchend",function(){

    dragging=false;

});  
  
// Show Canvas Preview

preview.style.display="none";

preview.parentElement.appendChild(canvas);

canvas.style.marginTop="20px";


// When image uploaded create canvas

imageInput.onchange=function(e){

const file=e.target.files[0];

if(!file) return;

if(!file.type.startsWith("image/")){
    alert("Image file మాత్రమే upload చేయండి");
    return;
}
  


const reader=new FileReader();


reader.onload=function(){

preview.src=reader.result;

preview.style.display="block";

controls.style.display="block";


originalImage.onload=function(){

    canvas.width = 413;
    canvas.height = 531;

    scale = 1;
    imgX = 0;
    imgY = 0;

    drawPhoto();

};


originalImage.onerror=function(){

    alert("ఈ ఫోటో load కావడం లేదు. మరో photo try చేయండి.");

};


originalImage.src=reader.result;


};


reader.readAsDataURL(file);

};

// Passport Guide Border

function drawPhoto(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    let width = originalImage.width * scale;
    let height = originalImage.height * scale;


    let x =
    (canvas.width-width)/2 + imgX;


    let y =
    (canvas.height-height)/2 + imgY;


    ctx.drawImage(
        originalImage,
        x,
        y,
        width,
        height
    );


    // Passport Guide Line

    ctx.strokeStyle="#1565c0";
    ctx.lineWidth=3;

    ctx.strokeRect(
        5,
        5,
        canvas.width-10,
        canvas.height-10
    );


}

// JPG Download

document.getElementById("downloadJPG").onclick=function(){

    drawPhoto();


    const link=document.createElement("a");

    link.download="SARVATRA-passport-photo.jpg";


    link.href=canvas.toDataURL(
        "image/jpeg",
        0.95
    );


    link.click();

};

// PDF Download - A4 Passport Sheet

document.getElementById("downloadPDF").onclick=function(){

    drawPhoto();


    const { jsPDF } = window.jspdf;


    let pdf = new jsPDF(
        "p",
        "mm",
        "a4"
    );


    let imgData =
    canvas.toDataURL(
        "image/jpeg",
        0.95
    );


    let x = 10;
    let y = 10;


    let photoWidth = 35;
    let photoHeight = 45;


    let count = 0;


    for(let row=0; row<5; row++){

        for(let col=0; col<4; col++){

            pdf.addImage(
                imgData,
                "JPEG",
                x + (col*45),
                y + (row*55),
                photoWidth,
                photoHeight
            );


            count++;

        }

    }


    pdf.save(
        "SARVATRA-passport-sheet.pdf"
    );

};  

// Reset Photo

document.getElementById("resetPhoto").onclick=function(){

    preview.src="";

    preview.style.display="none";

    canvas.style.display="none";

    controls.style.display="none";


    imgX=0;
    imgY=0;
    scale=1;


    document.getElementById("zoom").value=1;


    imageInput.value="";

};  

  

  
</script>
