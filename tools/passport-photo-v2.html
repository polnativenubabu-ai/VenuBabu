<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Passport Photo Creator V2 | SARVATRA</title>

<link rel="icon" href="../icon-192.png">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">

<style>

 *{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f3f5f9;
padding:20px;
color:#222;
}

.container{
max-width:900px;
margin:auto;
}

h2{
text-align:center;
color:#1565c0;
margin-bottom:8px;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:20px;
}

.card{
background:#fff;
padding:18px;
margin-bottom:18px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.image-box{
width:100%;
height:500px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
background:#f7f7f7;
border:2px dashed #ccc;
border-radius:10px;
}

#image{
max-width:100%;
display:none;
}

.controls{
display:flex;
gap:12px;
flex-wrap:wrap;
justify-content:center;
}

button{
padding:12px 22px;
border:none;
border-radius:8px;
background:#1565c0;
color:#fff;
font-size:15px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#0d47a1;
}

button:disabled{
background:#9e9e9e;
cursor:not-allowed;
}

input[type=file]{
width:100%;
padding:12px;
border:2px dashed #1565c0;
border-radius:8px;
background:#fafafa;
cursor:pointer;
}

#previewCanvas{
display:block;
margin:auto;
max-width:100%;
border:1px solid #ddd;
border-radius:8px;
background:#fff;
}

@media(max-width:768px){

.image-box{
height:340px;
}

.controls{
flex-direction:column;
}

button{
width:100%;
}

}

  select{

width:100%;
padding:12px;

border:2px solid #1565c0;

border-radius:8px;

font-size:15px;

background:#fff;

cursor:pointer;

margin-top:10px;

}


label{

font-weight:bold;

color:#333;

}
  

</style>

</head>

<body>

<div class="container">

<h2>Passport Photo Creator V2</h2>

<p class="subtitle">
Create Passport, Visa and ID Photos Easily
</p>

<!-- Upload -->

<div class="card">

<input
type="file"
id="imageInput"
accept="image/*">

</div>

<!-- Crop Area -->

<div class="card">

<div class="image-box">

<img id="image">

</div>

</div>

<!-- Controls -->

<div class="card controls">

<button id="cropBtn">
Crop Photo
</button>

<button id="resetBtn">
Reset
</button>

</div>

<!-- Preview -->

<div class="card">

<h3>Preview</h3>

<canvas id="previewCanvas"></canvas>

</div>

<!-- Download -->

 <div class="card">

<label>
Select A4 Photos Count:
</label>

<select id="photoCount">

<option value="8">8 Photos</option>

<option value="9">9 Photos (3x3)</option>  

<option value="12">12 Photos</option>

<option value="16">16 Photos</option>

<option value="25" selected>25 Photos</option>

</select>

 </div> 
  

<div class="card controls">

<button id="jpgBtn">
Download JPG
</button>

<button id="pdfBtn">
Download PDF
</button>

<button id="sheetBtn">
A4 Sheet
</button>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

  const imageInput = document.getElementById("imageInput");
const image = document.getElementById("image");
const previewCanvas = document.getElementById("previewCanvas");

const cropBtn = document.getElementById("cropBtn");
const resetBtn = document.getElementById("resetBtn");
const jpgBtn = document.getElementById("jpgBtn");
const pdfBtn = document.getElementById("pdfBtn");
const sheetBtn = document.getElementById("sheetBtn");

let cropper = null;
let croppedImage = null;

// ప్రారంభంలో Download Buttons Disable
cropBtn.disabled = true;
jpgBtn.disabled = true;
pdfBtn.disabled = true;
sheetBtn.disabled = true;

imageInput.addEventListener("change", function (e) {

    const file = e.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function (event) {

        image.src = event.target.result;
        image.style.display = "block";

        image.onload = function () {

            // పాత Cropper ఉంటే తొలగించు
            if (cropper) {
                cropper.destroy();
            }

            cropper = new Cropper(image, {

                aspectRatio: 35 / 45,
                viewMode: 1,
                autoCropArea: 1,
                responsive: true,
                background: false,
                movable: true,
                zoomable: true,
                scalable: false,
                rotatable: false

            });

            cropBtn.disabled = false;

            jpgBtn.disabled = true;
            pdfBtn.disabled = true;
            sheetBtn.disabled = true;

        };

    };

    reader.readAsDataURL(file);

});

  cropBtn.addEventListener("click", function () {

    if (!cropper) return;

    // High Quality Passport Size
    const canvas = cropper.getCroppedCanvas({

        width: 413,
        height: 531,
        imageSmoothingEnabled: true,
        imageSmoothingQuality: "high"

    });

    // Preview Canvas Size
    previewCanvas.width = canvas.width;
    previewCanvas.height = canvas.height;

    const ctx = previewCanvas.getContext("2d");

    ctx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
    ctx.drawImage(canvas, 0, 0);

    // JPG కోసం Store చేయి
    croppedImage = canvas.toDataURL("image/jpeg", 1.0);

    // Download Buttons Enable
    jpgBtn.disabled = false;
    pdfBtn.disabled = false;
    sheetBtn.disabled = false;

});

  jpgBtn.addEventListener("click", function(){

    if(!croppedImage) return;

    const link = document.createElement("a");

    link.href = croppedImage;
    link.download = "SARVATRA-passport-photo.jpg";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

});

  pdfBtn.addEventListener("click", function(){

    if(!croppedImage) return;

    const { jsPDF } = window.jspdf;

    const pdf = new jsPDF({

        orientation: "portrait",
        unit: "mm",
        format: "a4"

    });


    // Passport photo size approx
    const imgWidth = 35;
    const imgHeight = 45;


    pdf.addImage(
        croppedImage,
        "JPEG",
        20,
        20,
        imgWidth,
        imgHeight
    );


    pdf.save("SARVATRA-passport-photo.pdf");

});


  const photoCount = document.getElementById("photoCount");


sheetBtn.addEventListener("click", function(){

    if(!croppedImage) return;


    const { jsPDF } = window.jspdf;

    const pdf = new jsPDF({

        orientation:"portrait",
        unit:"mm",
        format:"a4"

    });


    const count = Number(photoCount.value);


    const imgWidth = 35;
    const imgHeight = 45;


    let cols;
    let rows;


    if(count === 8){

        cols = 2;
        rows = 4;

    }
    else if(count === 9){

    cols = 3;
    rows = 3;

      }
    else if(count === 12){

        cols = 3;
        rows = 4;

    }
    else if(count === 16){

        cols = 4;
        rows = 4;

    }
      else if(count === 25){

    cols = 5;
    rows = 5;

      }


    const pageWidth = 210;
const pageHeight = 297;

const gapX = 5;
const gapY = 5;


const totalWidth = (cols * imgWidth) + ((cols - 1) * gapX);
const totalHeight = (rows * imgHeight) + ((rows - 1) * gapY);


let x = (pageWidth - totalWidth) / 2;
let y = (pageHeight - totalHeight) / 2;


    for(let r = 0; r < rows; r++){

        for(let c = 0; c < cols; c++){


            pdf.addImage(
                croppedImage,
                "JPEG",
                x,
                y,
                imgWidth,
                imgHeight
            );


            x += imgWidth + gapX;

        }


        x = (pageWidth - totalWidth) / 2;
        y += imgHeight + gapY;

    }


    pdf.save(
        "SARVATRA-A4-" + count + "-photos.pdf"
    );


});

  

  resetBtn.addEventListener("click", function(){

    // Cropper remove
    if(cropper){

        cropper.destroy();
        cropper = null;

    }


    // Image reset
    image.src = "";
    image.style.display = "none";


    // File input reset
    imageInput.value = "";


    // Canvas reset
    const ctx = previewCanvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        previewCanvas.width,
        previewCanvas.height
    );


    previewCanvas.width = 0;
    previewCanvas.height = 0;


    // Stored image clear
    croppedImage = null;


    // Buttons reset
    cropBtn.disabled = true;
    jpgBtn.disabled = true;
    pdfBtn.disabled = true;
    sheetBtn.disabled = true;


});
  

</script>

</body>

</html>
