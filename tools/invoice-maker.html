<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SARVATRA - Invoice Maker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#eef3f8;color:#172033}
.header{background:linear-gradient(135deg,#075985,#0284c7);color:white;padding:16px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.15)}
.header h1{font-size:25px;font-weight:800}.header p{margin-top:4px;font-size:13px}
.home-btn{display:block;width:calc(100% - 24px);max-width:900px;margin:14px auto 0;padding:12px;background:white;color:#075985;text-align:center;text-decoration:none;border-radius:10px;font-weight:bold;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.container{max-width:900px;margin:auto;padding:14px 12px 30px}
.card{background:white;border-radius:15px;padding:17px;margin-bottom:15px;box-shadow:0 4px 15px rgba(0,0,0,.08)}
.card-title{color:#075985;font-size:18px;font-weight:bold;margin-bottom:14px;border-left:4px solid #0284c7;padding-left:9px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:5px}
input,textarea,select{width:100%;padding:11px;border:1px solid #ccd6df;border-radius:9px;outline:none;font-size:14px;background:#fff}
input:focus,textarea:focus,select:focus{border-color:#0284c7;box-shadow:0 0 0 2px rgba(2,132,199,.12)}
textarea{min-height:75px;resize:vertical}
.item-header{display:grid;grid-template-columns:2fr .7fr 1fr 1fr 42px;gap:7px;font-size:12px;font-weight:bold;margin-bottom:6px;color:#64748b}
.item-row{display:grid;grid-template-columns:2fr .7fr 1fr 1fr 42px;gap:7px;margin-bottom:8px}
.item-row input{padding:10px 7px}
.buttons{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
button{border:0;border-radius:9px;padding:11px 15px;font-weight:bold;cursor:pointer}
.add-btn{background:#0284c7;color:white}.print-btn{background:#16a34a;color:white}.reset-btn{background:#475569;color:white}
.delete-btn{background:#dc2626;color:white;padding:9px}
.invoice{background:white;padding:28px;max-width:850px;margin:auto}
.invoice-top{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid #075985;padding-bottom:16px}
.company-name{color:#075985;font-size:27px;font-weight:bold}.invoice-label{text-align:right}.invoice-label h1{font-size:30px;color:#075985}
.info{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:20px 0;font-size:14px;line-height:1.6}
table{width:100%;border-collapse:collapse}th,td{border:1px solid #d7dee5;padding:9px;font-size:13px}th{background:#e8f4fb;color:#075985}.right{text-align:right}
.totals{width:320px;margin-left:auto;margin-top:18px}.total-line{display:flex;justify-content:space-between;padding:7px}
.grand-total{border-top:2px solid #075985;font-size:19px;font-weight:bold;margin-top:5px;padding-top:10px}
.invoice-footer{border-top:1px solid #ddd;margin-top:28px;padding-top:12px;font-size:12px;color:#555}
@media(max-width:650px){
.grid{grid-template-columns:1fr}.item-header{display:none}
.item-row{grid-template-columns:1fr 1fr;padding:10px;background:#f7fafc;border-radius:9px}
.item-row input:first-child{grid-column:1/-1}.invoice-top{flex-direction:column}.invoice-label{text-align:left}
.info{grid-template-columns:1fr}.invoice{padding:17px}.totals{width:100%}th,td{padding:6px 4px}
}
@media print{
@page{size:A4;margin:10mm}
html,body{background:white!important;margin:0!important;padding:0!important}
.no-print,.header,.home-btn{display:none!important}
.container{max-width:none!important;width:100%!important;margin:0!important;padding:0!important}
.preview-card{box-shadow:none!important;border:none!important;margin:0!important;padding:0!important}
.invoice{display:block!important;width:100%!important;max-width:none!important;margin:0!important;padding:0!important;background:white!important}
}
</style>
</head>
<body>
<div class="header no-print"><h1>🧾 SARVATRA</h1><p>Professional Invoice Maker</p></div>
<a href="../index.html" class="home-btn no-print">🏠 SARVATRA Home</a>
<div class="container">

<div class="card no-print"><div class="card-title">🏢 Business Details</div><div class="grid">
<div class="field"><label>Business Name</label><input id="businessName" value="SARVATRA SERVICES"></div>
<div class="field"><label>Invoice Number</label><input id="invoiceNumber" value="INV-001"></div>
<div class="field"><label>Phone Number</label><input id="businessPhone" placeholder="Enter phone number"></div>
<div class="field"><label>Email</label><input id="businessEmail" placeholder="Enter email"></div>
<div class="field"><label>GSTIN</label><input id="gstin" placeholder="Optional"></div>
<div class="field"><label>Invoice Date</label><input id="invoiceDate" type="date"></div>
</div></div>

<div class="card no-print"><div class="card-title">👤 Customer Details</div><div class="grid">
<div class="field"><label>Customer Name</label><input id="customerName" placeholder="Customer name"></div>
<div class="field"><label>Customer Phone</label><input id="customerPhone" placeholder="Customer phone"></div>
<div class="field" style="grid-column:1/-1"><label>Customer Address</label><textarea id="customerAddress" placeholder="Customer address"></textarea></div>
</div></div>

<div class="card no-print"><div class="card-title">🛒 Invoice Items</div>
<div class="item-header"><div>Item / Service</div><div>Qty</div><div>Rate</div><div>Amount</div><div></div></div>
<div id="items"></div>
<button class="add-btn" onclick="addItem()">＋ Add Item</button>
</div>

<div class="card no-print"><div class="card-title">💰 Payment & Tax</div><div class="grid">
<div class="field"><label>Discount (₹)</label><input id="discount" type="number" value="0" min="0"></div>
<div class="field"><label>GST (%)</label><input id="gst" type="number" value="0" min="0"></div>
<div class="field"><label>Payment Method</label><select id="paymentMethod"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Card</option><option>Other</option></select></div>
<div class="field"><label>Notes</label><input id="notes" value="Thank you for your business!"></div>
</div>
<div class="buttons">
<button class="print-btn" onclick="printInvoice()">🖨️ Print / Save PDF</button>
<button class="reset-btn" onclick="resetInvoice()">🔄 Reset</button>
</div></div>

<div class="card preview-card"><div class="invoice" id="invoicePreview"></div></div>
</div>

<script>
document.getElementById("invoiceDate").value=new Date().toISOString().split("T")[0];

function addItem(){
 const row=document.createElement("div");
 row.className="item-row";
 row.innerHTML=`
 <input class="item-name" placeholder="Item / Service">
 <input class="item-qty" type="number" min="0" value="1">
 <input class="item-rate" type="number" min="0" value="0">
 <input class="item-amount" type="text" value="0.00" readonly>
 <button type="button" class="delete-btn">×</button>`;
 row.querySelector(".delete-btn").addEventListener("click",()=>{row.remove();updateInvoice()});
 row.querySelectorAll("input").forEach(i=>i.addEventListener("input",updateInvoice));
 document.getElementById("items").appendChild(row);
 updateInvoice();
}

function money(value){
 return "₹"+Number(value||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function escapeHTML(value){
 return String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function updateInvoice(){
 let subtotal=0,rows="";
 document.querySelectorAll(".item-row").forEach((row,index)=>{
  const name=row.querySelector(".item-name").value||"Item";
  const qty=Number(row.querySelector(".item-qty").value)||0;
  const rate=Number(row.querySelector(".item-rate").value)||0;
  const amount=qty*rate; subtotal+=amount;
  row.querySelector(".item-amount").value=amount.toFixed(2);
  rows+=`<tr><td>${index+1}</td><td>${escapeHTML(name)}</td><td class="right">${qty}</td><td class="right">${money(rate)}</td><td class="right">${money(amount)}</td></tr>`;
 });
 const discount=Math.max(0,Number(document.getElementById("discount").value)||0);
 const gstRate=Math.max(0,Number(document.getElementById("gst").value)||0);
 const taxable=Math.max(0,subtotal-discount);
 const gstAmount=taxable*gstRate/100;
 const grandTotal=taxable+gstAmount;
 const v=id=>document.getElementById(id).value;
 const business=v("businessName")||"SARVATRA SERVICES";
 const invoiceNo=v("invoiceNumber")||"INV-001";
 const phone=v("businessPhone"),email=v("businessEmail"),gstin=v("gstin"),date=v("invoiceDate");
 const customer=v("customerName")||"Customer",customerPhone=v("customerPhone"),customerAddress=v("customerAddress");
 const payment=v("paymentMethod"),notes=v("notes");
 document.getElementById("invoicePreview").innerHTML=`
 <div class="invoice-top"><div><div class="company-name">${escapeHTML(business)}</div>
 <div>${escapeHTML(phone)}</div><div>${escapeHTML(email)}</div>
 ${gstin?`<div><b>GSTIN:</b> ${escapeHTML(gstin)}</div>`:""}</div>
 <div class="invoice-label"><h1>INVOICE</h1><div><b>No:</b> ${escapeHTML(invoiceNo)}</div><div><b>Date:</b> ${escapeHTML(date)}</div></div></div>
 <div class="info"><div><b>Bill To</b><br>${escapeHTML(customer)}<br>${escapeHTML(customerPhone)}<br>${escapeHTML(customerAddress).replace(/\n/g,"<br>")}</div>
 <div><b>Payment Method</b><br>${escapeHTML(payment)}</div></div>
 <table><thead><tr><th>#</th><th>Item / Service</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead>
 <tbody>${rows||`<tr><td colspan="5" style="text-align:center">No items added</td></tr>`}</tbody></table>
 <div class="totals"><div class="total-line"><span>Subtotal</span><b>${money(subtotal)}</b></div>
 <div class="total-line"><span>Discount</span><b>- ${money(discount)}</b></div>
 <div class="total-line"><span>GST (${gstRate}%)</span><b>${money(gstAmount)}</b></div>
 <div class="total-line grand-total"><span>Grand Total</span><span>${money(grandTotal)}</span></div></div>
 <div class="invoice-footer"><b>Notes:</b> ${escapeHTML(notes)}<br><br>Thank you for your business!<br><b>SARVATRA</b></div>`;
}

function printInvoice(){
 updateInvoice();
 document.body.classList.add("printing");
 setTimeout(()=>{window.print();},100);
}
window.addEventListener("afterprint",()=>document.body.classList.remove("printing"));

function resetInvoice(){
 if(!confirm("Reset this invoice?"))return;
 document.getElementById("businessName").value="SARVATRA SERVICES";
 document.getElementById("invoiceNumber").value="INV-001";
 ["businessPhone","businessEmail","gstin","customerName","customerPhone","customerAddress"].forEach(id=>document.getElementById(id).value="");
 document.getElementById("discount").value=0;
 document.getElementById("gst").value=0;
 document.getElementById("paymentMethod").value="Cash";
 document.getElementById("notes").value="Thank you for your business!";
 document.getElementById("invoiceDate").value=new Date().toISOString().split("T")[0];
 document.getElementById("items").innerHTML="";
 addItem();
 updateInvoice();
}

["businessName","invoiceNumber","businessPhone","businessEmail","gstin","invoiceDate","customerName","customerPhone","customerAddress","discount","gst","paymentMethod","notes"].forEach(id=>{
 const el=document.getElementById(id);
 el.addEventListener("input",updateInvoice);el.addEventListener("change",updateInvoice);
});
addItem();
</script>
</body>
</html>
