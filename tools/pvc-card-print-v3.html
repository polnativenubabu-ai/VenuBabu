<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SARVATRA Document Card Cutter</title>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        linear-gradient(135deg,#eef7ff,#f4fff8);
    min-height:100vh;
    color:#123;
}

/* =========================
   HEADER
========================= */

.header{
    background:
        linear-gradient(135deg,#0066ff,#00a86b);
    color:white;
    padding:18px 15px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.18);
    position:sticky;
    top:0;
    z-index:50;
}

.header h1{
    font-size:22px;
    font-weight:800;
}

.header p{
    margin-top:5px;
    font-size:13px;
    opacity:.95;
}

/* =========================
   MAIN
========================= */

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:18px 14px 35px;
}

/* =========================
   HOME BUTTON
========================= */

.home-btn{
    display:block;
    width:100%;
    border:0;
    border-radius:14px;
    padding:13px;
    margin-bottom:15px;

    background:
        linear-gradient(135deg,#0066ff,#00a86b);

    color:white;
    font-size:15px;
    font-weight:700;

    cursor:pointer;
    box-shadow:0 5px 14px rgba(0,0,0,.15);
}

.home-btn:active{
    transform:scale(.98);
}

/* =========================
   UPLOAD CARD
========================= */

.upload-card{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.10);
    margin-bottom:18px;
}

.upload-title{
    font-size:19px;
    font-weight:800;
    margin-bottom:8px;
}

.upload-info{
    color:#667;
    font-size:13px;
    line-height:1.5;
    margin-bottom:16px;
}

/* =========================
   FILE INPUT
========================= */

.file-label{
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;

    min-height:110px;
    border:2px dashed #1596ff;
    border-radius:17px;

    background:#f5fbff;
    color:#0066cc;

    cursor:pointer;
    padding:15px;

    transition:.2s;
}

.file-label:hover{
    background:#edf8ff;
}

.file-label strong{
    display:block;
    font-size:16px;
}

.file-label span{
    display:block;
    font-size:12px;
    margin-top:6px;
    color:#667;
}

#fileInput{
    display:none;
}

/* =========================
   STATUS
========================= */

.status{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:12px;
    background:#eef8ff;
    color:#075a9c;
    font-size:13px;
    text-align:center;
}

/* =========================
   WORK AREA
========================= */

.work-area{
    display:none;
}

.section-title{
    font-size:19px;
    font-weight:800;
    margin:18px 2px 12px;
}

/* =========================
   ORIGINAL PREVIEW
========================= */

.original-card{
    background:white;
    border-radius:18px;
    padding:12px;
    box-shadow:0 6px 20px rgba(0,0,0,.09);
    margin-bottom:15px;
}

.original-card canvas{
    display:block;
    max-width:100%;
    width:auto;
    height:auto;
    margin:auto;
    border-radius:10px;
}

/* =========================
   DETECTED CARDS
========================= */

.cards-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(260px,1fr));

    gap:15px;
}

.card-item{
    background:white;
    border-radius:18px;
    padding:12px;

    box-shadow:0 7px 22px rgba(0,0,0,.10);
}

.card-label{
    font-weight:800;
    font-size:15px;
    margin-bottom:9px;
}

.card-preview{
    width:100%;
    background:#f1f3f5;
    border-radius:12px;
    overflow:hidden;
    min-height:130px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.card-preview canvas{
    display:block;
    max-width:100%;
    max-height:300px;
}

/* =========================
   ACTION BUTTONS
========================= */

.action-buttons{
    display:grid;
    grid-template-columns:
        repeat(2,1fr);

    gap:10px;
    margin-top:18px;
}

.action-buttons button{
    border:0;
    border-radius:13px;
    padding:13px 8px;

    font-size:14px;
    font-weight:700;

    cursor:pointer;
    color:white;

    box-shadow:0 4px 12px rgba(0,0,0,.12);
}

.preview-btn{
    background:#1565c0;
}

.jpg-btn{
    background:#00897b;
}

.pdf-btn{
    background:#e53935;
}

.print-btn{
    background:#6a1b9a;
}

.reset-btn{
    background:#455a64;
}

.action-buttons button:active{
    transform:scale(.97);
}

/* =========================
   MODAL
========================= */

.modal{
    display:none;

    position:fixed;
    inset:0;

    background:rgba(0,0,0,.72);

    z-index:100;

    padding:15px;

    overflow:auto;
}

.modal-box{
    width:100%;
    max-width:700px;

    background:white;

    border-radius:20px;

    margin:20px auto;

    padding:15px;

    box-shadow:0 10px 40px rgba(0,0,0,.35);
}

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:12px;
}

.modal-head h2{
    font-size:18px;
}

.close-btn{
    border:0;
    background:#ef5350;
    color:white;

    width:36px;
    height:36px;

    border-radius:50%;

    font-size:18px;
    cursor:pointer;
}

.preview-list{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.preview-item{
    background:#f5f6f7;
    border-radius:13px;
    padding:10px;
}

.preview-item h3{
    font-size:14px;
    margin-bottom:8px;
}

.preview-item canvas{
    display:block;
    max-width:100%;
    height:auto;
    margin:auto;
    background:white;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:500px){

    .container{
        padding-left:10px;
        padding-right:10px;
    }

    .upload-card{
        padding:15px;
    }

    .action-buttons{
        grid-template-columns:1fr 1fr;
    }

}

/* =========================
   PRINT
========================= */

@media print{

    body{
        background:white;
    }

    .header,
    .home-btn,
    .upload-card,
    .original-card,
    .action-buttons,
    .section-title,
    .modal{
        display:none !important;
    }

    .work-area{
        display:block !important;
    }

    .cards-grid{
        display:block;
    }

    .card-item{
        box-shadow:none;
        page-break-inside:avoid;
        margin-bottom:20px;
    }

    .card-preview{
        background:white;
    }

}

</style>

</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

    <h1>✂️ SARVATRA Document Card Cutter</h1>

    <p>
        Aadhaar • ID Cards • Documents • Front & Back
    </p>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="container">


    <!-- HOME -->

    <button
        class="home-btn"
        onclick="goHome()">

        🏠 SARVATRA Home

    </button>


    <!-- =========================
         UPLOAD
    ========================= -->

    <section class="upload-card">

        <div class="upload-title">
            📄 Upload Document
        </div>

        <div class="upload-info">

            JPG, JPEG, PNG లేదా PDF document upload చేయండి.
            Aadhaar లాంటి cardsలో Front / Back pagesని
            automaticగా detect చేసి crop చేయడానికి ప్రయత్నిస్తుంది.

        </div>


        <label
            class="file-label"
            for="fileInput">

            <div>

                <strong>
                    📤 Document Upload చేయండి
                </strong>

                <span>
                    JPG • JPEG • PNG • PDF
                </span>

            </div>

        </label>


        <input
            type="file"
            id="fileInput"
            accept=".jpg,.jpeg,.png,.pdf,image/jpeg,image/png,application/pdf">


        <div
            id="status"
            class="status">
        </div>

    </section>


    <!-- =========================
         WORK AREA
    ========================= -->

    <section
        id="workArea"
        class="work-area">


        <div class="section-title">
            🔍 Original Document
        </div>


        <div class="original-card">

            <canvas id="originalCanvas"></canvas>

        </div>


        <div class="section-title">
            ✂️ Cropped Cards
        </div>


        <div
            id="cardsGrid"
            class="cards-grid">
        </div>


        <!-- ACTIONS -->

        <div class="action-buttons">

            <button
                class="preview-btn"
                onclick="openPreview()">

                👁️ Preview

            </button>


            <button
                class="jpg-btn"
                onclick="downloadAllJPG()">

                📥 Download JPG

            </button>


            <button
                class="pdf-btn"
                onclick="downloadPDF()">

                📄 Download PDF

            </button>


            <button
                class="print-btn"
                onclick="printCards()">

                🖨️ Print Card

            </button>


            <button
                class="reset-btn"
                onclick="resetTool()">

                🔄 Reset

            </button>

        </div>

    </section>

</main>


<!-- =========================
     PREVIEW MODAL
========================= -->

<div
    id="previewModal"
    class="modal">

    <div class="modal-box">

        <div class="modal-head">

            <h2>
                👁️ Card Preview
            </h2>

            <button
                class="close-btn"
                onclick="closePreview()">

                ×

            </button>

        </div>


        <div
            id="previewList"
            class="preview-list">
        </div>

    </div>

</div>


<script>

/* =========================================
   PDF.JS SETUP
========================================= */

if(window.pdfjsLib){

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

}


/* =========================================
   GLOBAL VARIABLES
========================================= */

let sourceCanvas = null;

let croppedCards = [];

let currentFile = null;


/* =========================================
   ELEMENTS
========================================= */

const fileInput =
    document.getElementById("fileInput");

const statusBox =
    document.getElementById("status");

const workArea =
    document.getElementById("workArea");

const originalCanvas =
    document.getElementById("originalCanvas");

const cardsGrid =
    document.getElementById("cardsGrid");

const previewModal =
    document.getElementById("previewModal");

const previewList =
    document.getElementById("previewList");


/* =========================================
   FILE UPLOAD
========================================= */

fileInput.addEventListener(
    "change",
    handleFile
);


async function handleFile(event){

    const file =
        event.target.files[0];

    if(!file) return;

    currentFile = file;

    resetResultsOnly();

    showStatus(
        "⏳ Document processing జరుగుతోంది..."
    );


    try{

        const type =
            file.type.toLowerCase();


        if(type === "application/pdf" ||
           file.name.toLowerCase().endsWith(".pdf")){

            await loadPDF(file);

        }
        else if(
            type === "image/jpeg" ||
            type === "image/png" ||
            /\.(jpg|jpeg|png)$/i.test(file.name)
        ){

            await loadImage(file);

        }
        else{

            throw new Error(
                "Unsupported file format"
            );

        }


        if(!sourceCanvas){

            throw new Error(
                "Document image create కాలేదు."
            );

        }


        detectAndCrop();


        workArea.style.display =
            "block";


        showStatus(
            "✅ Document processing complete."
        );

    }
    catch(error){

        console.error(error);

        showStatus(
            "❌ File process చేయలేకపోయాం. మరో JPG/PDF try చేయండి.",
            true
        );

    }

}


/* =========================================
   IMAGE LOAD
========================================= */

function loadImage(file){

    return new Promise(
        (resolve,reject)=>{

            const reader =
                new FileReader();


            reader.onload =
                function(e){

                    const img =
                        new Image();


                    img.onload =
                        function(){

                            drawImageToCanvas(
                                img
                            );

                            resolve();

                        };


                    img.onerror =
                        reject;


                    img.src =
                        e.target.result;

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(file);

        }
    );

}


/* =========================================
   DRAW IMAGE
========================================= */

function drawImageToCanvas(img){

    const maxSize =
        1800;

    let width =
        img.naturalWidth ||
        img.width;

    let height =
        img.naturalHeight ||
        img.height;


    const scale =
        Math.min(
            1,
            maxSize /
            Math.max(width,height)
        );


    width =
        Math.round(width * scale);

    height =
        Math.round(height * scale);


    originalCanvas.width =
        width;

    originalCanvas.height =
        height;


    const ctx =
        originalCanvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    ctx.drawImage(
        img,
        0,
        0,
        width,
        height
    );


    sourceCanvas =
        originalCanvas;

}


/* =========================================
   PDF LOAD
========================================= */

async function loadPDF(file){

    if(!window.pdfjsLib){

        throw new Error(
            "PDF library unavailable"
        );

    }


    const buffer =
        await file.arrayBuffer();


    const pdf =
        await pdfjsLib.getDocument({
            data:buffer
        }).promise;


    if(pdf.numPages < 1){

        throw new Error(
            "PDFలో page లేదు."
        );

    }


    /*
       First page is loaded here.
       Part 2 adds multi-page PDF
       handling and front/back detection.
    */

    const page =
        await pdf.getPage(1);


    const viewport =
        page.getViewport({
            scale:2
        });


    originalCanvas.width =
        viewport.width;

    originalCanvas.height =
        viewport.height;


    const ctx =
        originalCanvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );


    await page.render({
        canvasContext:ctx,
        viewport:viewport
    }).promise;


    sourceCanvas =
        originalCanvas;

}


/* =========================================
   STATUS
========================================= */

function showStatus(
    message,
    error=false
){

    statusBox.style.display =
        "block";

    statusBox.textContent =
        message;

    if(error){

        statusBox.style.background =
            "#fff0f0";

        statusBox.style.color =
            "#c62828";

    }
    else{

        statusBox.style.background =
            "#eef8ff";

        statusBox.style.color =
            "#075a9c";

    }

}


/* =========================================
   AUTO DETECT
========================================= */

function detectAndCrop(){

    croppedCards = [];


    const canvas =
        sourceCanvas;


    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );


    const width =
        canvas.width;

    const height =
        canvas.height;


    /*
       Initial intelligent border detection.
       Part 2 will complete:
       - background detection
       - connected components
       - Aadhaar front/back detection
       - perspective-safe crop
       - card aspect ratio correction
    */

    const imageData =
        ctx.getImageData(
            0,
            0,
            width,
            height
        );


    const bounds =
        findDocumentBounds(
            imageData,
            width,
            height
        );


    if(bounds){

        croppedCards.push(
            cropCanvas(
                canvas,
                bounds.x,
                bounds.y,
                bounds.width,
                bounds.height
            )
        );

    }
    else{

        croppedCards.push(
            cropCanvas(
                canvas,
                0,
                0,
                width,
                height
            )
        );

    }


    renderCards();

}


/* =========================================
   BASIC DOCUMENT BOUNDS
========================================= */

function findDocumentBounds(
    imageData,
    width,
    height
){

    const data =
        imageData.data;


    let minX =
        width;

    let minY =
        height;

    let maxX =
        -1;

    let maxY =
        -1;


    /*
       Detect pixels sufficiently different
       from the outer background.
    */

    const step =
        Math.max(
            2,
            Math.floor(
                Math.min(width,height)/500
            )
        );


    for(
        let y=0;
        y<height;
        y+=step
    ){

        for(
            let x=0;
            x<width;
            x+=step
        ){

            const i =
                (y*width+x)*4;


            const r =
                data[i];

            const g =
                data[i+1];

            const b =
                data[i+2];


            const brightness =
                (r+g+b)/3;


            /*
               Non-extreme pixels are considered
               possible document content.
            */

            if(
                brightness < 245 ||
                Math.max(r,g,b) -
                Math.min(r,g,b) > 18
            ){

                minX =
                    Math.min(minX,x);

                minY =
                    Math.min(minY,y);

                maxX =
                    Math.max(maxX,x);

                maxY =
                    Math.max(maxY,y);

            }

        }

    }


    if(maxX < 0){

        return null;

    }


    const margin =
        Math.max(
            4,
            Math.round(
                Math.min(width,height)*0.01
            )
        );


    minX =
        Math.max(
            0,
            minX-margin
        );

    minY =
        Math.max(
            0,
            minY-margin
        );

    maxX =
        Math.min(
            width-1,
            maxX+margin
        );

    maxY =
        Math.min(
            height-1,
            maxY+margin
        );


    return {

        x:minX,

        y:minY,

        width:
            maxX-minX+1,

        height:
            maxY-minY+1

    };

}



/* =========================================
   CROP CANVAS
========================================= */

function cropCanvas(
    canvas,
    x,
    y,
    width,
    height
){

    const result =
        document.createElement(
            "canvas"
        );
  
 result.width =
        width;

    result.height =
        height;


    const ctx =
        result.getContext(
            "2d"
        );


    ctx.drawImage(
        canvas,
        x,
        y,
        width,
        height,
        0,
        0,
        width,
        height
    );


    return result;

}


/* =========================================
   RENDER CROPPED CARDS
========================================= */

function renderCards(){

    cardsGrid.innerHTML =
        "";


    croppedCards.forEach(
        (canvas,index)=>{

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "card-item";


            const label =
                document.createElement(
                    "div"
                );


            label.className =
                "card-label";


            label.textContent =
                croppedCards.length > 1
                ? `Card ${index+1}`
                : "Detected Card";


            const preview =
                document.createElement(
                    "div"
                );


            preview.className =
                "card-preview";


            preview.appendChild(
                canvas
            );


            item.appendChild(
                label
            );

            item.appendChild(
                preview
            );


            cardsGrid.appendChild(
                item
            );

        }
    );

}


/* =========================================
   PREVIEW
========================================= */

function openPreview(){

    if(!croppedCards.length){

        alert(
            "ముందుగా document upload చేయండి."
        );

        return;

    }


    previewList.innerHTML =
        "";


    croppedCards.forEach(
        (canvas,index)=>{

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "preview-item";


            const title =
                document.createElement(
                    "h3"
                );


            title.textContent =
                `Card ${index+1}`;


            const clone =
                document.createElement(
                    "canvas"
                );


            clone.width =
                canvas.width;

            clone.height =
                canvas.height;


            clone.getContext("2d")
                .drawImage(
                    canvas,
                    0,
                    0
                );


            item.appendChild(
                title
            );

            item.appendChild(
                clone
            );


            previewList.appendChild(
                item
            );

        }
    );


    previewModal.style.display =
        "block";

}


/* =========================================
   CLOSE PREVIEW
========================================= */

function closePreview(){

    previewModal.style.display =
        "none";

}


previewModal.addEventListener(
    "click",
    function(e){

        if(e.target ===
           previewModal){

            closePreview();

        }

    }
);


/* =========================================
   DOWNLOAD JPG
========================================= */

function downloadAllJPG(){

    if(!croppedCards.length){

        alert(
            "ముందుగా document upload చేయండి."
        );

        return;

    }


    croppedCards.forEach(
        (canvas,index)=>{

            const link =
                document.createElement(
                    "a"
                );


            link.download =
                `SARVATRA-Card-${index+1}.jpg`;


            link.href =
                canvas.toDataURL(
                    "image/jpeg",
                    0.95
                );


            link.click();

        }
    );

}


/* =========================================
   DOWNLOAD PDF
========================================= */

function downloadPDF(){

    if(!croppedCards.length){

        alert(
            "ముందుగా document upload చేయండి."
        );

        return;

    }


    const {
        jsPDF
    } =
        window.jspdf;


    const first =
        croppedCards[0];


    const orientation =
        first.width >
        first.height
        ? "landscape"
        : "portrait";


    const pdf =
        new jsPDF({
            orientation:orientation,
            unit:"mm",
            format:"a4"
        });


    croppedCards.forEach(
        (canvas,index)=>{

            if(index > 0){

                pdf.addPage();

            }


            const pageW =
                pdf.internal.pageSize.getWidth();

            const pageH =
                pdf.internal.pageSize.getHeight();


            const margin =
                10;


            const ratio =
                Math.min(
                    (pageW-margin*2) /
                    canvas.width,

                    (pageH-margin*2) /
                    canvas.height
                );


            const w =
                canvas.width*ratio;

            const h =
                canvas.height*ratio;


            const x =
                (pageW-w)/2;

            const y =
                (pageH-h)/2;


            pdf.addImage(
                canvas.toDataURL(
                    "image/jpeg",
                    0.95
                ),
                "JPEG",
                x,
                y,
                w,
                h
            );

        }
    );


    pdf.save(
        "SARVATRA-Document-Cards.pdf"
    );

}


/* =========================================
   PRINT
========================================= */

function printCards(){

    if(!croppedCards.length){

        alert(
            "ముందుగా document upload చేయండి."
        );

        return;

    }


    openPreview();


    setTimeout(
        function(){

            window.print();

        },
        300
    );

}
